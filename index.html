<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easy POS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/easypos.svg" type="image/svg+xml">
<link rel="canonical" href="/indexpos">
<script>
/* The home page lives at /indexpos. Old QR/order links that point at the root carry ?t= / ?o= etc. and go to the order page. */
(function(){var q=new URLSearchParams(location.search);
  var order=['t','type','o','s','table'].some(function(k){return q.has(k)});
  location.replace((order?'/order':'/indexpos')+location.search+location.hash)})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/indexpos"></noscript>
</head>
<body style="font-family:system-ui,sans-serif;background:#0B1024;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0">
<a href="/indexpos" style="color:#9DB4FF">Easy POS</a>
</body>
</html>
