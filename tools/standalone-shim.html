<style>
.auth{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.auth .box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
.auth h1{margin:0;font-size:22px}

.auth .msg{padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn-ink);font-size:14px}
.auth .msg.ok{background:var(--ok-soft);color:var(--ok-ink)}
.auth .msg a{color:inherit;font-weight:700}

.auth .links button{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0;min-height:44px}
.lockwrap{position:fixed;inset:0;z-index:190;background:var(--bg);overflow-y:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lockwrap .inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#acct{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.bill{display:flex;flex-direction:column;gap:14px}
.bill-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bill-card h3{margin:0;font-size:16px}
.bill-stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bill-stat > div{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.bill-stat small{color:var(--muted);font-size:12px}
.bill-stat b{font-size:18px}
.bchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--ok-soft);color:var(--ok-ink)}
.bchip.warn{background:var(--warn-soft);color:var(--warn-ink)}.bchip.bad{background:var(--bad-soft);color:var(--bad-ink)}.bchip.mute{background:var(--sunk);color:var(--muted)}
.bill-pay{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.bill-qr{background:#fff;border-radius:12px;padding:10px;display:grid;place-items:center;min-height:200px;color:#666;font-size:13px;text-align:center}
.bill-months{display:flex;gap:6px;flex-wrap:wrap}
.bill-ct{display:grid!important;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}.bill-ct .ct-q img{width:150px;height:150px;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--line);padding:6px}.bill-ct .ct-q:empty{display:none}.bill-ct:has(.ct-q:empty){grid-template-columns:minmax(0,1fr)}.bill-ct .ct-q.gen{background:#fff;border-radius:12px;padding:6px;width:150px;height:150px;border:1px solid var(--line)}.bill-ct h3{margin:0 0 4px}.bill-ct p{margin:0 0 8px;color:var(--muted);font-size:14px}.bill-ct .ct-id{font-size:14px;margin-bottom:4px}.bill-ct .ct-id b{color:#06A847}.bill-ct .ct-add{display:inline-flex;align-items:center;justify-content:center;margin-top:6px;min-height:42px;padding:0 18px;border-radius:12px;background:#06C755;color:#fff;font-weight:700;text-decoration:none}@media (max-width:560px){.bill-ct{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}}
.bill-pks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.bill-pk{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}.bill-pk b{font-size:15px}.bill-pk .pp{font-size:18px;font-weight:800}.bill-pk small{color:var(--muted);font-size:12px;line-height:1.35}.bill-pk[aria-pressed=true]{border-color:var(--accent,#E39B2D);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#E39B2D) 22%,transparent)}.bill-pk .cur{font-size:11px;font-weight:700;color:var(--ok-ink,#166534);background:var(--ok-soft,#dcfce7);padding:1px 8px;border-radius:999px}
.bill-hist{display:flex;flex-direction:column}
.bill-hist .r{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.bill-hist .r:last-child{border-bottom:0}
.bill-hist .r .sp{flex:1}
.billpill{border:0;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;background:var(--warn-soft);color:var(--warn-ink);cursor:pointer}
.billpill.bad{background:var(--bad-soft);color:var(--bad-ink)}
.adminbar{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;background:var(--dark);color:var(--on-dark);font-size:13px;font-weight:600}
.adminbar a{color:inherit}
@media (max-width:640px){.bill-pay{grid-template-columns:minmax(0,1fr)}}
</style>

/* ---------- login screen ---------- */
var signup=false;

$('#authMode').addEventListener('click',function(){setMode(!signup);msg('')});
$('#authReset').addEventListener('click',function(){var e=$('#authEmail').value.trim();if(!e){msg('ใส่อีเมลก่อน แล้วกดลืมรหัสผ่านอีกครั้ง');return}

  sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname}).then(function(r){msg(r.error?'ส่งอีเมลไม่สำเร็จ: '+r.error.message:'ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลแล้ว',!r.error)})});
function out(){sb.auth.signOut().then(function(){location.reload()})}
$('#authOut').addEventListener('click',out);$('#lockOut').addEventListener('click',out);

  if(!e||p.length<6){msg('ใส่อีเมลหรือชื่อผู้ใช้ และรหัสผ่านอย่างน้อย 6 ตัวอักษร');return}
  if(signup&&raw.indexOf('@')<0){msg('การสมัครใช้อีเมล · พนักงานไม่ต้องสมัคร ให้ผู้จัดการร้านสร้างชื่อผู้ใช้ให้');return}
  $('#authBtn').disabled=true;
  var job=signup?sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}}):sb.auth.signInWithPassword({email:e,password:p});
  job.then(function(r){$('#authBtn').disabled=false;
    if(r.error){msg(/Invalid login/i.test(r.error.message)?'ชื่อผู้ใช้/อีเมล หรือรหัสผ่านไม่ถูกต้อง':/confirm/i.test(r.error.message)?'ยังไม่ได้ยืนยันอีเมล เปิดลิงก์ในอีเมลที่ได้รับก่อน':r.error.message);return}
    if(signup&&!r.data.session){msg('สมัครแล้ว เปิดลิงก์ยืนยันในอีเมล แล้วกลับมาเข้าสู่ระบบ',true);setMode(false);return}
    if(r.data&&r.data.session)syncCred(r.data.session.access_token,p);

function syncCred(tok,p){try{fetch(SB_URL+'/functions/v1/pos-signup',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({action:'remember',password:p})}).catch(function(){})}catch(e){}}
sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')location.reload();if(ev==='PASSWORD_RECOVERY'){var np=prompt('ตั้งรหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)');if(np&&np.length>=6)sb.auth.updateUser({password:np}).then(function(r){alert(r.error?'ตั้งรหัสผ่านไม่สำเร็จ':'ตั้งรหัสผ่านใหม่แล้ว')})}});
function loadSession(){return sb.rpc('pos_session',{p_slug:askSlug||null}).then(function(x){if(x.error)throw x.error;return x.data})}
function check(){
  sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(!s){showAuth('');return}
    email=s.user.email;
    loadSession().then(function(d){SESS=d;window.POS_SESSION=d;if(d&&d.shop&&window.cpTrack&&window.POS_SB)window.cpTrack('cafe-app',null,window.POS_SB);
      if(!d.shop){

        sb.rpc('pos_my_application').then(function(x){var a=x.data;
          if(a&&a.status==='pending')showAuth('คำขอเปิดร้าน “'+esc(a.shop_name)+'” รอผู้ดูแลระบบอนุมัติ'+(a.has_slip?' เราจะแจ้งทางอีเมลเมื่ออนุมัติแล้ว':' · ยังไม่ได้แนบสลิป <a href="/signup?id='+encodeURIComponent(a.id)+'&t='+encodeURIComponent(a.token)+'">แนบสลิป</a>'),true,true);

/* ---------- billing (shop side) ---------- */
function crc16(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}return ('0000'+c.toString(16).toUpperCase()).slice(-4)}
function ppPayload(id,amount){function t(tag,v){return tag+('0'+v.length).slice(-2)+v}var target=String(id||'').replace(/\D/g,'');if(!target)return '';
  var sub=target.length===13?t('02',target):target.length===15?t('03',target):t('01',('0000000000000'+target.replace(/^0/,'66')).slice(-13));
  var p=t('00','01')+t('01',amount?'12':'11')+t('29',t('00','A000000677010111')+sub)+t('58','TH')+t('53','764');if(amount)p+=t('54',Number(amount).toFixed(2));p+='6304';return p+crc16(p)}

function appendContact(el){var put=function(c){var bl=(SESS&&SESS.billing)||{};if((!c||c.on===false||!(c.qr||c.lineId||c.lineUrl))&&bl.line)c={lineId:/^https?:/i.test(bl.line)?'':bl.line,lineUrl:lineUrl(bl.line)};if(!c||c.on===false||!(c.qr||c.lineId||c.lineUrl))return;var root=el.querySelector('.bill')||el;if(root.querySelector('.bill-ct'))return;root.insertAdjacentHTML('beforeend',contactHtml(c));var q=root.querySelector('.bill-ct .ct-q');if(q&&!c.qr&&c.lineUrl&&typeof QRCode!=='undefined'){try{new QRCode(q,{text:c.lineUrl,width:138,height:138,correctLevel:QRCode.CorrectLevel.M});q.classList.add('gen')}catch(e){}}};
  if(CONTACT){put(CONTACT);return}sb.from('pos_platform').select('data').eq('key','contact').maybeSingle().then(function(r){CONTACT=(r.data&&r.data.data)||{on:false};put(CONTACT)},function(){})}
function baht(n){return '฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2})}
function dTh(iso){if(!iso)return '-';return new Date(iso).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}
function daysLeft(iso){return Math.ceil((new Date(iso).getTime()-Date.now())/86400000)}
function billState(sh){if(!sh)return {cls:'mute',t:'-'};if(sh.status==='suspended')return {cls:'bad',t:'ถูกระงับโดยผู้ดูแลระบบ'};

function submitPay(el,months,pkg){var f=el.querySelector('#billSlip').files[0],m=el.querySelector('#billMsg'),b=el.querySelector('#billSend');
  if(!f){m.textContent='แนบสลิปการโอนก่อน';return}if(!/^image\//.test(f.type)){m.textContent='สลิปต้องเป็นไฟล์รูปภาพ';return}

    return sb.storage.from('pos-slips').upload(path,blob,{contentType:'image/jpeg',upsert:false}).then(function(r){if(r.error)throw r.error;
      var args={p_sid:SID,p_months:months,p_slip:path,p_note:el.querySelector('#billNote').value||null};if(pkg)args.p_pkg=pkg;return sb.rpc('pos_pay_submit',args)})})

  .catch(function(e){b.disabled=false;m.textContent=/too_many_pending/.test(e.message||'')?'มีรายการรอตรวจสอบหลายรายการแล้ว รอผู้ดูแลระบบตรวจสอบก่อน':'ส่งไม่สำเร็จ: '+(e.message||'')})}

/* ---------- data store (same API the POS uses inside Claude) ---------- */
function E(e){var x={code:'unavailable',message:(e&&e.message)||String(e)};if(/free_items_limit|product_limit/.test(x.message)){x.code='free_limit';x.message=window.POS_FREE_MSG('items');return x}if(/free_bills_limit|bill_limit/.test(x.message)){x.code='free_limit';x.message=window.POS_FREE_MSG('bills');return x}if(e&&(e.code==='42501'||e.code==='P0002'||/row-level|permission|policy|not_found/i.test(x.message)))x.code='invalid_argument';return x}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-6)}
function snap(id,data){return {id:id,exists:data!=null,data:function(){return data==null?undefined:data},metadata:{fromCache:false,hasPendingWrites:false}}}
var subs=new Set();
function notify(col){subs.forEach(function(s){if(!col||s.col===col)s.kick()})}
function debounce(fn,ms){var t;return function(){clearTimeout(t);t=setTimeout(fn,ms)}}
function cmp(a,op,b){if(typeof b==='number')a=Number(a);if(op==='==')return a===b;if(op==='!=')return a!==b;if(op==='>=')return a>=b;if(op==='>')return a>b;if(op==='<')return a<b;if(op==='<=')return a<=b;if(op==='in')return b.indexOf(a)>=0;return true}
function T(){return sb.from('pos_data')}
function Doc(col,id){var ref={id:id,path:col+'/'+id,
  get:function(){return T().select('data').eq('shop_id',SID).eq('col',col).eq('id',id).maybeSingle().then(function(r){if(r.error)throw E(r.error);return snap(id,r.data?r.data.data:null)})},
  set:function(d){return T().upsert({shop_id:SID,col:col,id:id,data:d,updated_at:new Date().toISOString()}).then(function(r){if(r.error)throw E(r.error);notify(col)})},
  update:function(p){return sb.rpc('pos_data_update',{p_sid:SID,p_col:col,p_id:id,p_patch:p}).then(function(r){if(r.error)throw E(r.error);notify(col)})},
  delete:function(){return T().delete().eq('shop_id',SID).eq('col',col).eq('id',id).then(function(r){if(r.error)throw E(r.error);notify(col)})},
  acquire:function(o){return sb.rpc('pos_data_lease',{p_sid:SID,p_col:col,p_id:id,p_holder:o.holder,p_ttl_ms:o.ttlMs||30000}).then(function(r){if(r.error)throw E(r.error);return r.data})},
  onSnapshot:function(next,err){var s={col:col,kick:debounce(function(){ref.get().then(next).catch(function(){})},120)};subs.add(s);s.kick();return function(){subs.delete(s)}}};
  return ref}
function Query(col,f,o,l){var q={
  where:function(a,op,v){return Query(col,f.concat([[a,op,v]]),o,l)},
  orderBy:function(a,dir){return Query(col,f,[a,dir||'asc'],l)},
  limit:function(n){return Query(col,f,o,n)},
  get:function(){var r=T().select('id,data').eq('shop_id',SID).eq('col',col);
    f.forEach(function(x){var k='data->>'+x[0],v=String(x[2]);if(x[1]==='==')r=r.eq(k,v);else if(x[1]==='>=')r=r.gte(k,v);else if(x[1]==='>')r=r.gt(k,v);else if(x[1]==='<')r=r.lt(k,v);else if(x[1]==='<=')r=r.lte(k,v)});
    return r.limit(5000).then(function(res){if(res.error)throw E(res.error);
      var rows=(res.data||[]).filter(function(d){return f.every(function(x){return cmp(d.data[x[0]],x[1],x[2])})});
      if(o)rows.sort(function(a,b){var A=a.data[o[0]],B=b.data[o[0]];var c=A==null?1:B==null?-1:A<B?-1:A>B?1:0;return o[1]==='desc'?-c:c});
      if(l)rows=rows.slice(0,l);
      var docs=rows.map(function(d){return snap(d.id,d.data)});
      return {docs:docs,size:docs.length,empty:!docs.length,docChanges:function(){return []},metadata:{fromCache:false,hasPendingWrites:false}}})},
  onSnapshot:function(next,err){var s={col:col,kick:debounce(function(){q.get().then(next).catch(function(){})},150)};subs.add(s);s.kick();return function(){subs.delete(s)}},
  doc:function(id){return Doc(col,id||uid())},
  add:function(d){var r=Doc(col,uid());return r.set(d).then(function(){return r})}};
  return q}
var db={doc:function(p){var a=p.split('/');return Doc(a[0],a[1])},collection:function(p){return Query(p,[],null,null)}};
var rtStarted=false;
function startRealtime(){if(rtStarted)return;rtStarted=true;

check();
