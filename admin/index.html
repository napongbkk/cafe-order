<html lang="th">
<head>

<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F2A37">
<title>ผู้ดูแลระบบ POS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F3F7FC;--surface:#FFFFFF;--sunk:#E9F0F8;--ink:#1F2A37;--muted:#5B6B7D;--line:#E1E8F0;--line2:#CDD8E4;
  --accent:#2F6FB0;--accent-hover:#275E96;--on-accent:#FFFFFF;--accent-soft:#E3F0FC;--accent-soft-ink:#1E4F80;
  --ok:#2E9D62;--ok-soft:#E5F6EE;--ok-ink:#19663F;--warn:#E0A100;--warn-soft:#FFF6D9;--warn-ink:#7A5600;--bad:#D9534F;--bad-soft:#FDECEC;--bad-ink:#A12020;
  --dark:#1F2A37;--on-dark:#FFFFFF;--shadow:0 6px 24px rgba(31,42,55,.08);
  --f:'IBM Plex Sans Thai',system-ui,sans-serif;--fn:'IBM Plex Mono',ui-monospace,monospace;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1620;--surface:#18212D;--sunk:#222D3B;--ink:#E6EDF5;--muted:#9DADBF;--line:#263243;--line2:#34435A;
  --accent:#8EC5F0;--accent-hover:#A9D3F5;--on-accent:#0B1D2E;--accent-soft:#1C3045;--accent-soft-ink:#B8DBF8;
  --ok:#5CCB8E;--ok-soft:#173326;--ok-ink:#9BE3BC;--warn:#F5C542;--warn-soft:#3A3014;--warn-ink:#F5D97A;--bad:#FF7B7B;--bad-soft:#3B1F1F;--bad-ink:#FFB5B5;
  --dark:#E6EDF5;--on-dark:#0F1620;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--fn)}
.app{display:flex;min-height:100%}
.rail{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand i{width:38px;height:38px;border-radius:12px;background:var(--dark);color:var(--on-dark);display:grid;place-items:center;font-style:normal;font-weight:700}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:12px;text-align:left;font-weight:600;color:var(--muted);cursor:pointer;min-height:44px}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-soft-ink)}
.nav .badge{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;display:inline-grid;place-items:center;font-size:12px;padding:0 6px}
.rail .sp{flex:1}
.me{font-size:13px;color:var(--muted);padding:8px;word-break:break-all}
main{flex:1;min-width:0;padding:24px max(24px,env(safe-area-inset-right,0px)) 40px 24px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:24px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.head .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--bad-ink);border-color:var(--bad)}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi small{color:var(--muted);font-size:13px;font-weight:600}
.kpi b{font-size:28px;font-family:var(--fn);font-weight:600}
.kpi.warn{border-color:var(--warn)}.kpi.bad{border-color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:17px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.scroll{overflow-x:auto}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--ok-soft);color:var(--ok-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}.chip.bad{background:var(--bad-soft);color:var(--bad-ink)}.chip.mute{background:var(--sunk);color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.form input,.form select,.form textarea{min-height:44px;padding:8px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:400}
.form input,.form select,.form textarea{width:100%;min-width:0}.form .two > *,.form .three > *{min-width:0}
.seg{align-self:flex-start;flex-wrap:wrap}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.note{padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn-ink);font-size:14px}
.note.ok{background:var(--ok-soft);color:var(--ok-ink)}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(15,22,32,.45);display:flex;justify-content:flex-end}
.drawer .pane{width:min(520px,100%);height:100%;overflow-y:auto;background:var(--bg);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.drawer .ph{display:flex;align-items:center;gap:10px}.drawer .ph h2{margin:0;font-size:19px;flex:1}
.pays{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pay{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pay .slip{aspect-ratio:3/4;max-height:280px;border-radius:12px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:zoom-in;border:0;padding:0}
.pay .slip img{width:100%;height:100%;object-fit:contain;background:#fff}
.pay .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--dark);color:var(--on-dark);padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:calc(100% - 32px)}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth .box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.zoom{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px;cursor:zoom-out;border:0;width:100%}
.zoom img{max-width:100%;max-height:100%}
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}.acct:last-child{border-bottom:0}.acct .who{flex:1;min-width:200px;display:flex;flex-direction:column}.acct .acts{display:flex;gap:6px}
.pwc{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}.pwc code{font-family:var(--fn);font-size:14px;font-weight:600;background:var(--bg,#f3f6fa);padding:3px 8px;border-radius:6px;user-select:all;color:var(--ink)}
.pwbox{display:flex;gap:8px;align-items:center;padding:12px;border-radius:12px;background:var(--ok-soft);color:var(--ok-ink)}.pwbox code{font-family:var(--fn);font-size:20px;font-weight:600;flex:1;user-select:all;color:var(--ink)}
.search{min-height:40px;padding:6px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);min-width:220px}
@media (max-width:860px){.app{flex-direction:column}.rail{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:10px}.brand{padding:4px 8px;width:100%}.nav{width:auto}.rail .sp,.me{display:none}.grid2{grid-template-columns:minmax(0,1fr)}main{padding:16px}.form .two,.form .three{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div id="authView" class="auth" hidden><form class="box form" id="loginForm">
  <div class="brand" style="padding:0"><i style="background:none;overflow:hidden"><svg viewBox="0 0 64 64" width="100%" height="100%" role="img" aria-label="POS คาเฟ่"><defs><linearGradient id="bmG3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6AA8E6"/><stop offset="1" stop-color="#245C96"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#bmG3)"/><circle cx="18" cy="14" r="22" fill="#fff" opacity=".08"/><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".9"><path d="M26 22c-2.2-2.6 2.2-4.6 0-7.4"/><path d="M33.5 22c-2.2-2.6 2.2-4.6 0-7.4"/></g><path d="M17 27h26v8.5A10.5 10.5 0 0 1 32.5 46h-5A10.5 10.5 0 0 1 17 35.5z" fill="#fff"/><path d="M43 30.5h2.5a4.75 4.75 0 0 1 0 9.5H42.4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><rect x="13" y="48.5" width="34" height="3.5" rx="1.75" fill="#fff" opacity=".85"/><path d="M27.5 33.5c1.4-1.6 3.6-1.6 5 0" fill="none" stroke="#2F6FB0" stroke-width="2.2" stroke-linecap="round"/></svg></i><div><b>ผู้ดูแลระบบ POS</b><small>จัดการร้านค้าและค่าบริการ</small></div></div>
  <div class="note" id="loginMsg" hidden></div>
  <label for="lgEmail">อีเมล<input id="lgEmail" type="email" autocomplete="username" required></label>
  <label for="lgPass">รหัสผ่าน<input id="lgPass" type="password" autocomplete="current-password" required minlength="6"></label>

</form></div>
<div class="app" id="appView" hidden>
  <nav class="rail" aria-label="เมนูผู้ดูแลระบบ">
    <div class="brand"><i style="background:none;overflow:hidden"><svg viewBox="0 0 64 64" width="100%" height="100%" role="img" aria-label="POS คาเฟ่"><defs><linearGradient id="bmG4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6AA8E6"/><stop offset="1" stop-color="#245C96"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#bmG4)"/><circle cx="18" cy="14" r="22" fill="#fff" opacity=".08"/><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".9"><path d="M26 22c-2.2-2.6 2.2-4.6 0-7.4"/><path d="M33.5 22c-2.2-2.6 2.2-4.6 0-7.4"/></g><path d="M17 27h26v8.5A10.5 10.5 0 0 1 32.5 46h-5A10.5 10.5 0 0 1 17 35.5z" fill="#fff"/><path d="M43 30.5h2.5a4.75 4.75 0 0 1 0 9.5H42.4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><rect x="13" y="48.5" width="34" height="3.5" rx="1.75" fill="#fff" opacity=".85"/><path d="M27.5 33.5c1.4-1.6 3.6-1.6 5 0" fill="none" stroke="#2F6FB0" stroke-width="2.2" stroke-linecap="round"/></svg></i><div><b>ผู้ดูแลระบบ</b><small>POS คาเฟ่</small></div></div>
    <button class="nav" data-go="home">ภาพรวม</button>
    <button class="nav" data-go="apps">คำขอเปิดร้าน<span class="badge" id="appBadge" hidden></span></button>
    <button class="nav" data-go="shops">ร้านค้า</button>
    <button class="nav" data-go="users">บัญชีผู้ใช้</button>
    <button class="nav" data-go="pays">การชำระเงิน<span class="badge" id="payBadge" hidden></span></button>
    <button class="nav" data-go="settings">ตั้งค่าระบบ</button>
    <span class="sp"></span>
    <div class="me" id="meBox"></div>
    <button class="nav" id="logoutBtn">ออกจากระบบ</button>
  </nav>
  <main id="main"></main>
</div>
<div id="drawer"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';
var SB_URL='https://roggqmvmgfxsxynulpvk.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvZ2dxbXZtZ2Z4c3h5bnVscHZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2ODg4MDgsImV4cCI6MjEwNjI2NDgwOH0.AUWbGcVDNTud5BlYMlTXRh-vP-1SVqfcbe1ukiC-4ec';
var $=function(s){return document.querySelector(s)};
var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
var S={accts:null,uq:'',apps:[],appTab:'pending',view:'home',shops:[],pays:[],plat:{},admins:[],payTab:'pending',q:'',filter:'all',slips:{},me:''};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function baht(n){return '฿'+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2})}
function dTh(iso){return iso?new Date(iso).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}):'-'}
function dtTh(iso){return iso?new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'-'}
function days(iso){return Math.ceil((new Date(iso).getTime()-Date.now())/86400000)}
function toast(t){var el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},3200)}
function err(e){var m=String(e&&e.message||e||'');return /email_in_use/.test(m)?'อีเมลนี้อยู่ในร้านอื่นแล้ว':/duplicate key.*slug|pos_shops_slug_key/.test(m)?'รหัสร้าน (slug) นี้มีแล้ว':/slug_check|pos_shops_slug_check/.test(m)?'รหัสร้านใช้ได้เฉพาะ a-z 0-9 และ - (2–31 ตัว)':/staff_limit/.test(m)?'จำนวนพนักงานเกินโควตา':/one_manager/.test(m)?'ร้านมีผู้จัดการได้ 1 คน':/bad_email/.test(m)?'อีเมลไม่ถูกต้อง':/not_pending/.test(m)?'รายการนี้ตรวจแล้ว':m}
function st(s){if(s.status==='suspended')return ['ระงับ','bad'];var d=days(s.expires_at);if(s.locked)return ['ล็อก · หมดอายุ','bad'];if(d<0)return ['เลยกำหนด '+(-d)+' วัน','bad'];if(d<=7)return ['เหลือ '+d+' วัน','warn'];return ['ใช้งานได้','']}
function shopBy(id){return S.shops.find(function(s){return s.id===id})||{}}

/* ---------- auth ---------- */
function showLogin(t){$('#authView').hidden=false;$('#appView').hidden=true;var m=$('#loginMsg');m.hidden=!t;m.textContent=t||''}
$('#loginForm').addEventListener('submit',function(e){e.preventDefault();$('#lgBtn').disabled=true;
  var lp=$('#lgPass').value;sb.auth.signInWithPassword({email:$('#lgEmail').value.trim(),password:lp}).then(function(r){$('#lgBtn').disabled=false;if(r.error){showLogin(/Invalid/i.test(r.error.message)?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':r.error.message);return}

function out(){sb.auth.signOut().then(function(){location.reload()})}
$('#lgOut').addEventListener('click',out);$('#logoutBtn').addEventListener('click',out);
function start(){sb.auth.getSession().then(function(r){if(!r.data.session){showLogin('');return}
  sb.rpc('pos_session',{p_slug:null}).then(function(x){if(x.error||!x.data||!x.data.admin){showLogin('บัญชีนี้ไม่ใช่ผู้ดูแลระบบ');$('#lgOut').hidden=false;return}
    S.me=x.data.email;$('#meBox').textContent=S.me;$('#authView').hidden=true;$('#appView').hidden=false;
    var h=location.hash.slice(1);if(['home','apps','shops','users','pays','settings'].indexOf(h)>=0)S.view=h;loadAll()})})}

/* ---------- data ---------- */
function loadAll(){return Promise.all([
  sb.rpc('pos_admin_shops').then(function(r){if(r.error)throw r.error;S.shops=r.data||[];
    return sb.from('pos_shops').select('id,user_prefix').then(function(x){var m={};(x.data||[]).forEach(function(y){m[y.id]=y.user_prefix});S.shops.forEach(function(sh){sh.user_prefix=m[sh.id]||null})})}),
  sb.from('pos_payments').select('*').order('created_at',{ascending:false}).limit(300).then(function(r){if(r.error)throw r.error;S.pays=r.data||[]}),
  sb.from('pos_platform').select('*').eq('key','billing').maybeSingle().then(function(r){S.plat=(r.data&&r.data.data)||{}}),
  sb.from('pos_admins').select('*').order('created_at').then(function(r){S.admins=r.data||[]}),
  sb.from('pos_applications').select('*').order('created_at',{ascending:false}).limit(300).then(function(r){S.apps=r.data||[]})
]).then(render).catch(function(e){toast('โหลดข้อมูลไม่สำเร็จ: '+err(e))})}
setInterval(function(){if(!document.hidden&&!$('#drawer').innerHTML)loadAll()},60000);

/* ---------- views ---------- */
function render(){
  document.querySelectorAll('.nav[data-go]').forEach(function(b){b.setAttribute('aria-current',b.dataset.go===S.view?'page':'false')});
  var pend=S.pays.filter(function(p){return p.status==='pending'}).length;var pb=$('#payBadge');pb.hidden=!pend;pb.textContent=pend;
  var pa=S.apps.filter(function(a){return a.status==='pending'}).length;var ab=$('#appBadge');ab.hidden=!pa;ab.textContent=pa;
  if(S.view==='users'&&S.accts==null)loadAccts();
  $('#main').innerHTML=({home:homeView,apps:appsView,users:usersView,shops:shopsView,pays:paysView,settings:settingsView})[S.view]();
  if(S.view==='pays'||S.view==='apps')loadSlips();
  if(S.view==='settings')drawPpPrev();
}
function homeView(){
  var sh=S.shops,act=sh.filter(function(s){return !s.locked&&s.status==='active'}),soon=sh.filter(function(s){var d=days(s.expires_at);return !s.locked&&d>=0&&d<=7}),

function ppPayload(id,amount){function t(tag,v){return tag+('0'+v.length).slice(-2)+v}var x=String(id||'').replace(/\D/g,'');if([10,13,15].indexOf(x.length)<0)return '';
  var sub=x.length===13?t('02',x):x.length===15?t('03',x):t('01',('0000000000000'+x.replace(/^0/,'66')).slice(-13));
  var p=t('00','01')+t('01',amount?'12':'11')+t('29',t('00','A000000677010111')+sub)+t('58','TH')+t('53','764')+(amount?t('54',Number(amount).toFixed(2)):'')+'6304';
  var c=0xFFFF;for(var i=0;i<p.length;i++){c^=p.charCodeAt(i)<<8;for(var j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}return p+('0000'+c.toString(16).toUpperCase()).slice(-4)}

  el.innerHTML='';var pl=ppPayload(id,amt);$('#ppPrevAmt').textContent=pl?'ตัวอย่าง QR ยอด '+baht(amt):'';
  if(!pl){el.textContent=id?'เบอร์/เลขไม่ถูกต้อง':'ใส่เบอร์พร้อมเพย์เพื่อดูตัวอย่าง QR';return}
  if(typeof QRCode!=='undefined'){try{new QRCode(el,{text:pl,width:134,height:134,correctLevel:QRCode.CorrectLevel.M})}catch(e){}}}

  '<div class="three"><label for="ns_price">ค่าบริการ/เดือน<input id="ns_price" type="number" min="0" value="'+esc(S.plat.price||299)+'"></label><label for="ns_staff">บัญชีพนักงาน<input id="ns_staff" type="number" min="0" max="200" value="5"></label><label for="ns_days">ทดลองใช้ (วัน)<input id="ns_days" type="number" min="0" max="365" value="30"></label></div>'+
  '<span class="hint">ระบบสร้างฐานข้อมูลของร้านให้ทันที ผู้จัดการเข้า '+esc(location.origin)+'/pos แล้วกด “สมัคร” ด้วยอีเมลนี้ จากนั้นจัดการเมนูและเพิ่มพนักงานเองได้</span>'+
  '<button class="btn primary" type="submit">สร้างร้าน</button></form>');
  $('#ns_name').addEventListener('input',function(){var s=$('#ns_slug');if(!s.dataset.touched)s.value=slugify(this.value)});
  $('#ns_slug').addEventListener('input',function(){this.dataset.touched='1'})}
function editShop(id){var s=shopBy(id);if(!s.id)return;var exp=new Date(s.expires_at);var ds=exp.getFullYear()+'-'+('0'+(exp.getMonth()+1)).slice(-2)+'-'+('0'+exp.getDate()).slice(-2);
  drawer(s.name,'<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn sm" href="/pos?shop='+encodeURIComponent(s.slug)+'" target="_blank" rel="noopener">เปิด POS ร้านนี้</a><a class="btn sm" href="/s/'+encodeURIComponent(s.slug)+'" target="_blank" rel="noopener">หน้าสั่งอาหารลูกค้า</a></div>'+
  '<section class="panel"><h2>ข้อมูลและแพ็กเกจ</h2><form class="form" id="editShopForm" data-id="'+s.id+'">'+
  '<label for="es_name">ชื่อร้าน<input id="es_name" required maxlength="80" value="'+esc(s.name)+'"></label>'+
  '<div class="three"><label for="es_price">ค่าบริการ/เดือน<input id="es_price" type="number" min="0" value="'+esc(s.price)+'"></label><label for="es_staff">บัญชีพนักงาน<input id="es_staff" type="number" min="0" max="200" value="'+esc(s.staff_limit)+'"></label><label for="es_status">สถานะ<select id="es_status"><option value="active"'+(s.status==='active'?' selected':'')+'>ใช้งาน</option><option value="suspended"'+(s.status==='suspended'?' selected':'')+'>ระงับ</option></select></label></div>'+
  '<label for="es_exp">ใช้งานได้ถึงวันที่<input id="es_exp" type="date" value="'+ds+'"></label>'+
  '<label for="es_note">บันทึกภายใน<textarea id="es_note" rows="2" maxlength="500">'+esc(s.note||'')+'</textarea></label>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" data-act="addm" data-n="1">+1 เดือน</button><button class="btn sm" type="button" data-act="addm" data-n="3">+3 เดือน</button><button class="btn sm" type="button" data-act="addm" data-n="12">+12 เดือน</button></div>'+
  '<button class="btn primary" type="submit">บันทึก</button></form></section>'+
  '<section class="panel"><h2>ผู้จัดการร้าน</h2><div class="small">ปัจจุบัน: <b>'+esc(s.manager?((s.manager.name||'')+' '+s.manager.email):'ยังไม่มี')+'</b></div><form class="form" id="mgrForm" data-id="'+s.id+'"><div class="two"><label for="mg_email">อีเมลผู้จัดการคนใหม่<input id="mg_email" type="email" required></label><label for="mg_name">ชื่อ<input id="mg_name" maxlength="60"></label></div><span class="hint">ผู้จัดการคนเดิมจะถูกปิดการใช้งาน</span><button class="btn" type="submit">เปลี่ยนผู้จัดการ</button></form></section>'+
  '<section class="panel"><h2>บัญชีในร้าน</h2>'+(s.user_prefix?'<div class="small" style="margin-bottom:6px">รหัสร้านสำหรับชื่อผู้ใช้พนักงาน: <b class="num">'+esc(s.user_prefix)+'</b></div>':'')+'<div id="memList" class="small muted">กำลังโหลด…</div></section>'+
  '<section class="panel"><h2>ประวัติชำระเงิน</h2>'+(S.pays.filter(function(p){return p.shop_id===id}).map(function(p){return '<div class="small" style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)"><span>'+dTh(p.created_at)+'</span><b class="num">'+baht(p.amount)+'</b><span>'+p.months+' เดือน</span><span style="flex:1"></span><span class="chip '+(p.status==='approved'?'':p.status==='pending'?'warn':'bad')+'">'+({pending:'รอตรวจ',approved:'อนุมัติ',rejected:'ไม่อนุมัติ'})[p.status]+'</span></div>'}).join('')||'<div class="muted small">ยังไม่มี</div>')+'</section>');
  loadMembers(id)}
function acctRow(m,showShop){var sh=shopBy(m.shop_id);return '<div class="acct"><div class="who"><b>'+esc(m.username?m.username.slice(0,3).toUpperCase()+m.username.slice(3):m.email)+'</b>'+(m.username?'<span class="muted small">ชื่อผู้ใช้ (ไม่มีอีเมล)</span>':'')+'<span class="muted small">'+esc(m.name||'')+(showShop?' · '+esc(sh.name||'-'):'')+'</span></div>'+
  '<span class="chip '+(m.role==='manager'?'':'mute')+'">'+(m.role==='manager'?'ผู้จัดการ':'พนักงาน')+'</span>'+(m.active?'':'<span class="chip bad">ปิดใช้งาน</span>')+
  '<span class="small muted">'+(m.has_login?(m.last_sign_in?'เข้าล่าสุด '+dtTh(m.last_sign_in):'ยังไม่เคยเข้า'):'ยังไม่มีรหัสผ่าน')+'</span>'+pwCell(m)+
  '<span class="acts"><button class="btn sm" data-act="setpw" data-id="'+esc(m.email)+'">'+(m.has_login?'ตั้งรหัสผ่านใหม่':'สร้างรหัสผ่าน')+'</button>'+(m.role==='staff'?'<button class="btn sm" data-act="memtoggle" data-shop="'+m.shop_id+'" data-id="'+esc(m.email)+'" data-v="'+(m.active?'0':'1')+'">'+(m.active?'ปิด':'เปิด')+'</button>':'')+'</span></div>'}
var CREDS={},SHOWPW={};
function pwCell(m){var c=CREDS[m.email];var login=m.username||m.email.replace('@staff.cafe-pos.app','');
  if(!c||c.password==null)return '<span class="pwc"><span class="small muted">รหัสผ่าน: ยังไม่ทราบ</span></span>';
  var on=SHOWPW[m.email];return '<span class="pwc"><span class="small">รหัสผ่าน:</span><code>'+(on?esc(c.password):'••••••••')+'</code>'+
    '<button class="btn sm" data-act="pwshow" data-id="'+esc(m.email)+'">'+(on?'ซ่อน':'ดู')+'</button><button class="btn sm" data-act="pwcopy" data-id="'+esc(m.email)+'" title="คัดลอกชื่อผู้ใช้และรหัสผ่าน">คัดลอก</button></span>'}
function loadCreds(sid){return sb.auth.getSession().then(function(r){return fetch(SB_URL+'/functions/v1/pos-signup',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+(r.data.session&&r.data.session.access_token),'Content-Type':'application/json'},body:JSON.stringify({action:'creds',sid:sid||null})}).then(function(x){return x.json()})})
  .then(function(r){if(r&&r.creds)Object.keys(r.creds).forEach(function(k){CREDS[k]=r.creds[k]})}).catch(function(){})}
function loadMembers(id){Promise.all([sb.rpc('pos_admin_accounts',{p_sid:id}),loadCreds(id)]).then(function(x){var r=x[0];S.memRows=r.data||[];S.memShop=id;drawMembers()})}
function drawMembers(){var el=$('#memList');if(!el)return;var rows=S.memRows||[];el.innerHTML=rows.length?rows.map(function(m){return acctRow(m,false)}).join(''):'ยังไม่มีบัญชี'}
function loadAccts(){S.accts=[];Promise.all([sb.rpc('pos_admin_accounts',{p_sid:null}),loadCreds(null)]).then(function(x){S.accts=x[0].data||[];if(S.view==='users')render()})}
function usersView(){var q=S.uq.trim().toLowerCase();var list=(S.accts||[]).filter(function(m){var sh=shopBy(m.shop_id);return !q||(m.email+' '+(m.username||'')+' '+(m.name||'')+' '+(sh.name||'')).toLowerCase().indexOf(q)>=0});
  return '<div class="head"><h1>บัญชีผู้ใช้</h1><span class="sp"></span><input class="search" id="userQ" type="search" placeholder="ค้นหาอีเมล ชื่อ หรือร้าน" value="'+esc(S.uq)+'" aria-label="ค้นหาบัญชี"></div>'+
  '<div class="note">ผู้จัดการเข้าด้วยอีเมล พนักงานเข้าด้วยชื่อผู้ใช้ · กด “ดู” เพื่อแสดงรหัสผ่าน · บัญชีที่ขึ้นว่า “ยังไม่ทราบ” จะแสดงรหัสเองหลังเจ้าของบัญชีเข้าสู่ระบบครั้งถัดไป หรือกด “ตั้งรหัสผ่านใหม่”</div>'+
  '<section class="panel">'+(list.length?list.map(function(m){return acctRow(m,true)}).join(''):'<div class="empty">'+(S.accts&&S.accts.length?'ไม่พบบัญชี':'กำลังโหลด…')+'</div>')+'</section>'}
function setPw(email){drawer('ตั้งรหัสผ่านใหม่','<div class="small">บัญชี <b>'+esc(email.replace('@staff.cafe-pos.app',''))+'</b></div><form class="form" id="pwForm" data-email="'+esc(email)+'">'+
  '<label for="pw_new">รหัสผ่านใหม่ (เว้นว่างให้ระบบสุ่มให้)<input id="pw_new" type="text" minlength="8" autocomplete="off" placeholder="อย่างน้อย 8 ตัวอักษร"></label>'+
  '<span class="hint">รหัสเดิมจะใช้ไม่ได้ทันที ผู้ใช้เปลี่ยนรหัสเองภายหลังได้ด้วย “ลืมรหัสผ่าน” ที่หน้าเข้าสู่ระบบ</span>'+
  '<button class="btn primary" type="submit">ตั้งรหัสผ่าน</button></form><div id="pwOut"></div>')}

/* ---------- events ---------- */
document.addEventListener('click',function(e){var go=e.target.closest('[data-go]');if(go){S.view=go.dataset.go;history.replaceState(null,'','#'+S.view);render();return}
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,d=b.dataset;
  if(a==='dclose'&&e.target!==b)return;
  if(a==='dclose'||a==='close'){closeDrawer();return}
  if(a==='newshop'){newShop();return}
  if(a==='editshop'){editShop(d.id);return}
  if(a==='gopays'){S.view='pays';S.payTab='pending';render();return}
  if(a==='filter'){S.filter=d.v;render();return}
  if(a==='paytab'){S.payTab=d.v;render();return}
  if(a==='apptab'){S.appTab=d.v;render();return}
  if(a==='appok'||a==='appno'){var note=($('#an_'+d.id)||{}).value||null;b.disabled=true;
    var job=a==='appok'?sb.rpc('pos_admin_approve_app',{p_id:d.id,p_slug:(($('#as_'+d.id)||{}).value||'').trim().toLowerCase(),p_note:note}):sb.rpc('pos_admin_reject_app',{p_id:d.id,p_note:note});
    job.then(function(r){if(r.error){b.disabled=false;toast(err(r.error));return}
      notifyApp(d.id).then(function(m){toast((a==='appok'?'เปิดร้านแล้ว':'ไม่อนุมัติแล้ว')+(m&&m.sent?' · ส่งอีเมลแจ้งผู้สมัครแล้ว':' · ยังไม่ได้ส่งอีเมล (ยังไม่ได้ตั้งค่าการส่งอีเมล)'));loadAll()})});return}
  if(a==='zoom'){if(b.dataset.url){var z=document.createElement('button');z.className='zoom';z.setAttribute('aria-label','ปิด');z.innerHTML='<img src="'+esc(b.dataset.url)+'" alt="สลิปการโอน">';z.onclick=function(){z.remove()};document.body.appendChild(z)}return}
  if(a==='extend'){var s=shopBy(d.id);var n=new Date(Math.max(Date.now(),new Date(s.expires_at).getTime()));n.setMonth(n.getMonth()+1);
    sb.from('pos_shops').update({expires_at:n.toISOString()}).eq('id',s.id).then(function(r){toast(r.error?err(r.error):'ต่ออายุ '+s.name+' ถึง '+dTh(n.toISOString()));loadAll()});return}
  if(a==='addm'){var inp=$('#es_exp');var base=new Date(Math.max(Date.now(),new Date(inp.value+'T23:59:00').getTime()||Date.now()));base.setMonth(base.getMonth()+(+d.n));inp.value=base.toISOString().slice(0,10);return}
  if(a==='approve'||a==='reject'){b.disabled=true;var note=($('#pn_'+d.id)||{}).value||null;
    sb.rpc('pos_pay_review',{p_id:d.id,p_approve:a==='approve',p_note:note}).then(function(r){if(r.error){b.disabled=false;toast(err(r.error));return}toast(a==='approve'?'อนุมัติแล้ว ใช้งานได้ถึง '+dTh(r.data.expiresAt):'ไม่อนุมัติแล้ว');loadAll()});return}
  if(a==='memtoggle'){S.accts=null;sb.from('pos_members').update({active:d.v==='1'}).eq('email',d.id).then(function(r){toast(r.error?err(r.error):'บันทึกแล้ว');loadMembers(d.shop);loadAll()});return}
  if(a==='pkadd'){$('#pkRows').insertAdjacentHTML('beforeend',pkRow({}));return}
  if(a==='pkdel'){b.closest('.pkrow').remove();return}
  if(a==='setpw'){setPw(d.id);return}
  if(a==='pwshow'){SHOWPW[d.id]=!SHOWPW[d.id];drawMembers();if(S.view==='users')render();return}
  if(a==='pwcopy'){var c=CREDS[d.id];if(!c)return;var u0=d.id.replace('@staff.cafe-pos.app','');if(u0!==d.id)u0=u0.slice(0,3).toUpperCase()+u0.slice(3);var t='ชื่อผู้ใช้: '+u0+'\nรหัสผ่าน: '+c.password;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('คัดลอกชื่อผู้ใช้และรหัสผ่านแล้ว')},function(){toast('คัดลอกไม่ได้')});return}
  if(a==='copypw'){var t=$('#pwVal').textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('คัดลอกรหัสผ่านแล้ว')},function(){toast('เลือกข้อความแล้วคัดลอกเอง')});return}
  if(a==='rmadmin'){if(!confirm('นำ '+d.id+' ออกจากผู้ดูแลระบบ?'))return;sb.from('pos_admins').delete().eq('email',d.id).then(function(r){toast(r.error?err(r.error):'นำออกแล้ว');loadAll()});return}
});
document.addEventListener('input',function(e){if(e.target.id==='userQ'){S.uq=e.target.value;var ps=e.target.selectionStart;render();var u=$('#userQ');u.focus();u.setSelectionRange(ps,ps);return}if(e.target.id==='pf_promptpay'||(e.target.dataset&&e.target.dataset.k==='price'))drawPpPrev();if(e.target.id==='shopQ'){S.q=e.target.value;var pos=e.target.selectionStart;render();var i=$('#shopQ');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var z=document.querySelector('.zoom');if(z){z.remove();return}closeDrawer()}});
document.addEventListener('submit',function(e){var f=e.target;if(!f.id)return;e.preventDefault();var btn=f.querySelector('[type=submit]');
  function done(){if(btn)btn.disabled=false}if(btn)btn.disabled=true;
  if(f.id==='newShopForm'){sb.rpc('pos_admin_create_shop',{p_slug:$('#ns_slug').value.trim(),p_name:$('#ns_name').value.trim(),p_manager:$('#ns_mgr').value.trim(),p_manager_name:$('#ns_mgrname').value.trim()||null,
      p_price:+$('#ns_price').value||0,p_staff_limit:+$('#ns_staff').value||0,p_days:+$('#ns_days').value||0,p_app_url:location.origin+'/s/'+$('#ns_slug').value.trim()})
    .then(function(r){done();if(r.error){toast(err(r.error));return}closeDrawer();toast('สร้างร้านแล้ว');loadAll().then(function(){editShop(r.data)})});return}
  if(f.id==='editShopForm'){var id=f.dataset.id;var dt=$('#es_exp').value;
    sb.from('pos_shops').update({name:$('#es_name').value.trim(),price:+$('#es_price').value||0,staff_limit:+$('#es_staff').value||0,status:$('#es_status').value,note:$('#es_note').value.trim()||null,expires_at:new Date(dt+'T23:59:00').toISOString()}).eq('id',id)
    .then(function(r){done();if(r.error){toast(err(r.error));return}toast('บันทึกแล้ว');loadAll().then(function(){editShop(id)})});return}
  if(f.id==='mgrForm'){var sid=f.dataset.id;sb.rpc('pos_admin_set_manager',{p_sid:sid,p_email:$('#mg_email').value.trim(),p_name:$('#mg_name').value.trim()||null})
    .then(function(r){done();if(r.error){toast(err(r.error));return}toast('เปลี่ยนผู้จัดการแล้ว');loadAll().then(function(){editShop(sid)})});return}
  if(f.id==='platForm'){var data={promptpay:$('#pf_promptpay').value.replace(/\D/g,''),bankName:$('#pf_bankName').value.trim(),bankNo:$('#pf_bankNo').value.trim(),accountName:$('#pf_accountName').value.trim(),note:$('#pf_note').value.trim(),packages:[].slice.call(document.querySelectorAll('.pkrow')).map(function(r){var g=function(k){return r.querySelector('[data-k='+k+']').value};return {id:r.dataset.id,name:g('name').trim(),months:Math.max(1,Math.min(24,+g('months')||1)),price:Math.max(0,+g('price')||0),staff:Math.max(0,Math.min(200,+g('staff')||0))}}).filter(function(p){return p.name}),price:+$('#pf_price').value||0,graceDays:Math.max(0,Math.min(60,+$('#pf_grace').value||0))};
    if(data.promptpay&&[10,13,15].indexOf(data.promptpay.length)<0){done();toast('พร้อมเพย์ต้องเป็นเบอร์ 10 หลัก หรือเลข 13/15 หลัก');return}
    sb.from('pos_platform').upsert({key:'billing',data:data,updated_at:new Date().toISOString()}).then(function(r){done();toast(r.error?err(r.error):'บันทึกแล้ว');loadAll()});return}
  if(f.id==='pwForm'){var em=f.dataset.email,pw=$('#pw_new').value.trim();if(pw&&pw.length<8){done();toast('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');return}
    sb.auth.getSession().then(function(r){return fetch(SB_URL+'/functions/v1/pos-signup',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+(r.data.session&&r.data.session.access_token),'Content-Type':'application/json'},body:JSON.stringify({action:'setpw',email:em,password:pw||null})}).then(function(x){return x.json()})})
    .then(function(r){done();if(!r||r.error){toast('ตั้งรหัสผ่านไม่สำเร็จ'+(r&&r.error?' ('+r.error+')':''));return}
      CREDS[em]={password:r.password};f.remove();$('#pwOut').innerHTML='<div class="pwbox"><code id="pwVal">'+esc(r.password)+'</code><button class="btn sm" data-act="copypw">คัดลอก</button></div><div class="hint" style="margin-top:8px">ชื่อผู้ใช้: <b>'+esc(em.replace('@staff.cafe-pos.app',''))+'</b> · ดูรหัสนี้ได้อีกที่หน้าบัญชีผู้ใช้</div>';S.accts=null})
    .catch(function(){done();toast('เชื่อมต่อไม่สำเร็จ')});return}
  if(f.id==='adminForm'){sb.from('pos_admins').insert({email:$('#ad_email').value.trim().toLowerCase()}).then(function(r){done();toast(r.error?err(r.error):'เพิ่มผู้ดูแลระบบแล้ว');loadAll()});return}
  done();
});
start();
})();
</script>
