<title>POS ร้านคุณสิมบัติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — slim left rail of sections, working area on the right; POS splits into product wall + receipt-like cart. Phone: rail becomes a bottom bar, cart stacks under products. */
:root{
  --bg:#edf1ef; --surface:#ffffff; --surface2:#f5f8f6; --ink:#15211c; --muted:#495650; --line:#d5ded9;
  --accent:#085640; --accent-ink:#ffffff; --accent-soft:#dbeee6;
  --warn:#744400; --warn-soft:#fbefd8; --bad:#8D2019; --bad-soft:#f8e2df; --good:#155A2B; --good-soft:#dff2e5;
  --paper:#ffffff; --paper-ink:#161616; --paper-line:#cfcfcf;
  --display:'Anuphan','IBM Plex Sans Thai',system-ui,sans-serif;
  --body:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px; --gut:16px; --rb:8px; --rb2:10px; --pcw:138px; --pch:96px; --tdp:8px 10px; --scale:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --surface2:#1b2521; --ink:#e3ebe7; --muted:#93a39c; --line:#2a3631;
  --accent:#41bf93; --accent-ink:#04201a; --accent-soft:#16392d;
  --warn:#e7a43f; --warn-soft:#382a12; --bad:#ef7d72; --bad-soft:#3b1c19; --good:#62cf88; --good-soft:#163522;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --surface2:#1b2521; --ink:#e3ebe7; --muted:#93a39c; --line:#2a3631;
  --accent:#41bf93; --accent-ink:#04201a; --accent-soft:#16392d;
  --warn:#e7a43f; --warn-soft:#382a12; --bad:#ef7d72; --bad-soft:#3b1c19; --good:#62cf88; --good-soft:#163522;
  color-scheme:dark}
html,body{height:100%}
html{font-size:calc(16px * var(--scale))}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:.875rem;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:1.25rem} h3{font-size:1.02rem}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.adpause{position:absolute;top:12px;right:12px;z-index:30;width:52px;height:52px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.72);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0} .a11y-err{margin:0 0 12px;padding:10px 12px;border-radius:8px;border:2px solid #8A1C14;background:#FDECEA;color:#5C0F0A;font-weight:600} .muted{color:var(--muted)} .small{font-size:.82rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
#app.custmode{grid-template-rows:minmax(0,1fr)}
.top{display:flex;align-items:center;gap:12px;padding:10px var(--gut);background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--display);font-size:1.15rem;font-weight:700}
.brand span{font-size:.8125rem;letter-spacing:.08em;color:var(--accent);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:.8125rem;white-space:nowrap}
.chip.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.body{display:grid;grid-template-columns:184px 1fr;min-height:0}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.rail button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:var(--rb);text-align:left;cursor:pointer;color:var(--muted);font-weight:500}
.rail button:hover{background:var(--surface2);color:var(--ink)}
.rail button.on{background:var(--accent-soft);color:var(--accent)}
.rail svg{width:18px;height:18px;flex:none}
main{overflow:auto;padding:var(--gut);min-width:0}
@media (max-width:820px){
  .body{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto}
  .rail button{flex-direction:column;gap:2px;font-size:.8125rem;padding:6px 8px;min-width:64px;align-items:center;text-align:center}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--rb);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--rb);padding:8px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea,.f .row>input,.f .row>select{color:var(--ink);font-size:.92rem}
.row.nowrap{flex-wrap:nowrap;gap:6px}
.btn svg{width:18px;height:18px;flex:none}
label.btn{cursor:pointer}
button,.btn,.pc,.rail button,.cats button,.qty button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
label.chk{display:flex;align-items:center;gap:8px;font-size:.88rem}
label.chk input{width:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{margin-right:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.8125rem;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:var(--tdp);border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi small{color:var(--muted);font-size:.8125rem;letter-spacing:.03em}
.kpi b{display:block;font-family:var(--mono);font-size:1.3rem;font-weight:600;margin-top:2px}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;height:100%;min-height:0}
@media (max-width:1050px){.pos{grid-template-columns:1fr;height:auto}}
.pos-left{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0;overflow:auto}
.pos-left>.scan{position:sticky;top:0;z-index:4;background:var(--bg);padding-bottom:4px}
@media (max-width:1050px){.pos-left{overflow:visible}.pos-left>.scan{top:calc(-1*var(--gut));margin:0 calc(-1*var(--gut));padding:8px var(--gut)}}
.scan{display:flex;gap:8px;flex-wrap:wrap}
.scan input{flex:1 1 180px}
.scan .btn.cam{padding:8px 12px}
.scan input{font-size:1rem;padding:11px 12px;border-width:2px}
.scan input:focus{border-color:var(--accent);outline:none}
.scan select{width:auto}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--pcw),1fr));gap:8px}
.cats button{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:6px;min-height:84px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;text-align:left;color:var(--ink);min-width:0}
.cats button:hover{border-color:var(--accent)}
.cats button .ct{font-family:var(--display);font-weight:600;font-size:1.06rem;line-height:1.25;overflow-wrap:anywhere}
.cats button .n{font-family:var(--mono);font-size:.8125rem;color:var(--muted)}
.cats button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cats button.on .n{color:inherit;opacity:.85}
.cats button.empty0 .ct{color:var(--muted)}
.cats button.on .ct,.cats button.on.empty0 .ct,.cats button.on .n{color:var(--accent-ink);opacity:1}
.cats button.add{border-style:dashed;background:none;justify-content:center;align-items:center;color:var(--muted)}
.cats button.other{background:var(--warn-soft);border-color:var(--warn)}
.cats button.other .ct{color:var(--ink)}
.cats button.other .n{color:var(--warn)}
.cats button.add .ct{color:var(--muted);font-family:var(--body);font-weight:500;font-size:.95rem}
.secthead{display:flex;align-items:baseline;gap:10px;padding:12px 0 2px;border-top:2px solid var(--line);margin-top:4px}
.secthead h3{font-size:1.05rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--pcw),1fr));gap:8px;align-content:start}
.pc{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:var(--pch)}
.pc:hover{border-color:var(--accent)}
.pc .nm{font-weight:500;line-height:1.3;font-size:.9rem}
.pc .pr{font-family:var(--mono);font-weight:600;margin-top:auto}
.pc .st{position:absolute;top:6px;right:6px;font-family:var(--mono);font-size:.8125rem;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.pc .st.low{background:var(--warn-soft);color:var(--warn)}
.pc .st.out{background:var(--bad-soft);color:var(--bad)}
.pc .tag{font-size:.8125rem;color:var(--accent);font-weight:600}
.pc .st{z-index:1}
.pimg{display:block;aspect-ratio:4/3;max-width:calc(100% + 20px);margin:-10px -10px 4px;border-radius:var(--r) var(--r) 0 0;overflow:hidden;background:var(--surface2)}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg.none{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.8rem;font-weight:600;color:var(--muted);background:var(--accent-soft)}
.imgpick{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.imgprev{width:132px;aspect-ratio:1;max-width:100%;border-radius:var(--rb2);border:1px dashed var(--line);background:var(--surface2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8125rem;text-align:center;flex:none}
.imgprev img{width:100%;height:100%;object-fit:cover}
.thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;background:var(--surface2);display:block}
.thumb.none{display:flex;align-items:center;justify-content:center;font-size:.8125rem;color:var(--muted)}
.ln .tn{display:flex;gap:8px;align-items:center;min-width:0}
.ln .tn img{width:32px;height:32px;border-radius:6px;object-fit:cover;flex:none}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
.cart-h{padding:10px 12px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.lines{flex:1;overflow:auto;min-height:120px}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.ln .nm{font-weight:500;min-width:0}
.ln .meta{grid-column:1/-1;font-size:.8125rem;color:var(--muted)}
.ln .ctl{grid-column:1/-1;display:flex;align-items:center;gap:6px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--rb);overflow:hidden}
.qty button{border:0;background:var(--surface2);width:28px;height:28px;cursor:pointer;font-size:1rem}
.qty input{border:0;border-radius:0;width:56px;text-align:center;padding:4px;font-family:var(--mono)}
.tot{padding:10px 12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.tot div{display:flex;justify-content:space-between;gap:10px}
.tot .grand{font-size:1.5rem;font-family:var(--mono);font-weight:600;align-items:baseline}
.tot .grand span:first-child{font-family:var(--display);font-size:1rem}
.cart-a{padding:10px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line)}
.cart-a .pay{grid-column:1/-1;padding:14px;font-size:1.1rem;font-family:var(--display)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,18,15,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;z-index:20}
.mbox{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 18px 50px rgba(0,0,0,.25);display:flex;flex-direction:column}
.mbox.wide{max-width:880px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mh h3{margin-right:auto}
.mb{padding:16px;display:flex;flex-direction:column;gap:12px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:40;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.t{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:var(--rb2);font-size:.88rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.t.bad{background:var(--bad);color:#fff}

/* pay */
.paytot{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.paytot span{color:var(--muted)}.paytot b{font-family:var(--mono);font-size:2.1rem;font-weight:600}
.paytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.paytabs button{flex:none;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:var(--rb2);background:var(--surface);font-weight:600;cursor:pointer;color:var(--ink)}
.paytabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.paytabs button:disabled{opacity:.4;cursor:not-allowed}
.recv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.recv>div{border-radius:var(--r);padding:10px 14px;background:var(--surface2);display:flex;flex-direction:column;min-width:0}
.recv span{font-size:.82rem;color:var(--muted)}.recv b{font-family:var(--mono);font-size:1.75rem;line-height:1.25;font-variant-numeric:tabular-nums}
.recv .chg.ok{background:var(--good-soft)}.recv .chg.ok b{color:var(--good)}.recv .chg.short{background:var(--bad-soft)}.recv .chg.short b{color:var(--bad)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.quick button{min-height:58px;border:2px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:var(--rb2);font-family:var(--mono);font-size:1.1rem;font-weight:600;cursor:pointer}
.quick button small{display:block;font-family:var(--body);font-size:.8125rem;color:var(--accent);font-weight:600}
.cashcols{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
@media (max-width:640px){.cashcols{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}
.notes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.notes button{min-height:50px;border:1px solid rgba(0,0,0,.12);border-radius:var(--rb);cursor:pointer;font-family:var(--mono);font-weight:700;font-size:1rem;color:#1d1d1d}
.notes .n1000{background:#e6dbc9}.notes .n500{background:#e4d8ef}.notes .n100{background:#f5d6d2}.notes .n50{background:#d4e3f5}.notes .n20{background:#d6eed9}.notes .nc{background:#e4e5e1;border-radius:999px}
.notes button:active,.quick button:active,.kp button:active{transform:scale(.97)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp.big{gap:8px}.kp.big button{min-height:64px;font-size:1.6rem;font-weight:600}
.kp button{min-height:46px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--rb);font-family:var(--mono);font-size:1.15rem;cursor:pointer}
.donebig{text-align:center;padding:18px 12px;border-radius:14px;background:var(--good-soft)}
.donebig.plain{background:var(--surface2)}
.donebig span{display:block;font-size:1.15rem;color:var(--good);font-weight:700}
.donebig.plain span{color:var(--muted)}
.donebig b{display:block;font-family:var(--mono);font-size:3.6rem;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums}
.debtors{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;max-height:260px;overflow:auto}
.debtors button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--rb2);background:var(--surface);cursor:pointer;text-align:left;color:var(--ink);min-width:0}
.debtors button:hover{border-color:var(--accent)}
.debtors button b{font-family:var(--display);overflow-wrap:anywhere}
.debtors button span{font-size:.8125rem;color:var(--bad)}
.paybig{font-family:var(--mono);font-size:2.2rem;font-weight:600;text-align:center}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.methods button{padding:10px 6px;border:1px solid var(--line);border-radius:var(--rb);background:var(--surface);cursor:pointer;font-weight:500}
.methods button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;background:#fff;border-radius:var(--rb2);color:#111}
.qrbox svg,.qrbox img{width:210px;height:210px;object-fit:contain}

/* paper docs */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:4px;padding:18px;font-size:.84rem;margin:0 auto;width:100%}
.paper.rc{max-width:330px;font-family:var(--mono);font-size:.78rem}
.paper.a4{max-width:760px;font-family:var(--body)}
.paper table{font-size:.8rem;color:var(--paper-ink)}
.paper th{background:none;color:var(--paper-ink);border-bottom:1px solid var(--paper-ink)}
.paper td{border-bottom:1px dotted var(--paper-line)}
.paper .c{text-align:center} .paper .r{text-align:right}
.paper hr{border:0;border-top:1px dashed var(--paper-ink);margin:8px 0}
.paper .dt{font-family:var(--display);font-size:1.25rem;font-weight:700}

/* login */
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login{max-width:420px;width:100%}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pinpad button{padding:14px;font-size:1.2rem;font-family:var(--mono);border:1px solid var(--line);background:var(--surface);border-radius:var(--rb2);cursor:pointer}
.staffs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.staffs button{padding:12px;border:1px solid var(--line);border-radius:var(--rb2);background:var(--surface);cursor:pointer;text-align:left}
.staffs button.on{border-color:var(--accent);background:var(--accent-soft)}

/* misc */
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;height:100%}
.bars i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars span{font-size:.8125rem;color:var(--muted);white-space:nowrap}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.timer{font-family:var(--mono);font-size:1.6rem;font-weight:600}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.lbl{background:#fff;color:#111;border:1px dashed #aaa;border-radius:4px;padding:6px;text-align:center;font-size:.75rem}
.lbl svg{max-width:100%;height:auto}
.cust{--cb:var(--accent);--cf:var(--accent-ink);--cp:var(--surface);--cpf:var(--ink);--cm:var(--muted);height:100%;min-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--cb);color:var(--cf);font-size:17px;position:relative;overflow:hidden}
.cust.th-light{--cb:var(--surface);--cf:var(--ink);--cp:var(--surface2);--cpf:var(--ink)}
.cust.th-dark{--cb:#0f1714;--cf:#eef3f0;--cp:#18221e;--cpf:#eef3f0;--cm:#9fb0a8}
.cust.sz-m{font-size:14px}.cust.sz-l{font-size:17px}.cust.sz-xl{font-size:21px}
.cust .ch{display:flex;align-items:center;gap:.9em;padding:1em 1.2em}
.cust .ch img{height:3.2em;width:auto;max-width:9em;object-fit:contain;border-radius:.4em;background:#fff}
.cust .ch h2{font-size:1.6em;color:inherit}
.cust .cmem{margin-left:auto;text-align:right;font-size:.95em;line-height:1.4}
.cust .clines{background:var(--cp);color:var(--cpf);overflow:auto;padding:.4em 0}
.cust .cl{display:grid;grid-template-columns:1fr auto;gap:.2em 1em;padding:.6em 1.2em;border-bottom:1px solid rgba(127,127,127,.18);font-size:1.05em}
.cust .cl .q{font-size:.8em;color:var(--cm);grid-column:1/-1}
.cust .cl b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cust .cf{display:flex;gap:1.2em;align-items:center;flex-wrap:wrap;padding:1em 1.2em}
.cust .ctot{margin-left:auto;text-align:right}
.cust .ctot b{display:block;font-family:var(--mono);font-size:2.6em;line-height:1.1}
.cust .cidle{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6em;padding:1.2em}
.cust .cidle .big{font-family:var(--display);font-size:2.4em;font-weight:700;line-height:1.2;text-wrap:balance}
.cust .cidle .ad{font-size:1.25em;opacity:.92;max-width:28em}
.cust .cidle .amt{font-family:var(--mono);font-size:2em;font-weight:600}
.cust .qrbox svg,.cust .qrbox img{width:11em;height:11em;object-fit:contain}
.cust .cexit{position:absolute;right:.5em;bottom:.5em;opacity:.25;font-size:13px;background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 8px;cursor:pointer}
.cust .cexit:hover,.cust .cexit:focus-visible{opacity:.9}
.cust .cqr{display:flex;gap:1.4em;align-items:center;flex-wrap:wrap;justify-content:center;background:#ffffff;color:#141414;border-radius:1em;padding:1em 1.2em}
.cust .cqimg>svg,.cust .cqimg>img,.cust .cqimg>.qrw{width:10em;height:10em;display:block;object-fit:contain}
.cust .cqinfo{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.cust .cqinfo .ttl{font-weight:700;color:#0a6b50;font-size:1em;margin-bottom:.3em}
.cust .cqinfo .cap{font-size:.8em;color:#5b6660;margin-top:.35em}
.cust .cqinfo .amt{font-family:var(--mono);font-size:2.2em;font-variant-numeric:tabular-nums}
.cust .cqinfo .num{font-family:var(--mono);font-size:1.4em;letter-spacing:.02em}
.cust .cqinfo .nm{font-size:1.3em;overflow-wrap:anywhere}
.cust .cqinfo .warnx{margin-top:.5em;font-size:.85em;color:#744400;font-weight:600}
.cust .cpay{container-type:size;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 .8em .8em}
.cust .cqr.big{box-sizing:border-box;flex-wrap:nowrap;width:100%;height:100%;max-width:100%;max-height:100%;margin:0;border-radius:clamp(8px,2cqmin,24px);
  font-size:clamp(10px,min(4.5cqh,2.7cqw),44px);gap:4cqw;padding:3cqh 4cqw;justify-content:center}
.cust .cqr.big .cqimg>svg,.cust .cqr.big .cqimg>img,.cust .cqr.big .cqimg>.qrw{width:min(84cqh,48cqw);height:min(84cqh,48cqw)}
.cust .cqr.big .cqinfo{line-height:1.2}
.cust .cqr.big .ttl{font-size:1.15em}.cust .cqr.big .cap{font-size:.78em;margin-top:.45em}
.cust .cqr.big .amt{font-size:2.8em;line-height:1.1}.cust .cqr.big .num{font-size:1.7em}.cust .cqr.big .nm{font-size:1.45em}.cust .cqr.big .warnx{font-size:.85em}
@container (orientation:portrait){.cust .cqr.big{flex-direction:column;font-size:clamp(10px,min(3cqh,4.4cqw),40px);gap:2.5cqh;padding:3cqh 5cqw}
 .cust .cqr.big .cqimg>svg,.cust .cqr.big .cqimg>img,.cust .cqr.big .cqimg>.qrw{width:min(46cqh,82cqw);height:min(46cqh,82cqw)}
 .cust .cqr.big .cqinfo{align-items:center;text-align:center}}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.bkb{display:inline-flex;align-items:center;justify-content:center;min-width:2.4em;height:2.4em;padding:0 .5em;border-radius:.55em;font-weight:800;font-size:.95em;letter-spacing:.02em;flex:none}
.bkb.sm{font-size:.8125rem;height:2.2em}
.cust .bkrow{display:flex;align-items:center;gap:.6em;margin-top:.6em}
.cust .bkrow .bkn{font-size:1.5em}
.cust .cqr.big.cbank{font-size:clamp(11px,min(5.2cqh,3.8cqw),56px);justify-content:center}
.cust .cqr.big.cbank .cqinfo{align-items:flex-start;max-width:100%}
.cust .cqr.big .bkrow .bkn{font-size:1.6em;line-height:1.2}.cust .cqr.big .bkb{font-size:1em}
@container (orientation:portrait){.cust .cqr.big.cbank{font-size:clamp(11px,min(4.2cqh,5.6cqw),52px)}.cust .cqr.big.cbank .cqinfo{align-items:center}.cust .cqr.big .bkrow{justify-content:center;flex-wrap:wrap}}
.qrw{position:relative;display:block;line-height:0}
.qrw>svg{width:100%;height:100%;display:block}
.qrmark{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);background:#fff;border-radius:16%;padding:2.2%;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.qrmark svg,.qrmark img{width:100%;height:100%;display:block;object-fit:contain;border-radius:12%}
.cust.c2{display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--bg);color:var(--ink)}
.c2top{display:flex;align-items:center;gap:1em;padding:.7em 1.2em;background:var(--surface);border-bottom:1px solid var(--line)}
.c2brand{display:flex;align-items:center;gap:.7em;min-width:0;margin-right:auto}.c2brand img{height:2.4em;width:auto;max-width:6em;object-fit:contain;border-radius:.3em}
.c2brand b{display:block;font-family:var(--display);font-size:1.15em;line-height:1.2}.c2brand small{display:block;color:var(--muted);font-size:.78em}
.c2clock{font-family:var(--mono);font-weight:600;font-size:1.15em}
.c2main{display:grid;grid-template-columns:minmax(0,1fr) minmax(14em,30%);min-height:0}
.c2list{display:flex;flex-direction:column;gap:.8em;padding:1em 1.2em 1.2em;min-height:0}
.c2h{display:flex;align-items:baseline;gap:.8em}.c2h h2{font-size:1.7em;color:var(--ink)}.c2h span{color:var(--muted)}
.c2card{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r) * 1.4);padding:.3em 1.2em}
.c2row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.3em .9em;align-items:start;padding:.85em 0;border-bottom:1px solid var(--line)}
.c2row:last-child{border-bottom:0}
.c2row.new .c2nm b{color:var(--accent)}
.c2n{min-width:1.9em;height:1.9em;display:inline-flex;align-items:center;justify-content:center;border-radius:.45em;background:var(--surface2);border:1px solid var(--line);font-family:var(--mono);font-size:.85em}
.c2nm{min-width:0}.c2nm b{display:block;font-size:1.12em;font-weight:600;overflow-wrap:anywhere}.c2nm small{display:block;color:var(--muted);font-size:.82em;margin-top:.15em}
.c2p{font-family:var(--mono);font-size:1.08em;font-variant-numeric:tabular-nums;white-space:nowrap}
.c2disc{display:flex;justify-content:space-between;padding:0 .4em;color:var(--good);font-weight:600}
.c2total{display:flex;align-items:center;justify-content:space-between;gap:1em;background:var(--ink);color:var(--surface);border-radius:calc(var(--r) * 1.4);padding:1em 1.4em}
.c2total span{font-weight:700;font-size:1.05em}.c2total b{font-family:var(--mono);font-size:2.6em;line-height:1;font-variant-numeric:tabular-nums}
.c2side{background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6em;padding:1.5em;min-width:0;overflow:hidden}
.c2side img{max-width:60%;max-height:30%;object-fit:contain;border-radius:.6em;background:#fff;padding:.4em}
.c2side b{font-family:var(--display);font-size:1.5em;line-height:1.2}.c2side span{opacity:.9}
.c2ad{margin-top:1em;font-size:1.15em;line-height:1.4;padding:.8em 1em;border:1px solid rgba(255,255,255,.35);border-radius:var(--r);max-width:100%}
.c2qr{margin-top:.8em}.c2qr .cqr{flex-direction:column;gap:.5em;padding:.8em}
@media (max-aspect-ratio:1/1){.c2main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.c2side{flex-direction:row;flex-wrap:wrap;padding:.8em 1.2em;gap:.4em 1em}.c2side img{max-height:3em;max-width:6em}.c2ad{margin-top:0}}
.cdprev .c2 .c2clock{display:none}
.cadv{display:grid;grid-template-rows:minmax(0,1fr) auto;background:#000;color:#fff}
.cadstage{position:relative;overflow:hidden;background:#000;min-height:0}
.cadstage>img,.cadstage>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cadstage.fit-contain>img,.cadstage.fit-contain>video{object-fit:contain}
.cadstage>.in{animation:cadIn .6s ease both}
@keyframes cadIn{from{opacity:0}to{opacity:1}}
.cadbar{display:flex;align-items:center;gap:1em;padding:.7em 1.2em;background:var(--surface);color:var(--ink)}
.cadbar img{height:2.4em;width:auto;max-width:6em;object-fit:contain;border-radius:.3em}
.cadtx{min-width:0;flex:1}.cadtx b{display:block;font-family:var(--display);font-size:1.05em}.cadtx span{display:block;color:var(--muted);font-size:1em;overflow-wrap:anywhere}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mtile{position:relative;aspect-ratio:16/10;border-radius:var(--rb2);overflow:hidden;background:#111;border:1px solid var(--line)}
.mtile img,.mtile video{width:100%;height:100%;object-fit:cover;display:block}
.mbadge{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:.8125rem;padding:2px 7px;border-radius:999px}
.mact{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}.mact .ib{width:28px;height:28px;background:rgba(255,255,255,.92);border-color:transparent;color:#222}.mact .ib.danger{background:#fde4e1;color:#b0281f}.mact .ib:disabled{opacity:.4}
.madd{aspect-ratio:16/10;border:2px dashed var(--line);border-radius:var(--rb2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:10px;cursor:pointer;color:var(--ink)}
.madd:hover{border-color:var(--accent)}.madd small{color:var(--muted);font-size:.8125rem}
.sidebg{width:88px;height:56px;border-radius:var(--rb2);background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted)}.sidebg img{width:100%;height:100%;object-fit:cover}.sidebg svg{width:22px;height:22px}
details.prsec summary{cursor:pointer;list-style:revert}
.cdv{display:flex;flex-direction:column;gap:12px;height:calc(100dvh - 120px);min-height:520px}
.cdvbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.cdvbar>b{color:var(--accent);font-family:var(--display)}
.cdvtabs{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.cdvacts{display:flex;align-items:center;gap:6px;min-width:0;margin-left:auto}.cdvst{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.cdvtabs button{border:1px solid transparent;background:none;border-radius:var(--rb);padding:6px 12px;color:var(--ink);cursor:pointer;font:inherit}
.cdvtabs button.on{background:var(--surface);border-color:var(--line);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.cdvstage{flex:1;min-height:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;background:var(--surface)}
.cdvstage>.cust{height:100%;min-height:0}
.cdvstage .cust .cexit{display:none}
.warnbox{background:#FFF4D6;color:#7A4E00;border-radius:var(--rb);padding:10px 12px}
@media (max-width:700px){.cdv{height:auto}.cdvstage{height:70vh}.cdvtabs{flex-wrap:nowrap;overflow-x:auto;width:100%}.cdvtabs button{flex:0 0 auto}.cdvbar>.spacer{display:none}}
.cdprev{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:300px}
.cdprev .cust{font-size:13px!important}
.cdprev.big .cust{font-size:13px!important}
.cdprev .cust .cexit{display:none}
.cdgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:760px){.cdgrid{grid-template-columns:1fr}}
.cdlinks{display:flex;flex-direction:column;gap:6px}
.cdlinks div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:var(--rb);background:var(--surface2)}
.hint{background:var(--surface2);border:1px dashed var(--line);border-radius:var(--rb);padding:10px 12px;font-size:.84rem;color:var(--muted)}
/* camera scanner overlay: deliberately dark in both themes, like a viewfinder */
#scanner{position:fixed;inset:0;z-index:30;background:rgba(6,12,10,.94);color:#f2f5f3;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.scbox{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.scbox h3{color:#f2f5f3}
.scview{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:14px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.scview video{width:100%;height:100%;object-fit:cover;display:block}
.scview .frame{position:absolute;inset:20% 10%;border:2px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}

@keyframes laser{from{top:26%}to{top:74%}}
.scview.off{aspect-ratio:auto;padding:22px 18px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.3)}
.scmsg{text-align:center;font-size:.95rem;line-height:1.6;color:#d7e0dc}
.scshot{padding:16px;font-size:1.08rem;font-family:var(--display);background:#41bf93;border-color:#41bf93;color:#04201a}
.scbox input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#f2f5f3}
.scbox .btn:not(.scshot){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#f2f5f3}
.sclog{display:flex;flex-direction:column;gap:6px}
.sclog div{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:var(--rb);background:rgba(255,255,255,.07);font-size:.9rem;flex-wrap:wrap}
.sclog .ok b{color:#62cf88} .sclog .no b{color:#ef9a90}
.sclog code{font-family:var(--mono);font-size:.8125rem;color:#b9c6c0}
.cartbar{display:none}
@media (max-width:1050px){.cartbar{display:flex;position:sticky;bottom:0;margin:12px calc(-1*var(--gut)) calc(-1*var(--gut));padding:10px var(--gut);background:var(--surface);border-top:1px solid var(--line);gap:8px;align-items:center;z-index:5}
 .cartbar b{font-family:var(--mono);font-size:1.2rem}
 .pgrid{overflow:visible}}

 .pgrid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
 .cats{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
 .cats button{min-height:72px;padding:10px 12px}
 .cats button .ct{font-size:.98rem}
 .mbox{border-radius:14px}
 .mf .btn{flex:1 1 auto}}

.hwstat .dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}

.hwstat.warn{background:var(--warn-soft);border-color:transparent}.hwstat.warn .dot{background:var(--warn)}

.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.8}
.prgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;align-items:start}
@media (max-width:760px){.prgrid{grid-template-columns:1fr}}

.lblprev{background:#d9dcd9;border-radius:var(--r);padding:14px;display:flex;justify-content:center;align-items:center;min-height:120px}

 #app.nav-icon .body{grid-template-columns:68px 1fr}

/* ---------- pricing engine ---------- */
const LEVELS={retail:'ราคาปลีก',wholesale:'ราคาส่ง',member:'ราคาสมาชิก'};
function unitOf(p,uname){return (p.units||[]).find(u=>u.name===uname)}
function basePrice(p,level){if(level==='wholesale'&&+p.price2)return +p.price2;if(level==='member'&&+p.price3)return +p.price3;return +p.price||0}
function linePrice(l,level,qtyBaseByPid){const p=get('products',l.pid);if(l.override!=null)return +l.override;if(!p)return +l.price||0;
  if(l.unit){const u=unitOf(p,l.unit);if(u)return +u.price||basePrice(p,level)*u.factor}
  if(l.fixedPrice!=null)return +l.fixedPrice;
  let pr=basePrice(p,level);const q=qtyBaseByPid[l.pid]||0;(p.tiers||[]).forEach(t=>{if(q>=+t.min&&+t.price<pr)pr=+t.price});return pr}
function calc(cart){const level=cart.level||'retail';const qb={};cart.lines.forEach(l=>{if(!l.unit)qb[l.pid]=(qb[l.pid]||0)+(+l.qty||0)});
  const lines=cart.lines.map(l=>{const p=get('products',l.pid)||{};const u=l.unit?unitOf(p,l.unit):null;const price=r2(linePrice(l,level,qb));const factor=u?+u.factor:1;
    return Object.assign({},l,{name:l.name||p.name,price,factor,cost:r2((+p.cost||0)*factor),total:r2(price*(+l.qty||0)-(+l.disc||0))})});
  const sub=r2(lines.reduce((a,l)=>a+l.total,0));
  const baseQ={},unitP={};lines.forEach(l=>{baseQ[l.pid]=(baseQ[l.pid]||0)+l.qty*l.factor;if(!l.unit&&unitP[l.pid]==null)unitP[l.pid]=l.price});
  const pp=pid=>unitP[pid]!=null?unitP[pid]:basePrice(get('products',pid)||{},level);
  const promos=[];all('promos').filter(x=>x.active!==false).forEach(pm=>{let amt=0;
    if(pm.type==='bxgy'){const q=Math.floor(baseQ[pm.pid]||0),g=(+pm.x)+(+pm.y);if(g>0)amt=Math.floor(q/g)*(+pm.y)*pp(pm.pid)}
    else if(pm.type==='nth'){const q=Math.floor(baseQ[pm.pid]||0);if(+pm.n>0)amt=Math.floor(q/+pm.n)*pp(pm.pid)*(+pm.pct)/100}
    else if(pm.type==='ab'){const sets=Math.floor((baseQ[pm.pid]||0)/(+pm.x||1));const fb=Math.min(sets*(+pm.y||1),Math.floor(baseQ[pm.pid2]||0));amt=fb*pp(pm.pid2)}
    if(amt>0)promos.push({name:pm.name,amt:r2(amt)})});
  const promoTot=r2(promos.reduce((a,x)=>a+x.amt,0));const after=r2(sub-promoTot);
  const bd=cart.billDisc||{};const billDisc=r2(Math.min(after,bd.type==='pct'?after*(+bd.v||0)/100:(+bd.v||0)));
  const rw=cart.reward?get('rewards',cart.reward):null;const rewardDisc=rw?r2(Math.min(after-billDisc,+rw.value||0)):0;
  const s=SET();let total=r2(after-billDisc-rewardDisc),vat=0,net=total;
  if(s.vatMode==='incl'){vat=r2(total*s.vatRate/(100+ +s.vatRate));net=r2(total-vat)}else if(s.vatMode==='excl'){vat=r2(total*s.vatRate/100);net=total;total=r2(total+vat)}
  const cost=r2(lines.reduce((a,l)=>a+l.cost*l.qty,0));
  return {lines,sub,promos,promoTot,billDisc,rewardDisc,reward:rw,total,vat,net,cost}}

function scanCode(code){code=String(code).trim();if(!code)return false;const P=all('products');
  const hit=findByCode(code);if(hit&&!sellsAt(hit.p)){toast(hit.p.name+' ไม่ได้ขายที่'+bName(curBranch()),'bad');return true}
  let p=P.find(x=>x.barcode===code);if(p){addProduct(p,{chosen:true,unitChosen:true});return true}
  for(const x of P){const u=(x.units||[]).find(u=>u.barcode===code);if(u){addProduct(x,{chosen:true,unit:u.name});return true}}
  if(/^2\d{12}$/.test(code)){const plu=code.slice(2,7),w=+code.slice(7,12)/1000;p=P.find(x=>x.plu===plu);if(p){addProduct(p,{chosen:true,unitChosen:true,qty:w});toast(`${p.name} ${num(w)} ${p.unit}`);return true}}
  return false}

function docNo(prefix,col,filter){const d=new Date(),b=(get('branches',curBranch())||{}).code||'';const k=String(d.getFullYear()+543).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const n=all(col).filter(x=>x.no&&x.no.startsWith(prefix+b+k)).length+1;return prefix+b+k+'-'+String(n).padStart(4,'0')}
function applyStock(lines,branch,sign){lines.forEach(l=>{const p=get('products',l.pid);if(!tracks(p))return;const st=Object.assign({},p.stock||{});st[branch]=r2((+st[branch]||0)+sign*l.qty*(l.factor||1));put('products',Object.assign({},p,{stock:st}))})}

  const m=get('members',ST.cart.memberId);const credit=pays.filter(p=>p.m==='credit').reduce((a,p)=>a+p.amt,0),wal=pays.filter(p=>p.m==='wallet').reduce((a,p)=>a+p.amt,0);
  const earned=m?Math.floor((c.total-credit)/(+s.pointPer||25)):0;
  const sale=Object.assign({id:uid(),no:docNo('S','sales'),ts:Date.now(),branch:b,shiftId:(openShift()||{}).id||null,staffId:ST.user,memberId:ST.cart.memberId||null,level:ST.cart.level,lines,promos:c.promos,billDisc:c.billDisc,reward:c.reward?{id:c.reward.id,name:c.reward.name,points:c.reward.points,value:c.rewardDisc}:null,sub:c.sub,total:c.total,vat:c.vat,net:c.net,cost:c.cost,pay:pays,change:r2(paid-c.total),note:ST.cart.note||'',queue:nextQueue(),status:'paid',pointsEarned:earned},extra);

  const fnt=(sz,b)=>`${b?700:400} ${Math.round(sz)}px "IBM Plex Sans Thai","Sarabun",sans-serif`,P=6;let y=8;
  const wrap=(t,mw)=>{const out=[];let cur='';for(const sg of thSegs(t)){if(x.measureText(cur+sg).width<=mw||!cur)cur+=sg;else{out.push(cur);cur=sg.replace(/^\s+/,'')}}if(cur||!out.length)out.push(cur);return out};

  if(!intf)throw {code:'noep'};try{await dev.claimInterface(intf.interfaceNumber)}catch(e){throw {code:'claim'}}

  const cache=new Map();const lc=async q=>{if(!cache.has(q.k))cache.set(q.k,await labelCanvas(q.p,cfg,q.u));return cache.get(q.k)};const rows=[];
  if(cfg.cols<=1){let i=0;while(i<seq.length){let j=i;while(j<seq.length&&seq[j].k===seq[i].k)j++;rows.push({canvas:await lc(seq[i]),copies:j-i});i=j}return rows}
  const W=Math.round((cfg.w*cfg.cols+cfg.colGap*(cfg.cols-1))*D),H=Math.round(cfg.h*D);
  for(let i=0;i<seq.length;i+=cfg.cols){const grp=seq.slice(i,i+cfg.cols);const key=grp.map(q=>q.k).join('#');const last=rows[rows.length-1];if(last&&last.key===key){last.copies++;continue}
   const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);for(let k=0;k<grp.length;k++)x.drawImage(await lc(grp[k]),Math.round(k*(cfg.w+cfg.colGap)*D),0);rows.push({canvas:c,copies:1,key})}
  return rows}

async function printLabels(items){items=(items||[]).filter(x=>get('products',x.pid));if(!items.length)return toast('เลือกสินค้าก่อน','bad');const total=items.reduce((a,x)=>a+Math.max(1,x.n|0),0);
  if(LB.cfg.conn!=='file'&&lbDirect()){try{toast('กำลังส่งพิมพ์ '+total+' ดวง…');await devSend(LB,LB.cfg.conn,tsplJob(await labelRows(items)));toast('ส่งพิมพ์ฉลากแล้ว '+total+' ดวง')}catch(e){toast(prErr(e),'bad')}return}
  if(LB.cfg.conn!=='file')toast(prErr({code:'notconn'})+' · บันทึกเป็นไฟล์แทน','bad');
  const one=Object.assign({},LB.cfg,{cols:1});const pages=[];for(const it of items){const p=get('products',it.pid);const url=(await labelCanvas(p,one,it.unit||null)).toDataURL('image/png');for(let i=0;i<Math.max(1,it.n|0);i++)pages.push(`<div class="pg"><img src="${url}" alt=""></div>`)}
  saveFile('labels-'+dkey(Date.now())+'.html',pages.join(''),'ฉลากบาร์โค้ด '+total+' ดวง',LBL_CSS(LB.cfg))}

function receivePO(po){po.lines.forEach(l=>{const p=get('products',l.pid);if(!p)return;const tot=stockAll(p),cost=tot>0?r2((tot*(+p.cost||0)+l.qty*l.cost)/(tot+l.qty)):l.cost;const st=Object.assign({},p.stock||{});st[po.branch]=r2((+st[po.branch]||0)+l.qty);put('products',Object.assign({},p,{stock:st,cost}))});put('purchases',Object.assign({},po,{status:'received',receivedAt:Date.now()}))}

 const items={};L.forEach(s=>s.lines.forEach(l=>{const k=l.name;const o=items[k]||(items[k]={name:k,cat:l.cat||'',qty:0,amt:0,cost:0});const sg=s.status==='return'?-1:1;o.qty+=Math.abs(l.qty*(l.factor||1))*sg;o.amt+=l.total*(s.status==='return'?1:1);o.cost+=(l.cost||0)*l.qty}));
 const best=Object.values(items).sort((x,y)=>y.amt-x.amt);
 const pm={};L.forEach(s=>(s.pay||[]).forEach(p=>{pm[p.m]=(pm[p.m]||0)+p.amt-(p.m==='cash'&&s.change>0?s.change:0)}));
 const stf={};L.forEach(s=>s.lines.forEach(l=>{const id=l.staffId||s.staffId;const o=stf[id]||(stf[id]={n:0,amt:0,svc:0});o.amt+=l.total;if(l.staffId)o.svc+=l.total}));L.forEach(s=>{const o=stf[s.staffId];if(o)o.n++});
 const br={};all('sales').filter(s=>s.ts>=a&&s.ts<b&&s.status!=='void').forEach(s=>{const o=br[s.branch]||(br[s.branch]={amt:0,n:0,cost:0});o.amt+=+s.total;o.cost+=+s.cost||0;o.n++});
 const POs=all('purchases').filter(p=>p.status==='received'&&(p.receivedAt||p.ts)>=a&&(p.receivedAt||p.ts)<b&&(ST.repBranch==='*'||p.branch===ST.repBranch));const buy=r2(POs.reduce((x,p)=>x+p.total,0)),vin=r2(POs.reduce((x,p)=>x+(+p.vat||0),0));
 REP.best=[['สินค้า','หมวด','จำนวน','ยอดขาย','ต้นทุน','กำไร'],...best.map(x=>[x.name,x.cat,x.qty,r2(x.amt),r2(x.cost),r2(x.amt-x.cost)])];
 REP.sales=[['วันที่','เลขที่','สาขา','สมาชิก','ยอด','VAT','ต้นทุน','กำไร','สถานะ','ชำระโดย'],...L.map(s=>[new Date(s.ts).toLocaleString('th-TH'),s.no,bName(s.branch),(get('members',s.memberId)||{}).name||'',s.total,s.vat,s.cost,r2(s.total-(s.cost||0)),s.status,(s.pay||[]).map(p=>PAYM[p.m]).join('+')])];
 REP.vat=[['ประเภท','วันที่','เลขที่','คู่ค้า','มูลค่าก่อนภาษี','ภาษี','รวม'],...L.map(s=>['ภาษีขาย',new Date(s.ts).toLocaleDateString('th-TH'),s.no,(get('members',s.memberId)||{}).name||'ลูกค้าทั่วไป',s.net,s.vat,s.total]),...POs.map(p=>['ภาษีซื้อ',new Date(p.receivedAt||p.ts).toLocaleDateString('th-TH'),p.no,p.supplier,r2(p.total-p.vat),p.vat,p.total])];
 REP.buy=[['วันที่','เลขที่','ผู้จำหน่าย','สาขา','ยอด','VAT'],...POs.map(p=>[new Date(p.receivedAt||p.ts).toLocaleDateString('th-TH'),p.no,p.supplier,bName(p.branch),p.total,p.vat])];
 const stockVal=all('products').filter(tracks).reduce((x,p)=>x+(ST.repBranch==='*'?stockAll(p):stockOf(p,ST.repBranch))*(+p.cost||0),0);
 return `<div class="ph"><h2>รายงานธุรกิจ</h2><input type="date" data-ch="repFrom" value="${from}" style="width:auto" aria-label="ตั้งแต่"><span>ถึง</span><input type="date" data-ch="repTo" value="${to}" style="width:auto" aria-label="ถึง"><select data-ch="repBranch" style="width:auto" aria-label="สาขา"><option value="*">ทุกร้าน</option>${all('branches').map(b=>`<option value="${b.id}" ${ST.repBranch===b.id?'selected':''}>${h(b.name)}</option>`).join('')}</select>
 <button class="btn sm" data-act="rp" data-d="0">วันนี้</button><button class="btn sm" data-act="rp" data-d="6">7 วัน</button><button class="btn sm" data-act="rp" data-d="29">30 วัน</button></div>
 <div class="kpis"><div class="kpi"><small>ยอดขายสุทธิ</small><b>฿${money(sales)}</b></div><div class="kpi"><small>กำไรขั้นต้น</small><b style="color:var(--good)">฿${money(sales-cost)}</b></div><div class="kpi"><small>อัตรากำไร</small><b>${sales?num(r2((sales-cost)/sales*100)):0}%</b></div><div class="kpi"><small>จำนวนบิล</small><b>${n}</b></div><div class="kpi"><small>เฉลี่ยต่อบิล</small><b>฿${money(n?sales/n:0)}</b></div><div class="kpi"><small>มูลค่าสต็อก (ทุน)</small><b>฿${money(stockVal)}</b></div></div>
 <div class="grid2" style="margin-bottom:14px"><div class="card"><div class="row"><h3 aria-level="2">ยอดขายรายวัน</h3><span class="spacer"></span><button class="btn sm" data-act="csv" data-k="sales">Excel</button></div>${days.length<=62?`<div class="bars">${days.map(d=>`<div title="${d}: ฿${money(byDay[d]||0)}"><i style="height:${(byDay[d]||0)/mx*100}%"></i><span>${days.length>14?(+d.slice(8)%5===0||days.length<20?+d.slice(8):''):+d.slice(8)+'/'+ +d.slice(5,7)}</span></div>`).join('')}</div><p class="small muted" style="margin:6px 0 0">สูงสุด ฿${money(mx)} ต่อวัน</p>`:'<p class="muted">เลือกช่วงไม่เกิน 62 วันเพื่อดูกราฟ</p>'}</div>
 <div class="card"><h3 aria-level="2">แยกตามวิธีชำระ</h3><table style="margin-top:8px">${Object.entries(pm).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<tr><td>${PAYM[k]||k}</td><td class="r num">${money(v)}</td></tr>`).join('')||'<tr><td class="empty">ไม่มีข้อมูล</td></tr>'}</table></div></div>
 <div class="card" style="margin-bottom:14px"><div class="row"><h3 aria-level="2">สินค้าขายดี</h3><span class="spacer"></span><button class="btn sm" data-act="csv" data-k="best">Excel</button></div><div class="tw" style="margin-top:8px;border:0"><table><tr><th>#</th><th>สินค้า</th><th class="r">จำนวน</th><th class="r">ยอดขาย</th><th class="r">กำไร</th></tr>${best.slice(0,15).map((x,i)=>`<tr><td>${i+1}</td><td>${h(x.name)}</td><td class="r num">${num(x.qty)}</td><td class="r num">${money(x.amt)}</td><td class="r num">${money(x.amt-x.cost)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">ไม่มีข้อมูล</td></tr>'}</table></div></div>
 <div class="grid2" style="margin-bottom:14px"><div class="card"><h3 aria-level="2">รายร้าน</h3><table style="margin-top:8px"><tr><th>ร้าน</th><th class="r">บิล</th><th class="r">ยอดขาย</th><th class="r">กำไร</th></tr>${Object.entries(br).map(([k,v])=>`<tr><td>${h(bName(k))}</td><td class="r num">${v.n}</td><td class="r num">${money(v.amt)}</td><td class="r num">${money(v.amt-v.cost)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">ไม่มีข้อมูล</td></tr>'}</table></div>
 <div class="card"><h3 aria-level="2">รายพนักงาน / ผู้ให้บริการ</h3><table style="margin-top:8px"><tr><th>พนักงาน</th><th class="r">บิล</th><th class="r">ยอดขาย</th><th class="r">ค่าคอมบริการ</th></tr>${Object.entries(stf).map(([k,v])=>{const s=get('staff',k)||{};return `<tr><td>${h(s.name||'-')}</td><td class="r num">${v.n}</td><td class="r num">${money(v.amt)}</td><td class="r num">${money(v.svc*(+s.comm||0)/100)}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">ไม่มีข้อมูล</td></tr>'}</table></div></div>

function shiftSummary(sh){const S2=all('sales').filter(s=>s.shiftId===sh.id&&s.status!=='void');const by={};let cash=0;S2.forEach(s=>(s.pay||[]).forEach(p=>{by[p.m]=(by[p.m]||0)+p.amt;if(p.m==='cash')cash+=p.amt}));cash-=S2.reduce((a,s)=>a+(s.change>0?s.change:0),0);
 const ret=S2.filter(s=>s.status==='return').reduce((a,s)=>a+ +s.total,0);const log=all('cashlog').filter(c=>c.shiftId===sh.id);const cin=log.filter(c=>c.amt>0&&c.method==='cash').reduce((a,c)=>a+c.amt,0),cout=log.filter(c=>c.amt<0&&c.method==='cash').reduce((a,c)=>a+c.amt,0);
 return {sales:S2,by,cash:r2(cash),cin:r2(cin),cout:r2(cout),log,expected:r2(+sh.float+cash+cin+cout),total:r2(S2.reduce((a,s)=>a+ +s.total,0)),ret}}

 else{const x=shiftSummary(sh);top=`<div class="kpis"><div class="kpi"><small>เปิดกะโดย</small><b style="font-family:var(--body);font-size:1rem">${h((get('staff',sh.staffId)||{}).name||'')} · ${fmtT(sh.openAt)}</b></div><div class="kpi"><small>ยอดขายในกะ</small><b>฿${money(x.total)}</b></div><div class="kpi"><small>เงินสดที่ควรมีในลิ้นชัก</small><b>฿${money(x.expected)}</b></div><div class="kpi"><small>บิล</small><b>${x.sales.length}</b></div></div>

  <div class="tw"><table><tr><th>เวลา</th><th>รายการ</th><th>วิธี</th><th class="r">จำนวน</th><th>โดย</th></tr><tr><td>${fmtT(sh.openAt)}</td><td>เงินทอนตั้งต้น</td><td>เงินสด</td><td class="r num">${money(sh.float)}</td><td>${h((get('staff',sh.staffId)||{}).name||'')}</td></tr>${x.log.sort((a,b)=>a.ts-b.ts).map(c=>`<tr><td>${fmtT(c.ts)}</td><td>${h(c.reason)}</td><td>${PAYM[c.method]||c.method}</td><td class="r num" style="color:${c.amt<0?'var(--bad)':'inherit'}">${money(c.amt)}</td><td>${h((get('staff',c.staffId)||{}).name||'')}</td></tr>`).join('')}</table></div>`}
 return `<div class="ph"><h2>กะและลิ้นชักเงิน</h2></div>${top}<h3 aria-level="2" style="margin:18px 0 8px">กะที่ปิดแล้ว</h3><div class="tw"><table><tr><th>เปิด</th><th>ปิด</th><th>พนักงาน</th><th class="r">ยอดขาย</th><th class="r">เงินสดที่ควรมี</th><th class="r">นับได้</th><th class="r">ขาด/เกิน</th></tr>${H.map(s=>`<tr class="click" data-act="shiftReport" data-id="${s.id}"><td>${fmtDT(s.openAt)}</td><td>${fmtDT(s.closeAt)}</td><td>${h((get('staff',s.staffId)||{}).name||'')}</td><td class="r num">${money(s.summary&&s.summary.total)}</td><td class="r num">${money(s.expected)}</td><td class="r num">${money(s.counted)}</td><td class="r num" style="color:${s.counted-s.expected<0?'var(--bad)':'var(--good)'}">${money(s.counted-s.expected)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">ยังไม่มีประวัติกะ</td></tr>'}</table></div>`}

let custUnsub=null,custPath='';
const hbPath=b=>'live/hb-'+(b||curBranch());let hbLast=0,hbTimer=null;
function hbWrite(force){if(!ST.db||!isCustomer())return;const now=Date.now();if(!force&&now-hbLast<1500)return;hbLast=now;const path=hbPath(custBranch());const d={ts:now,seen:(ST.live&&ST.live.ts)||0,qr:!!(ST.live&&ST.live.qr),bank:!!(ST.live&&ST.live.bank),w:window.innerWidth||0};chain(path,()=>ST.db.doc(path).set(d))}

  clearInterval(hbTimer);hbTimer=setInterval(()=>{if(isCustomer()&&!document.hidden)hbWrite(true)},15000);hbWrite(true)}

  if(!d||!d.lines||!d.lines.length){const ads=String(cfg.ads||'').split('\n').map(x=>x.trim()).filter(Boolean);const ad=ads.length?ads[(ST.adIdx||0)%ads.length]:'';

  const qd=d.qr||(cfg.qrMode==='always'&&d.total>0?{amt:d.total}:null);const qq=cfg.qrMode!=='off'&&qd?((qd.qid&&qrById(qd.qid))||qrDefaultFor(d.branch)):null;

function adHold(){if(window.__adHold!=null)return window.__adHold;try{const v=localStorage.getItem('a11y-adpause');if(v!==null)return v==='1'}catch(e){}return !!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)}

function adShow(){clearTimeout(AD.timer);const st=document.getElementById('cadStage');if(!st)return;const cfg=CD();const L=(cfg.media||[]).filter(m=>m&&m.id);if(!L.length)return;const hold=adHold();adHoldBtn(st.parentElement,adShow);if(AD.idx>=L.length)AD.idx=0;const m=L[AD.idx];const src=BLOB(m.id);

  modal('จอลูกค้า',`<div class="stack" id="cdF">

   <label class="f">ข้อความต้อนรับ (แสดงแถบล่างตอนเล่นโฆษณา และแถบขวาตอนไม่มีโฆษณา)<input name="welcome" value="${h(draft.welcome)}" placeholder="สมัครสมาชิกด้วยเบอร์โทร สะสมแต้มทุกครั้งที่ซื้อ"></label>
   <div class="grid2"><label class="f">แสดงรูปละ (วินาที)<input name="slideSec" type="number" min="2" max="120" value="${draft.slideSec||8}"></label><label class="f">การจัดรูป/วิดีโอ<select name="fit"><option value="cover" ${draft.fit!=='contain'?'selected':''}>เต็มจอ (ตัดขอบ)</option><option value="contain" ${draft.fit==='contain'?'selected':''}>พอดีจอ (เห็นทั้งภาพ)</option></select></label></div>
   <button class="btn pri" type="button" id="cdSaveTop">บันทึก</button>
   <div class="f"><b style="color:var(--ink)">รูปและวิดีโอโฆษณา (<span id="cdMN">${(draft.media||[]).length}</span>)</b><div id="cdMediaBox">${mediaHTML()}</div><span class="small muted">วิดีโอเล่นแบบปิดเสียงจนจบแล้วไปไฟล์ถัดไป · รูปและวิดีโอเก็บในระบบของร้าน ทุกจอลูกค้าเห็นชุดเดียวกัน</span></div>

   <details class="prsec"><summary><b>ตั้งค่าเพิ่มเติม</b> <span class="small muted">เปิด/ปิด สี โลโก้ QR ข้อความหลังชำระ</span></summary><div class="stack" style="margin-top:12px">
    <label class="chk"><input type="checkbox" name="on" ${draft.on?'checked':''}> <b>เปิดใช้หน้าจอลูกค้า</b></label>
    <div class="grid2"><label class="f">สีหน้าจอ<select name="theme"><option value="green" ${draft.theme==='green'?'selected':''}>สีหลักของร้าน</option><option value="light" ${draft.theme==='light'?'selected':''}>สว่าง</option><option value="dark" ${draft.theme==='dark'?'selected':''}>เข้ม</option></select></label>
     <label class="f">ขนาดตัวอักษร<select name="size"><option value="m" ${draft.size==='m'?'selected':''}>ปกติ (จอเล็ก/มือถือ)</option><option value="l" ${draft.size==='l'?'selected':''}>ใหญ่ (แท็บเล็ต)</option><option value="xl" ${draft.size==='xl'?'selected':''}>ใหญ่มาก (จอทีวี)</option></select></label></div>
    <div class="f">โลโก้ร้าน<div class="row"><label class="btn sm" for="cdLogo">เลือกรูปโลโก้</label><input type="file" id="cdLogo" accept="image/*" hidden><button class="btn sm ghost" type="button" id="cdLogoDel" ${draft.logo||draft.logoData?'':'hidden'}>ลบโลโก้</button><span class="small muted" id="cdLogoSt"></span></div></div>
    <div class="grid2"><label class="f">แสดง QR ชำระเงินบนจอ<select name="qrMode"><option value="pay" ${draft.qrMode==='pay'?'selected':''}>เมื่อแคชเชียร์เลือกจ่ายด้วย QR</option><option value="always" ${draft.qrMode==='always'?'selected':''}>ตลอดเวลาที่มีบิล</option><option value="off" ${draft.qrMode==='off'?'selected':''}>ไม่แสดง</option></select></label>
     <label class="f">สัญลักษณ์กลาง QR<select name="qrMark"><option value="baht" ${(draft.qrMark||'baht')==='baht'?'selected':''}>วงกลม ฿</option><option value="logo" ${draft.qrMark==='logo'?'selected':''}>โลโก้ร้าน</option><option value="none" ${draft.qrMark==='none'?'selected':''}>ไม่มี</option></select></label></div>
    <div class="row"><label class="chk"><input type="checkbox" name="showItems" ${draft.showItems?'checked':''}> รายการสินค้า</label><label class="chk"><input type="checkbox" name="showDisc" ${draft.showDisc?'checked':''}> ส่วนลด</label><label class="chk"><input type="checkbox" name="showMember" ${draft.showMember?'checked':''}> ชื่อสมาชิกและแต้ม</label></div>
    <div class="grid2"><label class="f">ข้อความหลังชำระเงิน<input name="thanks" value="${h(draft.thanks)}"></label><label class="f">แสดงนาน (วินาที)<input name="thanksSec" type="number" min="1" max="60" value="${draft.thanksSec}"></label></div>
    <div class="f">เปิดจอลูกค้าของแต่ละร้าน<div class="cdlinks">${links}</div></div></div></details></div>`,
  {wide:true,foot:`<button class="btn" data-act="closeModal">ปิด</button><button class="btn pri" id="cdSave">บันทึก</button>`,onClose(){if(img.fresh)dropAsset(img.fresh)},onMount(){
   const read=()=>{const v=vals($('#cdF'));return Object.assign({},draft,{welcome:v.welcome,slideSec:Math.min(120,Math.max(2,+v.slideSec||8)),fit:v.fit,on:v.on,theme:v.theme,size:v.size,qrMode:v.qrMode,qrMark:v.qrMark,showItems:v.showItems,showDisc:v.showDisc,showMember:v.showMember,thanks:v.thanks,thanksSec:Math.min(60,Math.max(1,+v.thanksSec||6))})};
   const draw=()=>{const cfg=read();Object.assign(draft,cfg);const prev=$('#cdPrev');if(prev)prev.innerHTML=custHTML(cdSample(pv),cfg,SHOPS().length>1?bName(curBranch()):SET().shop,true);document.querySelectorAll('#cdPvT button').forEach(x=>x.classList.toggle('on',x.dataset.pv===pv))};
   const saveMedia=()=>{const s0=SET();put('settings',Object.assign({},s0,{id:'main',cd:Object.assign({},s0.cd||{},{media:draft.media,sideBg:draft.sideBg})}))};
   const bindMedia=()=>{$('#cdMediaBox').innerHTML=mediaHTML();$('#cdMN').textContent=(draft.media||[]).length;
    document.querySelectorAll('[data-mdel]').forEach(x=>x.onclick=()=>{const i=+x.dataset.mdel;const m=draft.media[i];draft.media=draft.media.filter((_,k)=>k!==i);saveMedia();dropAsset(m&&m.id);bindMedia();draw()});
    document.querySelectorAll('[data-mmv]').forEach(x=>x.onclick=()=>{const i=+x.dataset.mmv,j=i+ +x.dataset.d;const L=draft.media.slice();[L[i],L[j]]=[L[j],L[i]];draft.media=L;saveMedia();bindMedia();draw()});
    $('#cdMedia').onchange=async e=>{const files=[...e.target.files];e.target.value='';if(!files.length||busy)return;const a=await assetsNS();if(!a)return toast('เครื่องนี้อัปโหลดไฟล์ไม่ได้ (ต้องเป็นบัญชีที่แก้ไขหน้านี้ได้)','bad');busy=true;const st=$('#cdMediaSt');let ok=0;
     for(let i=0;i<files.length;i++){const f=files[i];st.textContent=`กำลังอัปโหลด ${i+1}/${files.length}…`;const isV=/^video\//.test(f.type);
      try{if(isV&&!/^video\/(mp4|webm)$/.test(f.type))throw {code:'unsupported_type'};if(f.size>20*1024*1024)throw {code:'too_large'};const blob=isV?f:await shrinkImage(f,1920,.86);const r=await a.upload(blob);draft.media=(draft.media||[]).concat([{id:r.id,type:isV?'video':'image',name:f.name}]);ok++}
      catch(err){const c=err&&err.code;toast(f.name+': '+(c==='too_large'?'ไฟล์ใหญ่เกิน 20MB':c==='unsupported_type'?'ใช้ได้เฉพาะ MP4 หรือ WEBM':c==='quota_or_state'?'พื้นที่เก็บไฟล์เต็ม ลบไฟล์เก่าก่อน':'อัปโหลดไม่สำเร็จ'),'bad')}}
     busy=false;if(ok){saveMedia();toast('เพิ่มแล้ว '+ok+' ไฟล์');if(pv!=='ad'){pv='ad'}}bindMedia();draw()}};
   bindMedia();$('#cdF').addEventListener('input',draw);$('#cdF').addEventListener('change',draw);document.querySelectorAll('#cdPvT button').forEach(x=>x.onclick=()=>{pv=x.dataset.pv;draw()});draw();
   $('#cdBg').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const a=await assetsNS();if(!a)throw {code:'na'};const r=await a.upload(await shrinkImage(f,1200,.85));const old=draft.sideBg;draft.sideBg=r.id;saveMedia();if(old)dropAsset(old);$('#cdBgPrev').innerHTML=`<img src="${h(r.url)}" alt="">`;$('#cdBgDel').hidden=false;draw()}catch(err){toast('อัปโหลดรูปไม่สำเร็จ','bad')}};
   $('#cdBgDel').onclick=()=>{const old=draft.sideBg;draft.sideBg=null;saveMedia();if(old)dropAsset(old);$('#cdBgPrev').innerHTML=ico('ui');$('#cdBgDel').hidden=true;draw()};
   const st$=$('#cdLogoSt'),delB=$('#cdLogoDel');
   $('#cdLogo').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;st$.textContent='กำลังอัปโหลด…';try{const a=await assetsNS();const blob=await shrinkImage(f,a?400:200,.86);if(a){const r=await a.upload(blob);if(img.fresh)dropAsset(img.fresh);img.fresh=r.id;draft.logo=r.id;draft.logoData=null}else{draft.logoData=await blobToData(blob);draft.logo=null}delB.hidden=false;st$.textContent='พร้อมบันทึก';draw()}catch(err){st$.textContent='';toast('อัปโหลดโลโก้ไม่สำเร็จ','bad')}};
   delB.onclick=()=>{if(img.fresh){dropAsset(img.fresh);img.fresh=null}draft.logo=null;draft.logoData=null;delB.hidden=true;st$.textContent='จะลบโลโก้เมื่อกดบันทึก';draw()};
   document.querySelectorAll('[data-cdcopy]').forEach(b=>b.onclick=()=>{const t=b.dataset.cdcopy;navigator.clipboard.writeText(t).then(()=>toast('คัดลอก '+t+' แล้ว'),()=>toast('คัดลอกไม่ได้ พิมพ์ '+t+' ต่อท้ายลิงก์แทน','bad'))});
   document.querySelectorAll('[data-cdgo]').forEach(b=>b.onclick=()=>{closeModal();location.hash='customer-'+b.dataset.cdgo});
   const save=()=>{const cfg=read();const old=CD();const {on,...rest}=cfg;put('settings',Object.assign({},SET(),{id:'main',display:on,cd:rest}));if(old.logo&&old.logo!==rest.logo)dropAsset(old.logo);img.fresh=null;toast('บันทึกการตั้งค่าจอลูกค้าแล้ว');pushDisplay()};
   $('#cdSaveTop').onclick=save;$('#cdSave').onclick=()=>{save();closeModal()}}})}

const CDV_TABS=[['live','จอจริง'],['ad','ตอนโฆษณา'],['sale','กำลังซื้อ'],['cash','ชำระเงินสด'],['qr','ชำระ QR'],['bank','ชำระโอนเงิน'],['done','ชำระเสร็จ']];

   <div class="cdvstage">${custHTML(d,cfg,name,true)}</div>
   <p class="small muted" style="margin:0">${k==='live'?'แสดงตามบิลปัจจุบันบนเครื่องนี้ เพิ่มสินค้าหรือกดชำระเงินแล้วกลับมาดูได้':'ตัวอย่างด้วยข้อมูลสมมติ'} · เปิดจอจริงบนแท็บเล็ตด้วยลิงก์นี้ต่อท้าย <span class="mono">#customer-${h(curBranch())}</span></p></div>`}
const VIEWS={pos:viewPOS,sales:viewSales,stock:viewStock,members:viewMembers,service:viewService,docs:viewDocs,branch:viewBranch,report:viewReport,shift:viewShift,settings:viewSettings,cdview:viewCdview};

const A={
 closeModal,go(el){ST.route=el.dataset.r;render();$('main')&&($('main').scrollTop=0)},tab(el){ST.tab[el.dataset.g]=el.dataset.t;render()},

 qty(el){const l=ST.cart.lines.find(x=>x.key===el.dataset.k);if(!l)return;l.qty=r2(+l.qty+ +el.dataset.d);if(l.qty<=0)ST.cart.lines=ST.cart.lines.filter(x=>x!==l);cartChanged()},
