<title>POS คาเฟ่</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: restaurant-POS shell. Dark left rail of sections; working area right. Sell = menu grid + bill panel. */
:root{
  --bg:#F3F7FC; --surface:#FFFFFF; --sunk:#E9F0F8; --ink:#1F2A37; --muted:#5B6B7D; --line:#E1E8F0; --line2:#CDD8E4;
  --accent:#2F6FB0; --accent-hover:#275E96; --on-accent:#FFFFFF; --accent-fill:#6AA9E0; --accent-soft:#E3F0FC; --accent-soft-ink:#1E4F80;
  --dark:#1F2A37; --on-dark:#FFFFFF; --rail:#FFFFFF; --rail-ink:#5B6B7D; --rail-on:#E3F0FC; --rail-on-ink:#2C66A3;
  --ok:#2E9D62; --ok-soft:#E5F6EE; --ok-ink:#19663F;
  --warn:#F2B200; --warn-soft:#FFF6D9; --warn-ink:#7A5600; --bad:#D9534F; --bad-soft:#FDECEC; --bad-ink:#A12020;
  --ch-store:#1F2A37; --ch-take:#9AA8B8; --ch-deli:#F0A04B;
  --t-0:#E3F0FC; --i-0:#2C66A3; --t-1:#E5F6EE; --i-1:#1E7A4B; --t-2:#FFF4DA; --i-2:#8A6200; --t-3:#F1E9FB; --i-3:#6A44A8; --t-4:#FDE8EE; --i-4:#A33A5B; --t-5:#E2F6F7; --i-5:#1F6E75;
  --scrim:rgba(15,22,32,.5); --shadow:0 1px 3px rgba(31,42,55,.12);
  --f-body:'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1620; --surface:#18212D; --sunk:#222D3B; --ink:#E6EDF5; --muted:#9DADBF; --line:#263243; --line2:#34435A;
  --accent:#8EC5F0; --accent-hover:#A9D3F5; --on-accent:#0B1D2E; --accent-fill:#7FB9EC; --accent-soft:#1C3045; --accent-soft-ink:#B8DBF8;
  --dark:#E6EDF5; --on-dark:#0F1620; --rail:#131B26; --rail-ink:#9DADBF; --rail-on:#1C3045; --rail-on-ink:#A9D3F5;
  --ok:#5CCB8E; --ok-soft:#173326; --ok-ink:#9BE3BC;
  --warn:#F2C230; --warn-soft:#3A3014; --warn-ink:#F5D97A; --bad:#FF7B7B; --bad-soft:#3B1F1F; --bad-ink:#FFB5B5;
  --ch-store:#E6EDF5; --ch-take:#7D8B9C; --ch-deli:#F0A04B;
  --t-0:#1C3045; --i-0:#B8DBF8; --t-1:#173326; --i-1:#9BE3BC; --t-2:#3A3014; --i-2:#F5D97A; --t-3:#2A2140; --i-3:#CDB6F2; --t-4:#3A1F2A; --i-4:#F2B0C4; --t-5:#16343A; --i-5:#9EDDE3;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1620; --surface:#18212D; --sunk:#222D3B; --ink:#E6EDF5; --muted:#9DADBF; --line:#263243; --line2:#34435A;
  --accent:#8EC5F0; --accent-hover:#A9D3F5; --on-accent:#0B1D2E; --accent-fill:#7FB9EC; --accent-soft:#1C3045; --accent-soft-ink:#B8DBF8;
  --dark:#E6EDF5; --on-dark:#0F1620; --rail:#131B26; --rail-ink:#9DADBF; --rail-on:#1C3045; --rail-on-ink:#A9D3F5;
  --ok:#5CCB8E; --ok-soft:#173326; --ok-ink:#9BE3BC;
  --warn:#F2C230; --warn-soft:#3A3014; --warn-ink:#F5D97A; --bad:#FF7B7B; --bad-soft:#3B1F1F; --bad-ink:#FFB5B5;
  --ch-store:#E6EDF5; --ch-take:#7D8B9C; --ch-deli:#F0A04B;
  --t-0:#1C3045; --i-0:#B8DBF8; --t-1:#173326; --i-1:#9BE3BC; --t-2:#3A3014; --i-2:#F5D97A; --t-3:#2A2140; --i-3:#CDB6F2; --t-4:#3A1F2A; --i-4:#F2B0C4; --t-5:#16343A; --i-5:#9EDDE3;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{text-wrap:balance}

.app{height:100%;display:flex}
.rail{width:96px;flex-shrink:0;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;overflow-y:auto;padding-block:12px;padding-left:env(safe-area-inset-left,0px)}
.rail .logo{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:18px;margin-bottom:10px;flex-shrink:0}
.nav{width:82px;min-height:62px;border:0;border-radius:12px;background:transparent;color:var(--rail-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;line-height:1.2;text-align:center;padding:6px 4px;position:relative;flex-shrink:0}
.nav svg{width:22px;height:22px}
.nav[aria-current="page"]{box-shadow:inset 3px 0 0 var(--accent-fill);background:var(--rail-on);color:var(--rail-on-ink);font-weight:600}
.nav .badge{position:absolute;top:4px;right:10px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent-fill);color:#0B1D2E;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.top h1{margin:0;font-size:18px;line-height:1.2}
.top small{display:block;font-size:12px;color:var(--muted)}
.top .spacer{flex:1}
.pillx{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:600;background:var(--ok-soft);color:var(--ok-ink);white-space:nowrap;border:0}
.pillx i{width:8px;height:8px;border-radius:4px;background:var(--ok)}
.pillx.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pillx.warn i{background:var(--warn)}
.clock{font-family:var(--f-num);font-weight:600;font-size:17px}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.pad-view{flex:1;min-height:0;overflow-y:auto;padding-block:16px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* common controls */
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{height:56px;font-size:17px;border-radius:14px}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.icon{width:44px;padding:0}
.btn.sm.icon{width:36px}
.chip{height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--line2);background:var(--surface);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.chip[aria-selected="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip small{font-weight:500;opacity:.75}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-size:17px}
.panel h3{margin:0;font-size:15px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.note{padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn-ink);font-size:14px}
.okbox{padding:12px 16px;border-radius:14px;background:var(--ok-soft);color:var(--ok-ink);font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.okbox .num{font-size:26px}
.okbox.bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sunk);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form input:not([type=checkbox]):not([type=radio]),.form select,.form textarea{height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:400;width:100%}
.form .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.check{flex-direction:row !important;align-items:center;gap:10px !important;color:var(--ink) !important;font-weight:500 !important;font-size:15px !important;min-height:44px}
.check input{width:22px;height:22px;flex-shrink:0;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.seg{padding:4px;background:var(--sunk);border-radius:12px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.seg button{height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;padding:0 8px;white-space:nowrap}
.seg button[aria-checked="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.htable{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:13px}
td.r,th.r{text-align:right}

/* sell */
.sell{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px}
.menu-pane{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;padding:16px}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;align-content:start;padding-bottom:8px}
.item{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.item:hover:not(:disabled){border-color:var(--accent-fill)}
.item .pic{height:82px;display:grid;place-items:center;position:relative}
.item .pic svg{width:36px;height:36px}
.item .tag{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:6px;background:var(--dark);color:var(--on-dark);font-size:11px;font-weight:600}
.item .tag.out{background:var(--bad);color:#fff}
.item .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.item .nm{font-weight:600;line-height:1.35}
.item .en{font-size:12px;color:var(--muted)}
.item .pr{font-family:var(--f-num);font-weight:600;color:var(--accent);margin-top:4px}
.bill{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.bill-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.bill-id{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bill-id b{font-size:20px;display:block;line-height:1.2}
.bill-id small{font-size:13px;color:var(--muted)}
.lines{flex:1;min-height:60px;overflow-y:auto;padding:4px 16px}
.line{display:flex;gap:10px;width:100%;text-align:left;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:transparent}
.line .q{min-width:30px;height:30px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:14px;flex-shrink:0}
.line .info{flex:1;min-width:0}
.line .nm{font-weight:600}
.line .op{font-size:13px;color:var(--muted)}
.line .dc{font-size:12px;color:var(--accent);font-weight:600}
.line .amt{text-align:right;font-family:var(--f-num);font-weight:600;white-space:nowrap}
.line .amt s{display:block;font-size:12px;color:var(--muted);font-weight:500}
.bill-sum{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.row.total{color:var(--ink);align-items:baseline;margin-top:4px}
.row.total b{font-size:16px}
.row.total .num{font-size:26px;font-weight:600}
.bill-acts{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.bill-acts .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bill-acts .three .btn{padding:0 8px;font-size:14px}
.cartbar{display:none}
.sheet-close{display:none !important}
.gate{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.gate .panel{max-width:440px;width:100%}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dialog{width:100%;max-width:600px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px}
.dialog.wide{max-width:920px}
.dialog.narrow{max-width:440px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg-head h2{margin:0;font-size:21px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{height:44px;min-width:88px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);font-weight:600}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt small{font-weight:500;opacity:.8}
.dlg-actions{display:flex;gap:10px;flex-wrap:wrap}
.dlg-actions .grow{flex:1}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-size:20px;line-height:1}
.stepper span{min-width:44px;text-align:center;font-family:var(--f-num);font-weight:600;font-size:18px}

.pay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px}
.pay-sum{background:var(--sunk);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;align-self:start}
.pay-sum .big{font-family:var(--f-num);font-size:38px;font-weight:600;line-height:1.1;color:var(--ink)}
.recv{background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:10px 14px;text-align:right}
.recv small{display:block;text-align:left;color:var(--muted);font-size:13px}
.recv .num{font-size:32px;font-weight:600}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.quick button{height:46px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-family:var(--f-num);font-weight:600}
.numpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.numpad button{height:52px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-family:var(--f-num);font-size:20px;font-weight:600}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qrwrap{background:#fff;padding:12px;border-radius:16px;border:1px solid var(--line)}
.qrwrap canvas,.qrwrap img{display:block;max-width:100%}
.done-no{font-family:var(--f-num);font-size:60px;font-weight:600;color:var(--accent);line-height:1}

/* receipts */
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:20px;align-items:start}
.rv-left{display:flex;flex-direction:column;gap:12px}
.rv-left h2{margin:0;font-size:22px}
.paper{background:var(--sunk);border-radius:14px;padding:14px;overflow:auto;max-height:62vh}
.paper .rcpt{--pw:300px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.paper.p58 .rcpt{--pw:220px}

/* bar queue & open bills */
.ocols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.ocol{background:var(--sunk);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ocol h2{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.ocol h2 span{min-width:28px;height:28px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-family:var(--f-num);font-size:14px;padding:0 8px}
.ocard{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--ch-store)}
.ocard.take{border-top-color:var(--ch-take)}
.ocard.deli{border-top-color:var(--ch-deli)}
.ocard .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ocard .no{font-family:var(--f-num);font-size:20px;font-weight:600}
.ocard .age{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted)}
.ocard .age.late{color:var(--bad)}
.ocard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:14px}
.ocard ul small{color:var(--muted)}
.ocard li.new{font-weight:700}
.ocard .acts{display:flex;gap:6px}
.ocard .acts .btn{flex:1;height:42px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bills{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

/* history */
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:14px;padding-block:16px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.split > *{min-height:0}
.hlist{overflow-y:auto;display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.hrow[aria-current="true"]{background:var(--accent-soft);color:var(--accent-soft-ink);box-shadow:inset 3px 0 0 var(--accent-fill)}
.hrow .info{flex:1;min-width:0}
.hrow small{display:block;color:var(--muted);font-size:12px}
.hrow[aria-current="true"] small{color:inherit}

/* reports */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi small{color:var(--muted);font-size:13px}
.kpi .num{display:block;font-size:26px;font-weight:600}

/* ===== pricing ===== */
function priceFor(m,type){return type==='deli'&&+m.priceDeli>0?+m.priceDeli:+m.price||0}
function lineDisc(l){const d=l.disc;if(!d)return 0;const g=l.unit*l.qty;return r2(d.type==='percent'?g*d.value/100:Math.min(g,d.value*l.qty))}
function calc(items,promo){
  const sh=shop();let sub=0,count=0,idisc=0;
  items.forEach(l=>{sub+=l.unit*l.qty;count+=l.qty;idisc+=lineDisc(l)});
  sub=r2(sub);idisc=r2(idisc);const after=r2(sub-idisc);
  const bdisc=promo?r2(promo.type==='percent'?after*promo.value/100:Math.min(after,promo.value)):0;
  const net=r2(after-bdisc);
  const sc=sh.scOn?r2(net*(+sh.scRate||0)/100):0;
  const base=r2(net+sc);
  let vat=0,total=base;
  if(sh.vatMode==='included')vat=r2(base*7/107);else if(sh.vatMode==='excluded'){vat=r2(base*0.07);total=r2(base+vat)}
  let rt=total;if(sh.rounding==='down')rt=Math.floor(total);else if(sh.rounding==='up')rt=Math.ceil(total);else if(sh.rounding==='nearest')rt=Math.round(total);
  return {sub,count,idisc,bdisc,disc:r2(idisc+bdisc),net,sc,vat,round:r2(rt-total),total:r2(rt),pre:sh.vatMode==='excluded'?base:r2(base-vat)};
}

function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amount){
  const t=(tag,v)=>tag+pad(v.length,2)+v;
  let target=String(id||'').replace(/\D/g,'');if(!target)return '';
  let sub;if(target.length===13)sub=t('02',target);else if(target.length===15)sub=t('03',target);else sub=t('01',('0000000000000'+target.replace(/^0/,'66')).slice(-13));
  let p=t('00','01')+t('01',amount?'12':'11')+t('29',t('00','A000000677010111')+sub)+t('58','TH')+t('53','764');
  if(amount)p+=t('54',Number(amount).toFixed(2));
  p+='6304';return p+crc16(p);
}
function drawQr(el,amount,size,pp){
  if(!el)return;el.innerHTML='';
  const payload=ppPayload(pp!=null?pp:((defQr()||{}).pp||''),amount);
  if(!payload||typeof QRCode==='undefined')return;
  try{new QRCode(el,{text:payload,width:size||220,height:size||220,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){}
}

function roundStats(rd){
  const list=allOrders().concat(S.hist.list||[]).filter((o,i,a)=>o.roundId===rd.id&&a.findIndex(x=>x.id===o.id)===i);
  const st={sales:0,bills:0,voids:0,by:{},ins:0,outs:0};
  list.forEach(o=>{if(o.state==='paid'){st.sales=r2(st.sales+o.sums.total);st.bills++;st.by[o.method]=r2((st.by[o.method]||0)+o.sums.total)}else if(o.state==='void')st.voids++});
  (rd.moves||[]).forEach(m=>{if(m.type==='in')st.ins=r2(st.ins+m.amount);else st.outs=r2(st.outs+m.amount)});

}

async function commitBill(pay){
  const b=S.bill;const t=calc(b.items,b.promo);const now=Date.now();
  const hasNew=b.items.some(l=>!l.batch);
  const batch=hasNew?(b.batch||0)+1:(b.batch||0);
  const items=b.items.map(l=>{const x=Object.assign({},l,{batch:l.batch||batch});if(!x.st)x.st=stationOfMenu(l.menuId);delete x.key;return x});
  const prevO=b.id?(ordersMap()[b.id]||{}):{};const kst=Object.assign({},prevO.kst||{});
  if(!prevO.kst&&prevO.kitchen)stationsOf({items:prevO.items||[]}).forEach(st=>{kst[st]=prevO.kitchen});
  if(hasNew)items.filter(i=>i.batch===batch).forEach(i=>{kst[i.st]='waiting'});
  const doc={type:b.type,table:b.table||null,guests:b.guests||0,items,promo:b.promo||null,member:b.member||'',batch,sums:t,updatedAt:now};
  doc.kst=kst;doc.kitchen=items.length?overallK({items,kst}):'done';if(hasNew)doc.batchAt=now;
  if(!b.id)Object.assign(doc,{no:nextNo(),createdAt:now,day:dayKey(now),state:'open'});
  if(pay)Object.assign(doc,{state:'paid',paidAt:now,method:pay.method,received:pay.received,change:pay.change,rno:nextRno(),roundId:S.round?S.round.id:null});
  let id=b.id;
  if(S.db){
    try{if(id)await S.db.doc('orders/'+id).update(doc);else{const ref=S.db.collection('orders').doc();await ref.set(doc);id=ref.id}}
    catch(e){toast(dbErr(e));return null}
  }else id=id||'local-'+now;
  const prev=ordersMap()[id]||{};
  const full=norm(Object.assign({},prev,doc,{id}));full._newBatch=hasNew;
  S.oToday[id]=full;if(full.state==='open')S.oOpen[id]=full;else delete S.oOpen[id];
  return full;
}

  else{t.x=Math.max(0,Math.min(1200-t.w,g(drag.ox+dx)));t.y=Math.max(0,Math.min(800-t.h,g(drag.oy+dy)))}
  const n=drag.node;if(n){n.style.left=t.x/12+'%';n.style.top=t.y/8+'%';n.style.width=t.w/12+'%';n.style.height=t.h/8+'%'}
});

  const it={name,kind,seats:base?base.seats:(k.seats||0),zone,w:base?base.w:k.w,h:base?base.h:k.h,x:Math.min(1200-k.w,base?base.x+30:520+(inZone%6)*20),y:Math.min(800-k.h,base?base.y+30:330+(inZone%6)*20)};
  if(S.db){try{const ref=await S.db.collection('tables').add(it);S.sel=ref.id}catch(e){toast(dbErr(e));return}}
  else{const id='local-t'+Date.now();S.tables.push(Object.assign({id},it));S.sel=id}
  renderFloor();
}

function reportsView(){
  const today=S.rep.date===dayKey(Date.now());
  const src=today?allOrders().filter(o=>(o.createdAt||0)>=startToday()):(S.rep.list||[]);
  const paid=src.filter(o=>o.state==='paid');
  const s={total:0,disc:0,sc:0,vat:0,by:{},types:{},items:{},hours:{}};
  paid.forEach(o=>{const t=o.sums;s.total+=t.total;s.disc+=t.disc;s.sc+=t.sc;s.vat+=t.vat;s.by[o.method]=(s.by[o.method]||0)+t.total;s.types[o.type]=(s.types[o.type]||0)+t.total;
    const h=new Date(o.paidAt||o.createdAt).getHours();s.hours[h]=(s.hours[h]||0)+t.total;o.items.forEach(i=>{s.items[i.name]=(s.items[i.name]||0)+i.qty})});
  const voids=src.filter(o=>o.state==='void').length,opn=src.filter(o=>o.state==='open').length;
  let h0=7,h1=20;Object.keys(s.hours).forEach(h=>{h=+h;if(h<h0)h0=h;if(h>h1)h1=h});const hrs=[];for(let h=h0;h<=h1;h++)hrs.push(h);
  const hmax=Math.max(1,...hrs.map(h=>s.hours[h]||0));
  const top=Object.entries(s.items).sort((a,b)=>b[1]-a[1]).slice(0,8);const tmax=top.length?top[0][1]:1;
  const loading=!today&&S.rep.list==null&&S.db;
  return `<div class="pad-view"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><h2 style="margin:0;font-size:20px">รายงานยอดขาย</h2><span class="muted" style="font-size:13px">ไม่รวมบิลที่ทำลาย (${voids}) และบิลที่ยังเปิดอยู่ (${opn})</span></div>
    <label class="form" for="rDate" style="flex-direction:row;align-items:center;gap:8px"><span class="hint">วันที่</span><input id="rDate" type="date" value="${esc(S.rep.date)}" max="${dayKey(Date.now())}" style="height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink)"></label></div>
    ${loading?'<div class="panel"><div class="empty">กำลังโหลด…</div></div>':`<div class="kpis"><div class="kpi"><small>ยอดขายสุทธิ</small><span class="num">${baht(r2(s.total))}</span></div><div class="kpi"><small>จำนวนบิล</small><span class="num">${paid.length}</span></div><div class="kpi"><small>เฉลี่ยต่อบิล</small><span class="num">${baht(paid.length?Math.round(s.total/paid.length):0)}</span></div><div class="kpi"><small>ส่วนลดรวม</small><span class="num">${baht(r2(s.disc))}</span></div></div>
    <div class="panels"><section class="panel span2"><h2>ยอดขายรายชั่วโมง</h2>${paid.length?`<div class="bars" role="img" aria-label="กราฟยอดขายรายชั่วโมง">${hrs.map(h=>{const v=s.hours[h]||0;return `<div><em>${v?(v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)):''}</em><i style="height:${Math.max(v?3:0,Math.round(v/hmax*85))}%"></i></div>`}).join('')}</div><div class="bar-x">${hrs.map(h=>`<span>${pad(h,2)}</span>`).join('')}</div>`:'<div class="empty"><b>ยังไม่มียอดขาย</b>กราฟจะขึ้นเมื่อมีบิลที่ชำระแล้ว</div>'}</section>
      <section class="panel"><h2>เมนูขายดี</h2>${top.length?top.map(([n,q])=>`<div class="hbar"><div class="t"><span>${esc(n)}</span><span class="num muted">${q}</span></div><div class="track"><div class="fill" style="width:${Math.round(q/tmax*100)}%"></div></div></div>`).join(''):'<div class="muted">ยังไม่มีข้อมูล</div>'}</section>
      <section class="panel"><h2>ช่องทางการชำระเงิน</h2><div class="htable"><table><tbody>${METHODS.map(m=>`<tr><td>${esc(MLABEL[m.v])}</td><td class="r num">${baht(r2(s.by[m.v]||0))}</td><td class="r num muted">${s.total?Math.round((s.by[m.v]||0)/s.total*100):0}%</td></tr>`).join('')}</tbody></table></div></section>

            ${ro?'':`<button class="chip" data-act="soldout" data-id="${esc(m.id)}" aria-pressed="${!!m.soldOut}" style="height:36px">${m.soldOut?'หมดอยู่':'ปิดเมนู (หมด)'}</button><button class="btn sm" data-act="editmenu" data-id="${esc(m.id)}">แก้ไข</button>`}</div>`}).join('')}).join(''):'<div class="empty"><b>ยังไม่มีเมนู</b>สร้างหมวดหมู่และตัวเลือกก่อน แล้วกด “เพิ่มเมนู”</div>');
  }else if(tab==='cats'){
    body=`<h2>หมวดหมู่</h2>${ro?'':'<form class="form" id="catForm" style="flex-direction:row;gap:8px"><label for="catName" class="sr">ชื่อหมวดหมู่ใหม่</label><input id="catName" placeholder="สร้างหมวดหมู่ใหม่" maxlength="40" style="flex:1"><button class="btn primary" type="submit">บันทึก</button></form>'}`+
      (S.cats.length?S.cats.map((c,i)=>{const n=S.menu.filter(m=>menuCat(m)===c.id).length;const del=S.confirm==='cdel:'+c.id;
        return `<div class="mrow"><div class="sw" style="background:var(--t-${i%6})"></div><div class="info">${S.confirm==='cren:'+c.id?`<div class="form" style="flex-direction:row;gap:6px"><label for="cRen" class="sr">ชื่อหมวดหมู่</label><input id="cRen" value="${esc(c.name)}" maxlength="40"><button class="btn sm primary" data-act="catrensave" data-id="${esc(c.id)}">บันทึก</button></div>`:`<b>${esc(c.name)}</b><small>${n} เมนู</small>`}</div>
          ${ro?'':`<button class="btn sm icon" data-act="catmove" data-id="${esc(c.id)}" data-d="-1" aria-label="เลื่อนขึ้น"${i?'':' disabled'}>${ic('up',18)}</button><button class="btn sm icon" data-act="catmove" data-id="${esc(c.id)}" data-d="1" aria-label="เลื่อนลง"${i<S.cats.length-1?'':' disabled'}>${ic('down',18)}</button><button class="btn sm" data-act="catren" data-id="${esc(c.id)}">เปลี่ยนชื่อ</button>`+
          (del?`<button class="btn sm danger" data-act="catdel" data-id="${esc(c.id)}">ยืนยันลบ</button><button class="btn sm" data-act="unconfirm">ไม่ลบ</button>`:`<button class="btn sm" data-act="askcatdel" data-id="${esc(c.id)}"${n?' disabled title="ย้ายเมนูออกก่อน"':''}>ลบ</button>`)}</div>`}).join(''):'<div class="empty">ยังไม่มีหมวดหมู่</div>');
  }else if(tab==='opts'){
    body=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>ตัวเลือก</h2>${ro?'':'<button class="btn primary" data-act="editopt" data-id="">'+ic('plus',18)+'สร้างตัวเลือกใหม่</button>'}</div><span class="hint">กลุ่มตัวเลือก เช่น ระดับความหวาน หรือขนาดแก้ว ผูกกับเมนูได้หลายเมนู ปิดช้อยส์ที่หมดได้</span>`+
      (S.opts.length?S.opts.map(o=>{const used=S.menu.filter(m=>(m.optionIds||[]).includes(o.id)).length;
        return `<div class="mrow"><div class="info"><b>${esc(o.name)}</b> ${o.required?'<span class="pill warn">จำเป็นต้องเลือก</span>':'<span class="pill">ไม่บังคับ</span>'} <span class="pill">เลือกได้ ${o.max||1}</span><small>${(o.choices||[]).map(c=>esc(c.name)+(c.price?' +'+c.price:'')+(c.soldOut?' (หมด)':'')).join(' · ')} · ใช้กับ ${used} เมนู</small></div>${ro?'':`<button class="btn sm" data-act="editopt" data-id="${esc(o.id)}">แก้ไข</button>`}</div>`}).join(''):'<div class="empty">ยังไม่มีตัวเลือก</div>');
  }else{
    body=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>โปรโมชั่น</h2>${ro?'':'<button class="btn primary" data-act="editpromo" data-id="">'+ic('plus',18)+'เพิ่มโปรโมชัน</button>'}</div><span class="hint">ลดท้ายบิล ใช้กับทั้งบิล · ลดรายเมนู ใช้กับรายการที่เลือกในบิล</span>`+
      (S.promos.length?S.promos.map(p=>`<div class="mrow"><div class="sw" style="background:var(--accent-soft);color:var(--accent-soft-ink)">${ic('tag',18)}</div><div class="info"><b>${esc(p.name)}</b><small>${p.scope==='bill'?'ลดท้ายบิล':'ลดรายเมนู'} · ${p.type==='percent'?p.value+'%':baht(p.value)}</small></div>
        ${ro?'':`<button class="chip" data-act="promoactive" data-id="${esc(p.id)}" aria-pressed="${!!p.active}" style="height:36px">${p.active?'เปิดใช้':'ปิดอยู่'}</button><button class="btn sm" data-act="editpromo" data-id="${esc(p.id)}">แก้ไข</button>`}</div>`).join(''):'<div class="empty">ยังไม่มีโปรโมชั่น</div>');
  }
  return `<div class="settings"><nav class="subnav" aria-label="เมนูและโปรโมชั่น">${tabs.map(([v,l])=>`<button data-act="mtab" data-v="${v}" aria-current="${tab===v}">${l}</button>`).join('')}</nav><section class="panel">${ro?'<div class="note">บัญชีนี้ดูได้อย่างเดียว เจ้าของร้านหรือผู้มีสิทธิ์แก้ไขเท่านั้นที่แก้เมนูได้</div>':''}${body}</section></div>`;
}

/* ===== settings ===== */
function settingsView(){
  const sh=shop();const tab=S.stab;const ro=!S.canEdit;const dis=ro?' disabled':'';
  const tabs=[['devices','อุปกรณ์และการรับเงิน'],['app','แอปลูกค้า (QR สั่ง)'],['printer','เครื่องพิมพ์ใบเสร็จ'],['kprinter','เครื่องพิมพ์ครัว'],['stations','สถานีครัว/บาร์'],['drawer','ลิ้นชักเก็บเงิน'],['banks','บัญชีรับโอนเงิน'],['qrs','QR รับชำระเงิน'],['shop','ข้อมูลร้าน'],['payment','การชำระเงิน'],['round','รอบการขาย'],['receipt','รูปแบบใบเสร็จ'],['queue','จัดการคิว'],['tables','จัดการโต๊ะ'],['display','จอแสดงผลด้านหลัง']];
  let body='';
  const save=`<button class="btn primary" type="submit"${dis}>บันทึก</button>`;
  if(tab==='shop')body=`<h2>ข้อมูลร้าน</h2><form class="form" data-stab="shop"><label for="s_name">ชื่อร้าน<input id="s_name" maxlength="60" value="${esc(sh.name)}"${dis}></label><label for="s_branch">สาขา<input id="s_branch" maxlength="60" value="${esc(sh.branch)}"${dis}></label><label for="s_address">ที่อยู่<input id="s_address" maxlength="160" value="${esc(sh.address)}"${dis}></label><div class="two"><label for="s_phone">เบอร์โทร<input id="s_phone" maxlength="20" value="${esc(sh.phone)}"${dis}></label><label for="s_taxId">เลขประจำตัวผู้เสียภาษี<input id="s_taxId" inputmode="numeric" maxlength="17" value="${esc(sh.taxId)}"${dis}></label></div>${save}</form>`;
  else if(tab==='payment')body=`<h2>การชำระเงิน</h2><form class="form" data-stab="payment"><label for="s_vatMode">ภาษีมูลค่าเพิ่ม (VAT 7%)<select id="s_vatMode"${dis}><option value="none"${sh.vatMode==='none'?' selected':''}>ไม่คิด VAT</option><option value="included"${sh.vatMode==='included'?' selected':''}>รวมในราคาอาหารแล้ว</option><option value="excluded"${sh.vatMode==='excluded'?' selected':''}>คิดเพิ่มจากราคาอาหาร</option></select></label>
    <label class="check" for="s_scOn"><input id="s_scOn" type="checkbox"${sh.scOn?' checked':''}${dis}> เก็บ Service charge (คิดเพิ่มจากราคาอาหาร)</label><label for="s_scRate">Service charge (%)<input id="s_scRate" type="number" min="0" max="30" step="0.5" value="${esc(sh.scRate)}"${dis}></label>
    <label for="s_rounding">การปัดเศษยอดชำระ<select id="s_rounding"${dis}>${[['none','ไม่ปัดเศษ'],['down','ปัดลงเป็นบาท'],['nearest','ปัดใกล้สุดเป็นบาท'],['up','ปัดขึ้นเป็นบาท']].map(([v,l])=>`<option value="${v}"${sh.rounding===v?' selected':''}>${l}</option>`).join('')}</select></label>
    <span class="hint">QR พร้อมเพย์และบัญชีรับโอนตั้งค่าได้ที่ “QR รับชำระเงิน” และ “บัญชีรับโอนเงิน”</span>${save}</form>`;
  else if(tab==='round')body=`<h2>รอบการขาย</h2><form class="form" data-stab="round"><label class="check" for="s_roundOn"><input id="s_roundOn" type="checkbox"${sh.roundOn?' checked':''}${dis}> เปิดรอบการขาย (ถาดเก็บเงิน) ก่อนเริ่มขาย</label><label for="s_roundStart">จำนวนเงินเริ่มต้น (ไม่บังคับ)<input id="s_roundStart" type="number" min="0" value="${esc(sh.roundStart||'')}"${dis}></label><span class="hint">เมื่อเปิดใช้ ต้องเปิดรอบก่อนรับชำระ และปิดรอบพร้อมนับเงินเพื่อดูส่วนต่าง</span>${save}</form>`;
  else if(tab==='receipt')body=`<h2>รูปแบบใบเสร็จ</h2><form class="form" data-stab="receipt"><label for="s_footer">ข้อความท้ายใบเสร็จ<input id="s_footer" maxlength="80" placeholder="ขอบคุณที่อุดหนุน" value="${esc(sh.footer)}"${dis}></label><span class="hint">ชื่อร้าน ที่อยู่ เบอร์โทร และเลขผู้เสียภาษีมาจาก “ข้อมูลร้าน” · หัวใบเสร็จเปลี่ยนเป็นใบกำกับภาษีอย่างย่อเมื่อคิด VAT</span>${save}</form>
    <div class="paper${PR.paper==='58'?' p58':''}" style="max-width:360px">${receiptBody({no:'A-001',type:'dine',items:[{name:'ลาเต้',opts:'เย็น · กลาง',unit:80,qty:1},{name:'ครัวซองต์เนยสด',opts:'',unit:75,qty:1}],sums:calc([{unit:80,qty:1},{unit:75,qty:1}],null),method:'cash',received:200,change:200-calc([{unit:80,qty:1},{unit:75,qty:1}],null).total,createdAt:Date.now(),paidAt:Date.now(),rno:'R'+ymd(Date.now())+'-0001'},'receipt')}</div>`;
  else if(tab==='devices'){
    const q=defQr(),bk=defBank(),dr=PR.drawer||{};
    const card=(t,sub,btn,v)=>`<div class="dcard"><div class="dcard-h"><h3>${t}</h3><button class="btn sm primary" data-act="stab" data-v="${v}">${btn}</button></div><p>${sub}</p></div>`;
    body=`<h2>อุปกรณ์และการรับเงิน</h2><div class="dcards">`+
      card('แอปลูกค้า (สแกน QR สั่ง)',`${sh.appOpen?'เปิดรับออเดอร์':'ปิดรับออเดอร์'} · ${PR.bridge?'เครื่องนี้เป็นตัวรับออเดอร์':'เครื่องนี้ไม่ได้รับออเดอร์จากแอป'}`,'ตั้งค่า / QR','app')+
      card('เครื่องพิมพ์ใบเสร็จ',`${esc(PR.model||'ยังไม่ระบุรุ่น')} (${PR.paper}mm) · ผ่านไดรเวอร์ (บันทึกไฟล์แล้วสั่งพิมพ์) · ${PR.auto?'พิมพ์อัตโนมัติหลังชำระ':'กดพิมพ์เอง'}`,'ตั้งค่า / ทดสอบ','printer')+
      card('ลิ้นชักเก็บเงิน',dr.on?`สาย RJ11 ต่อที่เครื่องพิมพ์ · เปิดอัตโนมัติ: ${DWHEN[dr.when]||''} · ขา ${esc(dr.pin)}`:'ยังไม่เปิดใช้งาน','ตั้งค่า / ทดสอบ','drawer')+
      card('เครื่องพิมพ์ครัว',(()=>{const on=stations().filter(x=>kprintOn(x.id)).map(x=>esc(x.name));return on.length?`${esc(PR.kmodel||'ไม่ระบุรุ่น')} · พิมพ์ใบสั่ง ${on.join(', ')} · ${PR.kmode==='arrive'?'เมื่อออเดอร์เข้าจอครัว':'เมื่อส่งออเดอร์จากเครื่องนี้'}`:'เครื่องนี้ไม่พิมพ์ใบสั่งครัว'})(),'ตั้งค่า / ทดสอบ','kprinter')+
      card('จอครัว (KDS)',`${stations().length} สถานี: ${stations().map(x=>esc(x.name)).join(', ')} · เปิดเมนู “จอครัว” บนแท็บเล็ตในครัวหรือบาร์`,'ตั้งค่าสถานี','stations')+
      card('บัญชีรับโอนเงิน',bk?`${esc(bankShort(bk.bank))} ${esc(bk.no)} · ${bk.display?'แสดงบนจอลูกค้าเมื่อเลือกโอนเงิน':'ไม่แสดงบนจอลูกค้า'}${bankList().length>1?' · ทั้งหมด '+bankList().length+' บัญชี':''}`:'ยังไม่มีบัญชี','จัดการบัญชี','banks')+
      card('QR รับชำระเงิน',q?`${esc(q.name)} · ตั้งค่าเริ่มต้นแยกได้${qrList().length>1?' · ทั้งหมด '+qrList().length+' QR':''}`:'ยังไม่ได้ตั้งค่า','จัดการ QR','qrs')+`</div><span class="hint">เครื่องพิมพ์และลิ้นชักตั้งค่าแยกแต่ละเครื่อง · บัญชีและ QR ใช้ร่วมกันทุกเครื่อง</span>`;
  }
  else if(tab==='printer')body=`<h2>เครื่องพิมพ์ใบเสร็จ</h2><span class="hint">ตั้งค่าเฉพาะเครื่องนี้</span><div class="form">
    <label for="p_model">รุ่นเครื่องพิมพ์<input id="p_model" list="pmodels" maxlength="40" placeholder="เช่น BARIGAN PR-01W" value="${esc(PR.model)}"></label><datalist id="pmodels"><option value="BARIGAN PR-01W"></option><option value="Xprinter XP-Q80"></option><option value="Epson TM-T82X"></option><option value="Gprinter GP-L80250"></option><option value="Sunmi (เครื่องพิมพ์ในตัว)"></option></datalist>
    <div class="three"><label for="p_paper">ขนาดกระดาษ<select id="p_paper"><option value="80"${PR.paper==='80'?' selected':''}>80 มม.</option><option value="58"${PR.paper==='58'?' selected':''}>58 มม.</option></select></label>
    <label for="p_conn">การเชื่อมต่อ<select id="p_conn"><option>ผ่านไดรเวอร์ (บันทึกไฟล์แล้วสั่งพิมพ์)</option></select></label>
    <label for="p_copies">จำนวนสำเนาใบเสร็จ<input id="p_copies" type="number" min="1" max="3" value="${esc(PR.copies||1)}"></label></div>
    <label class="check" for="p_auto"><input id="p_auto" type="checkbox"${PR.auto?' checked':''}> พิมพ์ใบเสร็จทันทีหลังชำระเงิน</label><span class="hint">ใบสั่งครัว/บาร์ตั้งค่าที่ “เครื่องพิมพ์ครัว”</span>
    <button class="btn primary" data-act="testprint" type="button" style="align-self:flex-start">${ic('print',18)}ทดสอบพิมพ์</button>
    <div class="note">วิธีตั้งค่า: 1) ติดตั้งไดรเวอร์ของเครื่องพิมพ์บนเครื่องนี้ 2) ตั้งเป็นเครื่องพิมพ์ค่าเริ่มต้น 3) ตอนพิมพ์ครั้งแรก เลือกขนาดกระดาษ ${PR.paper} มม. ระยะขอบ “ไม่มี” และปิด “หัวกระดาษและท้ายกระดาษ” หน้าเว็บส่งคำสั่งตรงถึงเครื่องพิมพ์ไม่ได้ จึงต้องเปิดไฟล์ที่บันทึกเพื่อพิมพ์</div></div>`;
  else if(tab==='app'){const url=appBase();const tb=S.tables.filter(isTable);
    body=`<h2>แอปลูกค้า (สแกน QR สั่งอาหาร)</h2><div id="appStatus">${appStatusHtml()}</div>
    <form class="form" data-stab="app"><label class="check" for="s_appOpen"><input id="s_appOpen" type="checkbox"${sh.appOpen?' checked':''}${dis}> เปิดรับออเดอร์จากแอป</label>
      <label class="check" for="s_appTake"><input id="s_appTake" type="checkbox"${sh.appTake!==false?' checked':''}${dis}> รับสั่งกลับบ้านผ่านแอป</label>
      <label for="s_appUrl">ลิงก์หน้าเว็บสั่งอาหาร<input id="s_appUrl" type="url" value="${esc(url)}"${dis}></label>${save}</form>
    <div class="form"><label class="check" for="pr_bridge"><input id="pr_bridge" type="checkbox"${PR.bridge?' checked':''}> เครื่องนี้เป็นตัวรับออเดอร์จากแอปเข้าระบบ</label>
      <span class="hint">เปิดบนเครื่องแคชเชียร์ 1 เครื่องที่เปิดหน้า POS ค้างไว้ บัญชีบนเครื่องนั้นต้องเชื่อม Supabase ไว้ ระบบจะส่งเมนูขึ้นแอป ดึงออเดอร์ใหม่ทุก 10 วินาที และส่งสถานะกลับให้ลูกค้าเห็น</span>
      ${PR.bridge?'<button class="btn" type="button" data-act="appsync" style="align-self:flex-start">ซิงก์ตอนนี้</button>':''}</div>
    <h3>QR สำหรับลูกค้า</h3><div class="qrgrid">${sh.appTake!==false?`<div class="qrc"><div class="qrwrap"><div data-qr="${esc(url+'?type=take')}"></div></div><b>สั่งกลับบ้าน</b><a href="${esc(url+'?type=take')}" target="_blank" rel="noopener">${esc(url+'?type=take')}</a></div>`:''}${tb.map(t=>{const l=url+'?t='+encodeURIComponent(t.id);return `<div class="qrc"><div class="qrwrap"><div data-qr="${esc(l)}"></div></div><b>โต๊ะ ${esc(t.name)}</b><span class="hint">${esc(t.zone||'')}</span></div>`}).join('')}</div>

  else if(d.bank&&d.total)side=`<div style="font-weight:600">โอนเงินเข้าบัญชี</div><div class="bankcard"><span style="font-size:13px;color:#666">${esc(d.bank.bank)}</span><span class="no">${esc(d.bank.no)}</span><span>${esc(d.bank.name)}</span></div><div class="num" style="font-size:28px;font-weight:600">${baht(d.total)}</div>`;
  else if(d.qr&&d.total)side=`<div style="font-weight:600">สแกนจ่ายด้วยแอปธนาคาร</div><div class="qrwrap"><div id="dispQr"></div></div><div class="num" style="font-size:28px;font-weight:600">${baht(d.total)}</div>`;
  else side=`<div style="font-size:22px;font-weight:700">${esc(shop().name)}</div><div style="opacity:.9">${esc(shop().idleText||'ยินดีต้อนรับ')}</div>`;
  return `<div class="disp"><section class="disp-main"><h1>${lines.length?'รายการของคุณ':'ยินดีต้อนรับ'}</h1><div class="disp-list">${lines.length?lines.map(l=>`<div class="line" style="border-bottom:1px solid var(--line)"><span class="q">${l.qty}</span><span class="info"><span class="nm" style="font-size:18px">${esc(l.name)}</span><span class="op" style="display:block">${esc(l.opts||'')}</span></span><span class="amt" style="font-size:18px">${baht(l.total)}</span></div>`).join(''):'<div class="empty"><b>พร้อมรับออเดอร์</b>เปิดหน้านี้บนแท็บเล็ตที่หันให้ลูกค้า</div>'}</div>

function localDisplay(){const t=calc(S.bill.items,S.bill.promo);return {lines:S.bill.items.map(l=>({name:l.name,opts:l.opts,qty:l.qty,total:r2(l.unit*l.qty-lineDisc(l))})),disc:t.disc,total:t.total,qr:!!(S.ov&&S.ov.k==='pay'&&S.ov.tab==='qr'),qrPP:(S.ov&&S.ov.k==='pay'&&S.ov.tab==='qr')?((qrList().find(x=>x.id===S.ov.qrId)||defQr()||{}).pp||''):'',bank:dispBank(),done:S.done}}
function dispBank(){if(!(S.ov&&S.ov.k==='pay'&&S.ov.tab==='wallet'))return null;const b=bankList().find(x=>x.id===S.ov.bankId)||defBank();return b&&b.display?{bank:bankName(b.bank),no:b.no,name:b.name||''}:null}
let syncT=null;
function syncDisplay(){

function ovHtml(){
  const v=S.ov;if(!v)return '';
  const wrap=(inner,cls,scrim)=>`<div class="scrim"${scrim===false?'':' data-act="scrim"'}><div class="dialog ${cls||''}" role="dialog" aria-modal="true" aria-labelledby="dlgT">${inner}</div></div>`;
  const head=(t)=>`<div class="dlg-head"><h2 id="dlgT">${t}</h2><button class="btn icon" data-act="close" aria-label="ปิด">${ic('x')}</button></div>`;
  if(v.k==='item'){
    const m=S.menu.find(x=>x.id===v.id);if(!m)return '';
    const groups=(m.optionIds||[]).map(id=>S.opts.find(o=>o.id===id)).filter(Boolean);
    let price=priceFor(m,S.bill.type);let ok=true;
    const gh=groups.map(g=>{const sel=(v.sel[g.id]||[]).filter(cid=>(g.choices||[]).some(c=>c.id===cid&&!c.soldOut));v.sel[g.id]=sel;if(g.required&&!sel.length)ok=false;sel.forEach(cid=>{const c=(g.choices||[]).find(x=>x.id===cid);if(c)price+=+c.price||0});
      return `<div class="grp"><div class="grp-t">${esc(g.name)} ${g.required?'<span class="pill warn">จำเป็น</span>':''}${(g.max||1)>1?`<span class="pill">เลือกได้ไม่เกิน ${g.max}</span>`:''}${S.canEdit?`<button class="btn sm" data-act="editopt" data-id="${esc(g.id)}" data-back="1" style="margin-left:auto;height:30px;font-size:13px">แก้ไขช้อยส์/ราคา</button>`:''}</div><div class="opts">${(g.choices||[]).map(c=>`<button class="opt" data-act="choice" data-g="${esc(g.id)}" data-c="${esc(c.id)}" aria-pressed="${sel.includes(c.id)}"${c.soldOut?' disabled':''}>${esc(c.name)}${c.soldOut?' <small>หมด</small>':c.price?` <small>+${c.price}</small>`:''}</button>`).join('')}</div></div>`}).join('');
    return wrap(head(esc(m.name))+`<div class="muted" style="margin-top:-10px">${esc(m.en||'')} · ${baht(priceFor(m,S.bill.type))}</div>${gh}
      <div class="grp"><label for="itNote" class="grp-t">หมายเหตุ</label><input id="itNote" class="search" style="height:44px" maxlength="60" placeholder="เช่น น้ำแข็งน้อย" value="${esc(v.note||'')}"></div>
      <div class="dlg-actions" style="align-items:center"><div class="stepper"><button data-act="itqty" data-d="-1" aria-label="ลดจำนวน">−</button><span>${v.qty}</span><button data-act="itqty" data-d="1" aria-label="เพิ่มจำนวน">+</button></div>

  }
  if(v.k==='line'){
    const l=S.bill.items.find(x=>x.key===v.key);if(!l)return '';

      <div class="grp"><span class="grp-t">จำนวน</span><div class="stepper"><button data-act="lqty" data-d="-1" aria-label="ลดจำนวน"${lock||l.qty<=1?' disabled':''}>−</button><span>${l.qty}</span><button data-act="lqty" data-d="1" aria-label="เพิ่มจำนวน"${lock?' disabled':''}>+</button></div></div>
      <div class="grp"><span class="grp-t">ลดรายเมนู</span><div class="opts"><button class="opt" data-act="ldisc" data-id="" aria-pressed="${!l.disc}">ไม่มีส่วนลด</button>${ip.map(p=>`<button class="opt" data-act="ldisc" data-id="${esc(p.id)}" aria-pressed="${!!l.disc&&l.disc.id===p.id}">${esc(p.name)}</button>`).join('')}</div>${ip.length?'':'<span class="hint">ยังไม่มีโปรโมชันแบบลดรายเมนู สร้างได้ที่ เมนูและโปรโมชั่น</span>'}</div>
      <div class="dlg-actions"><button class="btn danger" data-act="ldel"${lock?' disabled':''}>ลบเมนู</button><button class="btn primary grow" data-act="close">เสร็จ</button></div>`,'narrow');
  }
  if(v.k==='promo'){
    const bp=S.promos.filter(p=>p.active&&p.scope==='bill');
    return wrap(head('โปรโมชัน')+`<div class="grp"><span class="grp-t">ลดท้ายบิล</span><div class="opts"><button class="opt" data-act="setpromo" data-id="" aria-pressed="${!S.bill.promo}">ไม่ใช้โปรโมชัน</button>${bp.map(p=>`<button class="opt" data-act="setpromo" data-id="${esc(p.id)}" aria-pressed="${!!S.bill.promo&&S.bill.promo.id===p.id}">${esc(p.name)}</button>`).join('')}</div></div><span class="hint">ลดรายเมนู: แตะรายการในบิลแล้วเลือกส่วนลด</span>`,'narrow');
  }

function renderOverlay(force){
  const el=$('#overlay');const ae=document.activeElement;
  if(!force&&S.ov&&ae&&el.contains(ae)&&['INPUT','SELECT','TEXTAREA'].includes(ae.tagName))return;
  el.innerHTML=ovHtml();
  if(S.ov&&S.ov.k==='pay'&&S.ov.tab==='qr'){const q=qrList().find(x=>x.id===S.ov.qrId)||defQr();if(q)drawQr(document.getElementById('payQr'),calc(S.bill.items,S.bill.promo).total,220,q.pp)}
  if(S.ov&&S.ov.k==='qrtest'){const q=qrList().find(x=>x.id===S.ov.id);if(q)drawQr(document.getElementById('testQr'),1,220,q.pp)}
  const f=el.querySelector('#doneBtn')||el.querySelector('.dialog input:not([type=checkbox])');if(f&&S.ov&&S.ov.focus!==false){f.focus();S.ov.focus=false}
}

function dq(x){let t;do{t='q'+Math.random().toString(36).slice(2,8)}while(x.includes('$'+t+'$'));return '$'+t+'$'+x+'$'+t+'$'}
function mcpMsg(e){const c=e&&e.code;
  if(c==='server_not_connected'||c==='selection_required')return 'บัญชีนี้ยังไม่ได้เชื่อม Supabase เพิ่มได้ที่ claude.ai › Settings › Connectors';
  if(c==='needs_reauth')return 'การเชื่อม Supabase หมดอายุ เชื่อมใหม่ที่ claude.ai › Settings › Connectors';
  if(c==='not_in_manifest'||c==='not_granted'||c==='capability_disabled')return 'ยังไม่ได้อนุญาตให้หน้านี้ใช้ Supabase เปิดหน้านี้ใหม่แล้วกดอนุญาต';
  if(c==='blocked_by_policy'||c==='approval_required')return 'องค์กรไม่อนุญาตให้ใช้ Supabase จากหน้านี้';
  if(c==='server_unavailable')return 'Supabase ไม่ตอบสนอง จะลองใหม่อัตโนมัติ';
  if(c==='tool_error')return 'คำสั่งฐานข้อมูลผิดพลาด: '+String(e.message||'').slice(0,120);
  return 'เชื่อมต่อไม่สำเร็จ ('+(c||'unknown')+') จะลองใหม่อัตโนมัติ'}
async function sql(q){return S.mcp.callTool('Supabase','execute_sql',{project_id:SB_PROJECT,query:q},{cache:false})}
function b64Rows(r){
  let p=r&&r.payload;if(typeof p==='string'&&p.trim().charAt(0)==='{'){try{p=JSON.parse(p)}catch(e){}}let txt=typeof p==='string'?p:(p&&typeof p.result==='string'?p.result:'');
  if(!txt&&r&&r.content)txt=r.content.map(c=>c.text||'').join('');
  const m=txt.match(/"b"\s*:\s*"([A-Za-z0-9+\/=]*)"/);if(!m)return null;
  const bin=atob(m[1]);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  try{return JSON.parse(new TextDecoder().decode(bytes))}catch(e){return null}}
function appSnapshot(){const sh=shop();return {menu:{menu:S.menu.map(m=>({id:m.id,name:m.name,en:m.en||'',price:+m.price||0,catId:menuCat(m),optionIds:(m.optionIds||[]).filter(id=>S.opts.some(o=>o.id===id)),soldOut:!!m.soldOut,best:!!m.best})),
  cats:S.cats.map(c=>({id:c.id,name:c.name})),options:S.opts.map(o=>({id:o.id,name:o.name,required:!!o.required,max:o.max||1,choices:(o.choices||[]).map(c=>({id:c.id,name:c.name,price:+c.price||0,soldOut:!!c.soldOut}))})),
  tables:S.tables.filter(isTable).map(t=>({id:t.id,name:t.name,zone:t.zone||''}))},shop:{name:sh.name,branch:sh.branch||'',open:!!sh.appOpen,takeaway:sh.appTake!==false}}}
const ARANK={accepted:1,making:2,ready:3,done:4,cancelled:9};
function appStatuses(){const out=[];allOrders().forEach(o=>{const ids=(o.appIds||[]).filter(x=>UUIDRE.test(x));if(!ids.length)return;
  const k=overallK(o);const st=o.state==='void'?'cancelled':k==='done'?'done':k==='ready'?'ready':k==='making'?'making':'accepted';
  ids.forEach(a=>{const prev=pushed[a];if(prev===st)return;if(prev&&ARANK[st]<ARANK[prev]&&st!=='cancelled')return;out.push([a,st])})});return out}
async function importAppOrder(ao){
  if(!UUIDRE.test(String(ao.id)))return null;
  const ex=allOrders().find(o=>(o.appIds||[]).includes(ao.id));if(ex)return {id:ex.id,no:ex.no};
  const now=Date.now();
  const items=(Array.isArray(ao.items)?ao.items:[]).map(i=>({menuId:String(i.id||''),name:String(i.name||'').slice(0,80),choices:[],opts:String(i.opts||'').slice(0,200),note:'',unit:+i.unit||0,qty:Math.min(20,Math.max(1,+i.qty||1)),st:stationOfMenu(String(i.id||''))}));
  if(!items.length)return null;
  const tb=ao.type==='dine'&&ao.table_id?S.tables.find(t=>t.id===ao.table_id):null;
  const bill=tb?tableBill(tb.id):null;
  if(bill){const batch=(bill.batch||0)+1;const nitems=bill.items.map(x=>{const y=Object.assign({},x);delete y.key;return y}).concat(items.map(i=>Object.assign({},i,{batch})));
    const kst=Object.assign({},bill.kst||{});items.forEach(i=>{kst[i.st]='waiting'});
    const patch={items:nitems,batch,kst,kitchen:overallK({items:nitems,kst}),batchAt:now,updatedAt:now,sums:calc(nitems,bill.promo),appIds:(bill.appIds||[]).concat([ao.id])};
    if(ao.phone&&!bill.member)patch.member=String(ao.phone);
    await S.db.doc('orders/'+bill.id).update(patch);Object.assign(bill,patch);return {id:bill.id,no:bill.no,where:'โต๊ะ '+tb.name}}
  const id='app-'+ao.id;const its=items.map(i=>Object.assign({},i,{batch:1}));const kst={};its.forEach(i=>{kst[i.st]='waiting'});
  const doc={no:nextNo(),createdAt:now,day:dayKey(now),updatedAt:now,batchAt:now,state:'open',type:ao.type==='take'?'take':'dine',table:tb?{id:tb.id,name:tb.name}:null,guests:0,items:its,promo:null,
    member:ao.phone?String(ao.phone):'',batch:1,kst,kitchen:overallK({items:its,kst}),sums:calc(its,null),source:'app',appIds:[ao.id],custName:ao.customer_name?String(ao.customer_name).slice(0,60):''};
  await S.db.doc('orders/'+id).set(doc);const full=norm(Object.assign({id},doc));S.oToday[id]=full;S.oOpen[id]=full;
  return {id,no:doc.no,where:tb?'โต๊ะ '+tb.name:'กลับบ้าน'+(doc.custName?' · '+doc.custName:'')}}
function scheduleBridge(ms){clearTimeout(bridgeT);bridgeT=null;if(PR.bridge&&S.mode==='live')bridgeT=setTimeout(bridgeTick,ms)}
async function bridgeTick(){
  bridgeT=null;if(!PR.bridge||!S.db||S.mode!=='live')return;
  if(shop().movedTo){S.app.state='other';S.app.msg='ย้ายไปใช้ POS บนเว็บแล้ว ออเดอร์จากแอปจะเข้าที่ '+shop().movedTo;renderAppStatus();return}
  if(!S.mcp){S.app.state='err';S.app.msg='หน้านี้เชื่อม Supabase ไม่ได้บนอุปกรณ์นี้';renderAppStatus();scheduleBridge(60000);return}
  let wait=10000;
  try{
    const lease=await S.db.doc('bridge/lock').acquire({holder:deviceId,ttlMs:30000});
    if(!lease.acquired){S.app.state='other';S.app.msg='มีเครื่องอื่นเป็นตัวรับออเดอร์จากแอปอยู่';renderAppStatus();scheduleBridge(20000);return}
    let q='';const snap=JSON.stringify(appSnapshot());const sendSnap=snap!==lastSnap&&S.menu.length;
    if(sendSnap){const o=JSON.parse(snap);q+=`insert into cafe.state(key,data,updated_at) values ('menu',${dq(JSON.stringify(o.menu))}::jsonb,now()),('shop',${dq(JSON.stringify(o.shop))}::jsonb,now()) on conflict (key) do update set data=excluded.data, updated_at=now();\n`}
    const vals=appStatuses();
    if(vals.length)q+=`update cafe.orders c set status=v.s, updated_at=now() from (values ${vals.map(([a,st])=>`('${a}','${st}')`).join(',')}) as v(id,s) where c.id=v.id::uuid and c.status<>v.s and c.status not in ('cancelled','rejected');\n`;
    if(q){await sql(q);if(sendSnap)lastSnap=snap;vals.forEach(([a,st])=>{pushed[a]=st})}
    const r=await sql(`select replace(encode(convert_to(coalesce((select json_agg(o order by o.created_at)::text from (select id,created_at,table_id,table_name,type,items,note,customer_name,phone,total from cafe.orders where status='new' order by created_at limit 20) o),'[]'),'utf8'),'base64'),E'\\n','') as b;`);
    const rows=b64Rows(r);if(rows==null)throw {code:'tool_error',message:'อ่านผลลัพธ์ไม่ได้'};
    const acc=[];
    for(const ao of rows){const res=await importAppOrder(ao);if(res)acc.push([ao.id,res])}
    if(acc.length){
      await sql(acc.map(([a,res])=>`update cafe.orders set status='accepted', pos_id=${dq(res.id)}, pos_no=${dq(res.no)}, updated_at=now() where id='${a}' and status='new';`).join('\n'));
      acc.forEach(([a])=>{pushed[a]='accepted'});S.app.count+=acc.length;
      toast('ออเดอร์ใหม่จากแอป: '+acc.map(([,res])=>res.where).join(', '));if(S.sound)beep();
      if(acc.length===rows.length&&rows.length===20)wait=1500;
    }
    S.app.state='ok';S.app.msg='';S.app.last=Date.now();
  }catch(e){S.app.state='err';S.app.msg=mcpMsg(e);wait=e&&e.retryAfterMs?Math.max(10000,e.retryAfterMs):(e&&['server_not_connected','needs_reauth','not_in_manifest','not_granted','blocked_by_policy'].includes(e.code)?60000:15000)}
  renderAppStatus();renderTop();scheduleBridge(wait);
}

async function saveShop(patch,msg){const next=Object.assign({},S.shop,patch);delete next.vatReg;
  if(S.db){const ok=await dbDo(db=>db.doc('settings/shop').set(next),msg);if(!ok)return false}else toast((msg||'บันทึกแล้ว')+' (โหมดทดลอง)');
  S.shop=next;render(true);return true}
function setBill(){renderBill();syncDisplay()}
async function hold(){
  if(!S.bill.items.length&&!S.bill.id)return;
  const wasNew=!S.bill.id;const o=await commitBill(null);if(!o)return;
  sendTickets(o);
  toast((wasNew?'ส่งค้างไว้แล้ว ':'บันทึกแล้ว ')+(o.table?'โต๊ะ '+o.table.name:o.no));
  S.bill=newBill();S.sheet=false;render();syncDisplay();
}
async function payNow(){
  const v=S.ov;const t=calc(S.bill.items,S.bill.promo);
  const received=v.tab==='cash'?r2(parseFloat(v.cash||'0')||0):t.total;
  if(received<t.total)return;
  S.busy=true;renderOverlay();
  const o=await commitBill({method:v.tab,received,change:r2(received-t.total)});
  S.busy=false;
  if(!o){renderOverlay();return}
  S.done={no:o.no,at:Date.now()};S.docState={kind:'receipt',taxForm:false};
  S.ov={k:'paid',id:o.id,order:o};S.bill=newBill();S.sheet=false;
  render();syncDisplay();
  if(PR.auto)printDoc(o,'receipt');
  sendTickets(o);
  drawerAfterPay(o);
}
async function openTable(t,guests){
  if(tableBill(t.id)){toast('โต๊ะนี้มีลูกค้าแล้ว');return}
  S.bill=newBill();S.bill.table={id:t.id,name:t.name};S.bill.guests=guests;S.bill.type='dine';
  S.busy=true;renderOverlay();const o=await commitBill(null);S.busy=false;

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset;
  if(a==='scrim'&&e.target!==b)return;
  switch(a){
    case 'view':go(d.v);break;
    case 'gosettings':S.stab=d.v;go('settings');break;
    case 'gofloor':S.floorEdit=true;go('tables');break;
    case 'close':case 'scrim':if(S.ov&&S.ov.k==='paid')return;if(S.ov&&S.ov.back){S.ov=Object.assign(S.ov.back,{focus:false});S.confirm=null;renderOverlay(true);break}if(S.ov&&S.ov.k==='editmenu'&&S.ov.img&&S.assets){const m=S.menu.find(x=>x.id===S.ov.id)||{};if(S.ov.img!==m.imgId)S.assets.delete(S.ov.img).catch(()=>{})}S.ov=null;S.confirm=null;renderOverlay();syncDisplay();break;

    case 'sheet':S.sheet=!S.sheet;renderBill();break;

      if(hasOptions(m)){const sel={};(m.optionIds||[]).forEach(id=>{const g=S.opts.find(o=>o.id===id);if(g&&g.required&&(g.max||1)===1){const c=(g.choices||[]).find(c=>!c.soldOut);if(c)sel[g.id]=[c.id]}});S.ov={k:'item',id:m.id,sel,qty:1,note:'',focus:false};renderOverlay()}
      else{addLine(m,[],1,'');renderBill();toast('เพิ่ม '+m.name)}break;}
    case 'choice':{const v=S.ov,g=S.opts.find(o=>o.id===d.g);if(!g)return;const sel=(v.sel[g.id]||[]).slice();const i=sel.indexOf(d.c);const max=g.max||1;
      if(i>=0){if(!(g.required&&max===1))sel.splice(i,1)}else if(max===1)sel.splice(0,sel.length,d.c);else if(sel.length<max)sel.push(d.c);else{toast('เลือกได้ไม่เกิน '+max);return}
      v.sel[g.id]=sel;const n=$('#itNote');if(n)v.note=n.value;v.focus=false;renderOverlay();break;}
    case 'itqty':{const v=S.ov;v.qty=Math.max(1,v.qty+(+d.d));const n=$('#itNote');if(n)v.note=n.value;v.focus=false;renderOverlay();break;}
    case 'additem':{const v=S.ov,m=S.menu.find(x=>x.id===v.id);if(!m)return;const n=$('#itNote');const ch=[];
      (m.optionIds||[]).forEach(id=>{const g=S.opts.find(o=>o.id===id);if(!g)return;(v.sel[g.id]||[]).forEach(cid=>{const c=(g.choices||[]).find(x=>x.id===cid);if(c)ch.push(Object.assign({g:g.id},c))})});
      addLine(m,ch,v.qty,n?n.value:'');S.ov=null;renderOverlay();renderBill();break;}
    case 'line':S.ov={k:'line',key:+d.k,focus:false};renderOverlay();break;
    case 'lqty':{const l=S.bill.items.find(x=>x.key===S.ov.key);if(l){l.qty=Math.max(1,l.qty+(+d.d));S.bill.dirty=true}renderOverlay();setBill();break;}
    case 'ldisc':{const l=S.bill.items.find(x=>x.key===S.ov.key);const p=S.promos.find(x=>x.id===d.id);if(l){l.disc=p?{id:p.id,name:p.name,type:p.type,value:+p.value}:null;S.bill.dirty=true}renderOverlay();setBill();break;}

function readOptDraft(){const v=S.ov;if(!v||!v.draft)return;const n=$('#o_name');if(n)v.draft.name=n.value;const r=$('#o_req');if(r)v.draft.required=r.checked;const m=$('#o_max');if(m)v.draft.max=Math.max(1,parseInt(m.value,10)||1);

async function openRound(amount){
  const rd={openedAt:Date.now(),startCash:+amount||0,state:'open',moves:[]};
  S.busy=true;renderOverlay();
  if(S.db){try{const ref=S.db.collection('rounds').doc();await ref.set(rd);S.round=Object.assign({id:ref.id},rd)}catch(e){S.busy=false;renderOverlay();toast(dbErr(e));return}}
  else S.round=Object.assign({id:'local-r'+Date.now()},rd);
  S.busy=false;S.ov=null;toast('เปิดรอบการขายแล้ว');render(true);
}
async function closeRound(){
  const rd=S.round;if(!rd)return;const st=roundStats(rd);const counted=r2(parseFloat(S.ov.counted)||0);
  const patch={state:'closed',closedAt:Date.now(),counted,expected:st.expected,diff:r2(counted-st.expected),summary:{sales:st.sales,bills:st.bills,voids:st.voids,by:st.by,ins:st.ins,outs:st.outs}};
  S.busy=true;renderOverlay();
  if(S.db){try{await S.db.doc('rounds/'+rd.id).update(patch)}catch(e){S.busy=false;renderOverlay();toast(dbErr(e));return}}
  const closed=Object.assign({},rd,patch);S.round=null;S.busy=false;S.ov=null;
  saveFile(KLABEL.round+'-'+dayKey(closed.openedAt),roundBody(closed));
  toast('ปิดรอบการขายแล้ว');S.rounds=null;loadRounds();render(true);
}

  if(e.key==='Escape'&&S.ov&&S.ov.k!=='paid'){S.ov=null;S.confirm=null;renderOverlay();syncDisplay();return}
  if(!S.floorEdit||!S.sel||S.view!=='tables')return;
  if(['INPUT','SELECT'].includes((document.activeElement||{}).tagName))return;
  const t=S.tables.find(x=>x.id===S.sel);if(!t)return;
  const st=e.shiftKey?50:10;const m={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];if(!m)return;e.preventDefault();
  saveTable(t.id,{x:Math.max(0,Math.min(1200-t.w,t.x+m[0])),y:Math.max(0,Math.min(800-t.h,t.y+m[1]))});renderFloor();
  const n=$('#floor [data-id="'+CSS.escape(t.id)+'"]');n&&n.focus();
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;const id=f.id;
  if(id==='openRoundForm'){const v=parseFloat(($('#rStart')||{}).value)||0;S.ov={k:'openround',amount:v,focus:false};renderOverlay();return}
  if(id==='memberForm'){S.bill.member=($('#mPhone').value||'').replace(/\D/g,'');S.bill.dirty=true;S.ov=null;renderOverlay();setBill();return}
  if(id==='moveForm'){const amt=r2(parseFloat($('#mvAmt').value)||0);if(amt<=0)return;const mv={type:S.ov.type,amount:amt,note:$('#mvNote').value.trim(),at:Date.now()};
    const moves=(S.round.moves||[]).concat([mv]);
    if(S.db){const ok=await dbDo(db=>db.doc('rounds/'+S.round.id).update({moves}),'บันทึกแล้ว');if(!ok)return}
    S.round.moves=moves;S.ov=null;render(true);return}
  if(id==='taxForm'){
    const o=S.ov&&S.ov.k==='paid'?(findOrder(S.ov.id)||S.ov.order):findOrder(S.hist.sel);if(!o)return;
    const taxId=$('#tiTax').value.replace(/\D/g,''),name=$('#tiName').value.trim();
    if(!name){toast('ใส่ชื่อลูกค้า');return}if(taxId.length!==13){toast('เลขประจำตัวผู้เสียภาษีต้องมี 13 หลัก');return}
    const ti={name,taxId,branch:$('#tiBranch').value.trim()||'สำนักงานใหญ่',address:$('#tiAddr').value.trim(),at:Date.now(),no:'INV'+ymd(Date.now())+'-'+pad(allOrders().filter(x=>x.taxInvoice).length+1,3)};
    if(S.db){const ok=await dbDo(db=>db.doc('orders/'+o.id).update({taxInvoice:ti}));if(!ok)return}
    o.taxInvoice=ti;if(S.ov&&S.ov.order)S.ov.order.taxInvoice=ti;
    document.activeElement&&document.activeElement.blur();S.docState.taxForm=false;S.docState.kind='tax';
    if(S.ov)renderOverlay();else render(true);printDoc(o,'tax');return;
  }
  if(id==='menuForm'){
    const name=$('#m_name').value.trim(),cat=$('#m_cat').value,price=parseFloat($('#m_price').value);
    if(!name||!cat||!(price>=0)){toast('ใส่ชื่อเมนู หมวดหมู่ และราคาให้ครบ');return}
    const data={name,en:$('#m_en').value.trim(),catId:cat,price,priceDeli:parseFloat($('#m_deli').value)||0,optionIds:[...f.querySelectorAll('[data-opt]')].filter(x=>x.checked).map(x=>x.dataset.opt),best:$('#m_best').checked};
    const mid=S.ov.id;if(S.ov.uploading){toast('รอให้อัปโหลดรูปเสร็จก่อน');return}
    const oldImg=mid?((S.menu.find(x=>x.id===mid)||{}).imgId||''):'';data.imgId=S.ov.img!==undefined?(S.ov.img||''):oldImg;
    if(S.db){const ok=await dbDo(db=>mid?db.doc('menu/'+mid).update(data):db.collection('menu').add(Object.assign({soldOut:false,sort:S.menu.length},data)),'บันทึกเมนูแล้ว');if(!ok)return}
    else{if(mid)Object.assign(S.menu.find(x=>x.id===mid),data);else S.menu.push(Object.assign({id:'local-m'+Date.now(),soldOut:false,sort:S.menu.length},data));render(true)}
    if(oldImg&&oldImg!==data.imgId&&S.assets)S.assets.delete(oldImg).catch(()=>{});
    S.ov=null;renderOverlay();return;
  }
  if(id==='optForm'){
    readOptDraft();const dr=S.ov.draft;dr.choices=dr.choices.filter(c=>c.name.trim()).map(c=>({id:c.id,name:c.name.trim(),price:+c.price||0,soldOut:!!c.soldOut}));
    if(!dr.name.trim()||!dr.choices.length){toast('ใส่ชื่อตัวเลือกและช้อยส์อย่างน้อย 1 รายการ');return}
    const data={name:dr.name.trim(),required:!!dr.required,max:Math.min(dr.max||1,dr.choices.length),choices:dr.choices};const oid=S.ov.id;
    if(S.db){const ok=await dbDo(db=>oid?db.doc('options/'+oid).set(data):db.collection('options').add(data),'บันทึกตัวเลือกแล้ว');if(!ok)return}
    else{if(oid)Object.assign(S.opts.find(x=>x.id===oid),data);else S.opts.push(Object.assign({id:'local-o'+Date.now()},data));render(true)}
    if(oid&&S.db){const i=S.opts.findIndex(x=>x.id===oid);if(i>=0)S.opts[i]=Object.assign({id:oid},data)}
    const back=S.ov.back;S.ov=back?Object.assign(back,{focus:false}):null;renderOverlay(true);return;
  }
  if(id==='promoForm'){
    const data={name:$('#pr_name').value.trim(),scope:$('#pr_scope').value,type:$('#pr_type').value,value:parseFloat($('#pr_value').value)||0,active:$('#pr_active').checked};
    if(!data.name||data.value<=0){toast('ใส่ชื่อและมูลค่าส่วนลด');return}if(data.type==='percent'&&data.value>100){toast('เปอร์เซ็นต์ต้องไม่เกิน 100');return}
    const pid=S.ov.id;
    if(S.db){const ok=await dbDo(db=>pid?db.doc('promos/'+pid).set(data):db.collection('promos').add(data),'บันทึกโปรโมชันแล้ว');if(!ok)return}
    else{if(pid)Object.assign(S.promos.find(x=>x.id===pid),data);else S.promos.push(Object.assign({id:'local-p'+Date.now()},data));render(true)}
    S.ov=null;renderOverlay();return;
  }
  if(id==='bankForm'){const no=$('#b_no').value.trim();if(!no){toast('ใส่เลขที่บัญชี');return}
    const item={id:S.ov.id||uid(),bank:$('#b_bank').value,no,name:$('#b_name').value.trim(),display:$('#b_disp').checked,def:$('#b_def').checked};
    let bl=bankList().slice();const i=bl.findIndex(x=>x.id===item.id);if(i>=0)bl[i]=item;else bl.push(item);
    if(item.def)bl=bl.map(x=>Object.assign({},x,{def:x.id===item.id}));else if(!bl.some(x=>x.def))bl[0]=Object.assign({},bl[0],{def:true});
    document.activeElement&&document.activeElement.blur();const ok=await saveShop({banks:bl},'บันทึกบัญชีแล้ว');if(ok){S.ov=null;renderOverlay()}return}
  if(id==='qrForm'){const pp=$('#q_pp').value.replace(/\D/g,''),name=$('#q_name').value.trim();
    if(!name){toast('ใส่ชื่อที่แสดง');return}if(![10,13,15].includes(pp.length)){toast('เลขพร้อมเพย์ต้องเป็นเบอร์ 10 หลัก หรือเลข 13/15 หลัก');return}
    const item={id:S.ov.id&&S.ov.id!=='pp'?S.ov.id:uid(),name,pp,def:$('#q_def').checked};
    let ql=((shop().qrs&&shop().qrs.length)?shop().qrs:qrList().filter(x=>x.id!=='pp'||S.ov.id==='pp'?false:true)).slice();
    const i=ql.findIndex(x=>x.id===item.id);if(i>=0)ql[i]=item;else ql.push(item);
    if(item.def)ql=ql.map(x=>Object.assign({},x,{def:x.id===item.id}));else if(!ql.some(x=>x.def))ql[0]=Object.assign({},ql[0],{def:true});
    document.activeElement&&document.activeElement.blur();const ok=await saveShop({qrs:ql,promptpay:(ql.find(x=>x.def)||ql[0]).pp},'บันทึก QR แล้ว');if(ok){S.ov=null;renderOverlay()}return}
  if(id==='stAddForm'){const v=$('#stName').value.trim();if(!v)return;const base=(shop().stations&&shop().stations.length)?shop().stations:[];
    const ss=base.length?base.slice():[{id:'main',name:'ครัว/บาร์',cats:S.cats.map(c=>c.id)}];ss.push({id:'st'+uid(),name:v,cats:[]});
    document.activeElement&&document.activeElement.blur();await saveShop({stations:ss},'เพิ่มสถานี '+v+' แล้ว');return}
  if(id==='catForm'){const v=$('#catName').value.trim();if(!v)return;const data={name:v,sort:S.cats.length};
    if(S.db){const ok=await dbDo(db=>db.collection('categories').add(data),'สร้างหมวดหมู่แล้ว');if(!ok)return}else{S.cats.push(Object.assign({id:'local-c'+Date.now()},data))}
    $('#catName').value='';render(true);return}
  if(f.dataset.stab){
    const patch={};(SFIELDS[f.dataset.stab]||[]).forEach(k=>{const el=document.getElementById('s_'+k);if(!el)return;patch[k]=el.type==='checkbox'?el.checked:NUMF.includes(k)?(parseFloat(el.value)||0):el.value.trim()});
    if(patch.promptpay!=null){patch.promptpay=patch.promptpay.replace(/\D/g,'');if(patch.promptpay&&![10,13,15].includes(patch.promptpay.length)){toast('เลขพร้อมเพย์ต้องเป็นเบอร์ 10 หลัก หรือเลข 13/15 หลัก');return}}
    if(patch.taxId!=null){patch.taxId=patch.taxId.replace(/\D/g,'');if(patch.taxId&&patch.taxId.length!==13){toast('เลขประจำตัวผู้เสียภาษีต้องมี 13 หลัก');return}}
    if(patch.name!=null&&!patch.name)patch.name='ร้านของคุณ';
    const next=Object.assign({},S.shop,patch);delete next.vatReg;
    if(S.db){const ok=await dbDo(db=>db.doc('settings/shop').set(next),'บันทึกแล้ว');if(!ok)return}else{S.shop=next;toast('บันทึกแล้ว (โหมดทดลอง)')}
    S.shop=next;document.activeElement&&document.activeElement.blur();render(true);
  }
});

/* ===== boot ===== */
{const st=document.createElement('style');st.textContent=RCSS;document.head.appendChild(st)}
tick();setInterval(()=>{tick();if(['kds','open','display'].includes(S.view)&&!S.ov)render();if(S.view==='sell')renderKstrip();if(S.view==='tables'&&!drag&&!S.floorEdit)renderFloor();renderAlert()},15000);
render();
(async()=>{try{S.assets=window.claude&&window.claude.use?await window.claude.use('assets'):null}catch(e){S.assets=null}if(S.ov&&S.ov.k==='editmenu')renderImgPick()})();
(async()=>{try{S.downloads=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){S.downloads=null}if(S.ov||S.view==='history')render(true)})();

function startDemo(){
  if(S.mode!=='loading')return;S.mode='demo';
  S.cats=clone(DEMO.cats);S.opts=clone(DEMO.opts);S.menu=clone(DEMO.menu);S.promos=clone(DEMO.promos);S.tables=clone(DEMO.tables);S.rounds=[];render(true);
}
function rerenderFor(kind){
  if(drag)return;
  if(S.view==='sell'){if(kind==='menu'){renderCats();renderGrid()}renderKstrip();renderBill();if(S.ov)renderOverlay()}
  else if(S.view==='tables')renderFloor();
  else if(!S.ov||kind==='orders')render();
  renderTop();
}
(async function(){
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){startDemo();return}
  S.db=db;S.mode='live';S.rounds=null;
  try{const user=await window.claude.use('user');if(user)S.canEdit=await user.canEdit()}catch(e){}
  const fail=()=>{};
  const sorted=(s)=>s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.sort||0)-(b.sort||0)||String(a.name).localeCompare(String(b.name),'th'));
  db.doc('settings/shop').onSnapshot(s=>{S.shop=s.exists?Object.assign({},s.data()):{};rerenderFor('shop')},fail);
  db.collection('categories').onSnapshot(s=>{S.cats=sorted(s);rerenderFor('menu')},fail);
  db.collection('options').onSnapshot(s=>{S.opts=sorted(s);rerenderFor('menu')},fail);
  db.collection('menu').onSnapshot(s=>{S.menu=sorted(s);rerenderFor('menu')},fail);
  db.collection('promos').onSnapshot(s=>{S.promos=sorted(s);rerenderFor('menu')},fail);
  db.collection('tables').onSnapshot(s=>{S.tables=s.docs.map(d=>{const t=Object.assign({id:d.id},d.data());const p=tSave[d.id];if(p)Object.assign(t,p);return t});rerenderFor('tables')},fail);
  db.collection('orders').where('createdAt','>=',startToday()).onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=norm(Object.assign({id:d.id},d.data()))});S.oToday=m;kdsArrive();rerenderFor('orders')},fail);
  db.collection('orders').where('state','==','open').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=norm(Object.assign({id:d.id},d.data()))});S.oOpen=m;kdsArrive();rerenderFor('orders')},fail);
  db.collection('rounds').where('state','==','open').onSnapshot(s=>{const r=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>b.openedAt-a.openedAt)[0];S.round=r||null;rerenderFor('round')},fail);
  try{S.mcp=window.claude.use?await window.claude.use('mcp'):null}catch(e){S.mcp=null}
  scheduleBridge(3000);
  db.doc('screens/counter').onSnapshot(s=>{S.display=s.exists?s.data():null;if(S.view==='display')render()},fail);
  render(true);
})();
setTimeout(()=>{if(S.mode==='loading')startDemo()},11000);
})();
</script>
