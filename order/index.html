<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F7FB">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>สั่งอาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F7FB;--surface:#FFFFFF;--sunk:#EAF0F6;--ink:#13202C;--muted:#4A545F;--line:#DDE6EF;--line2:#D0DBE6;
  --accent:#105382;--accent-hover:#0C3F62;--on-accent:#FFFFFF;--accent-soft:#E3F2FD;--accent-soft-ink:#125182;
  --cta:#105382;--cta-hover:#0C3F62;--cta-ink:#FFFFFF;--amber:#105382;--amber-ink:#FFFFFF;--amber-soft:#E3F2FD;
  --ok:#2E9D62;--ok-soft:#E7F5EC;--ok-ink:#165C39;--warn-soft:#FDF3DC;--warn-ink:#6D4900;--bad:#973939;--bad-soft:#FDECEC;--bad-ink:#991E1E;
  --t-0:#F2F1EF;--i-0:#8C6A4C;--t-1:#F2F1EF;--i-1:#6F7A52;--t-2:#F2F1EF;--i-2:#A0743A;--t-3:#F2F1EF;--i-3:#7A6070;--t-4:#F2F1EF;--i-4:#9A5A4A;--t-5:#F2F1EF;--i-5:#4F6E6E;
  --scrim:rgba(27,27,27,.38);--shadow:0 8px 28px rgba(27,27,27,.14);
  --f:'Inter','IBM Plex Sans Thai','Noto Sans Thai',Tahoma,sans-serif;--fn:'Inter','IBM Plex Sans Thai',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141414;--surface:#1E1E1E;--sunk:#262626;--ink:#F2F1EE;--muted:#ACAAA4;--line:#2C2C2C;--line2:#3A3A3A;
  --accent:#5EB6F0;--accent-hover:#7CC5F5;--on-accent:#06213A;--accent-soft:#132C40;--accent-soft-ink:#A8D8FA;--amber-soft:#3A2F17;
  --ok:#5CCB8E;--ok-soft:#173326;--ok-ink:#9BE3BC;--warn-soft:#3A2F17;--warn-ink:#F5D97A;--bad:#FF7B7B;--bad-soft:#3B1F1F;--bad-ink:#FFB5B5;
  --t-0:#262626;--i-0:#D2B08F;--t-1:#262626;--i-1:#B9C496;--t-2:#262626;--i-2:#E3B47A;--t-3:#262626;--i-3:#C9A9BC;--t-4:#262626;--i-4:#E09C8C;--t-5:#262626;--i-5:#9CC4C4;
  --scrim:rgba(0,0,0,.6);--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:max(12px,env(safe-area-inset-top))}
.hero{display:flex;align-items:center;gap:12px;padding:8px 0 12px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:20px;flex-shrink:0}
.hero h1{margin:0;font-size:20px;line-height:1.2}
.hero p{margin:2px 0 0;color:var(--muted);font-size:14px}
.where{border:0;margin-left:auto;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:700;font-size:14px;white-space:nowrap}
.ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.way{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;border:1.5px solid var(--line2);border-radius:20px;background:var(--surface);font-weight:700;font-size:19px;padding:16px;text-align:center}
.way svg{width:44px;height:44px;color:var(--accent)}
.way small{font-weight:500;font-size:13px;color:var(--muted)}
.way:hover{border-color:var(--accent)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tbtn{min-height:72px;border:1.5px solid var(--line2);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:20px;font-family:var(--fn)}
.tbtn small{font-family:var(--f);font-weight:500;font-size:13px;color:var(--muted)}
.tbtn:hover{border-color:var(--accent)}
.payinfo{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--accent-soft);color:var(--accent-soft-ink);font-size:15px;line-height:1.5}
.payinfo svg{width:28px;height:28px;flex-shrink:0}
.payinfo b{display:block;font-size:17px}
.payinfo.warn{background:var(--warn-soft);color:var(--warn-ink);border:2px solid #F2B200}
.payinfo.ok{background:var(--ok-soft);color:var(--ok-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line2);background:var(--surface);font-weight:600;white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.note{padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn-ink);font-size:15px;margin:8px 0}
.note.bad{background:var(--bad-soft);color:var(--bad-ink)}
h2.cat{font-size:17px;margin:18px 0 8px}
.items{display:flex;flex-direction:column;gap:10px}
.items.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.items.grid .item{flex-direction:column;align-items:stretch;gap:8px}
.items.grid .item .pic{width:100%;height:auto;aspect-ratio:4/3}
.items.grid .item .pr{align-self:flex-start}
.item .pic{overflow:hidden}
.item .pic img{width:100%;height:100%;object-fit:cover;display:block}
.logo{overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover;display:block}
.cover{margin:12px 0 4px;border-radius:18px;overflow:hidden;aspect-ratio:21/9;background:var(--sunk,#E9EEF4)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.notice{margin:10px 0 10px;padding:10px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:700;font-size:15px;line-height:1.45}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.item .pic{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.item .pic svg{width:30px;height:30px}
.item .info{flex:1;min-width:0}
.item b{display:block;font-size:16px}
.item small{display:block;color:var(--muted);font-size:13px}
.item .pr{font-family:var(--fn);font-weight:600;color:var(--accent);white-space:nowrap}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent-soft-ink);margin-left:4px;vertical-align:2px}
.tag.out{background:var(--bad-soft);color:var(--bad-ink)}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:linear-gradient(transparent,var(--bg) 30%)}
.cartbar button{width:100%;max-width:608px;margin:0 auto;display:flex;align-items:center;gap:10px;height:58px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;padding:0 18px;box-shadow:var(--shadow)}
.cartbar .cnt{min-width:28px;height:28px;border-radius:14px;background:var(--on-accent);color:var(--accent);display:grid;place-items:center;font-size:14px}
.cartbar .num{margin-left:auto}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:21px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{width:44px;height:44px;border:0;border-radius:12px;background:var(--sunk);display:grid;place-items:center;flex-shrink:0}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-t{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--muted);font-size:14px}
.req{font-size:13px;padding:1px 7px;border-radius:6px;background:var(--warn-soft);color:var(--warn-ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:6px 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);font-weight:600}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt small{font-weight:500;opacity:.8}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field textarea{min-height:46px;padding:10px 12px;border:1px solid var(--field,#7A8794);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:400;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-size:20px}
.stepper span{min-width:36px;text-align:center;font-family:var(--fn);font-weight:600;font-size:18px}
.big{height:60px;min-height:60px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:18px;padding:0 18px;flex:1 0 auto}
.ghost{height:48px;border:1px solid var(--line2);border-radius:14px;background:var(--surface);font-weight:600;padding:0 16px}
.line{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .info{flex:1;min-width:0}
.line small{display:block;color:var(--muted);font-size:13px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:18px}
.total .num{font-size:26px}
.hint{font-size:13px;color:var(--muted)}
.status{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:8px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:flex-start;padding-bottom:16px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line2)}
.step i{width:28px;height:28px;border-radius:14px;border:2px solid var(--line2);background:var(--surface);flex-shrink:0;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700}
.step.pay{background:var(--bad-soft);border:2px solid var(--bad);border-radius:14px;padding:10px 12px;margin:2px 0 14px -14px;animation:paypulse 1.2s ease-in-out infinite}
.step.pay::before{display:none}
.step.pay i{background:var(--bad);border-color:var(--bad);color:#fff}
.step.pay b{color:var(--bad-ink);font-size:17px}
.step.pay small{color:var(--bad-ink)}
@keyframes paypulse{50%{box-shadow:0 0 0 4px var(--bad-soft)}}
@media (prefers-reduced-motion:reduce){.step.pay{animation:none}}
.step.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur i{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-soft-ink)}
.step.cur b{color:var(--accent)}
.step small{display:block;color:var(--muted);font-size:13px}
.big-no{font-family:var(--fn);font-size:44px;font-weight:600;color:var(--accent);line-height:1}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
/* ===== Theme: warm neutral + black + amber ===== */
html,body{font-size:15px;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--cta);outline-offset:2px}
.logo{border-radius:12px}
.hero h1{font-weight:600;font-size:19px;letter-spacing:-.01em}
.where{background:var(--surface);border:1px solid var(--line2);color:var(--ink);font-weight:600}
.way{border:1px solid var(--line);border-radius:16px;font-weight:600;box-shadow:0 1px 2px rgba(27,27,27,.04)}
.way svg{color:var(--ink)}
.way:hover,.tbtn:hover{border-color:#CFCCC6}
.tbtn{border:1px solid var(--line);border-radius:14px;background:var(--sunk)}
.chip{height:36px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--surface);border-color:var(--line2);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(27,27,27,.06)}
h2.cat{font-weight:600;font-size:16px}
.item{border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;gap:12px}
.item .pic{width:76px;height:76px;border-radius:10px;background:var(--sunk) !important}
.item b{font-weight:500;font-size:15px}
.item .pr{color:var(--ink);font-weight:600}
.items.grid .item{padding:6px}
.items.grid .item .info,.items.grid .item .pr{padding:0 4px}
.items.grid .item .pr{padding-bottom:4px}
.tag{background:var(--sunk);color:var(--ink)}
.notice{background:var(--amber-soft);color:var(--warn-ink);font-weight:600}
.cartbar button{background:var(--cta);color:var(--cta-ink);border-radius:14px;font-weight:600}
.cartbar .cnt{background:var(--cta-ink);color:var(--cta)}
.big{background:var(--cta);color:var(--cta-ink);border-radius:14px;font-weight:600}
.big:hover:not(:disabled){background:var(--cta-hover)}
.ghost{border-radius:12px;font-weight:500}
.scrim{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{border-radius:20px 20px 0 0}
.sheet h2{font-weight:600;font-size:19px}
.x{border-radius:10px;background:var(--sunk);color:var(--ink);width:38px;height:38px}
.grp-t{color:var(--ink)}
.req{background:var(--amber-soft);color:var(--warn-ink)}
.opt{border:1px solid var(--line2);border-radius:10px;font-weight:500}
.opt[aria-pressed="true"]{background:var(--sunk);border-color:var(--cta);color:var(--ink);box-shadow:inset 0 0 0 1px var(--cta)}
.field input,.field textarea{border-radius:10px}
.field input:focus,.field textarea:focus{outline:0;border-color:#BDB9B2;box-shadow:0 0 0 3px rgba(246,190,85,.25)}
.stepper button{width:40px;height:40px;border-radius:10px}
.line{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.status{border-radius:16px}
.step.cur i{border-color:var(--cta);background:var(--amber-soft);color:var(--warn-ink)}
.step.cur b{color:var(--ink)}
.big-no{color:var(--ink)}
.payinfo{background:var(--sunk);color:var(--ink)}
.payinfo.warn{border:1.5px solid var(--cta)}
.hero [data-eplang]{margin-left:auto}.hero .where:not([hidden])+[data-eplang]{margin-left:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.toast{background:var(--surface);color:var(--ink);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(27,27,27,.14);border-left:4px solid var(--cta)}
.logo{background:linear-gradient(135deg,#5EC2FF,#1F7FD1);color:#fff}
.hero{flex-wrap:wrap}.hero > div:nth-child(2){flex:1 1 140px;min-width:0}.hero h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hero .where{margin-left:0}.hero [data-eplang]{margin-left:auto !important}
.chip[aria-pressed="true"]{border-color:#A8D8FA;background:var(--amber-soft)}
.item .pic .defpic{width:100%;height:100%;display:block}
</style>
</head>
<body>
<header class="top"><div class="wrap" style="padding-bottom:0">
  <div class="hero"><div class="logo" id="logo"><img src="/easypos.svg?v=2" alt="Coconut POS"></div><div><h1 id="shopName" data-noi18n>กำลังโหลด…</h1><p id="shopSub">สั่งอาหารออนไลน์</p></div><button class="where" id="where" type="button" data-act="changeway" hidden></button><span data-eplang></span></div>
  <div class="cover" id="cover" hidden></div><div class="notice" id="notice" role="note" hidden></div>
  <nav class="chips" id="cats" aria-label="หมวดหมู่"></nav>
</div></header>
<main class="wrap" id="main"><div class="empty">กำลังโหลดเมนู…</div></main>
<div class="cartbar" id="cartbar" hidden><button id="cartBtn" type="button"><span class="cnt num" id="cartCnt">0</span><span>ดูตะกร้า</span><span class="num" id="cartTotal">฿0</span></button></div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ===== Default menu pictures (no photo yet): a drawn picture picked from the item's name ===== */
const DEFPIC_TINT={latte:['#C8936A','#F3E2CF'],matcha:['#7FA35B','#EEF4E4'],thai:['#E8843A','#FBE9D8'],cocoa:['#7A4E36','#F1E3D8'],tea:['#C9852F','#FBF0DC'],soda:['#5BB7D9','#E3F4FA'],pink:['#E38AA6','#FCE7EE'],coffee:['#5C3A28','#EFE3D6']};
function defPicKind(m,drink){const t=((m.name||'')+' '+(m.en||'')).toLowerCase();const has=(...w)=>w.some(x=>t.includes(x));
  if(has('ครัวซอง','croissant'))return ['croissant'];
  if(has('คุกกี้','cookie','บิสกิต','biscuit'))return ['cookie'];
  if(has('เค้ก','cake','ชีส','cheese','บราวนี่','brownie','ทาร์ต','tart','พาย','pie'))return ['cake'];
  if(has('ขนมปัง','bread','โทสต์','toast','แซนด์','sandwich','เบเกิล','bagel','มัฟฟิน','muffin','วาฟเฟิล','waffle'))return ['bread'];
  if(has('ข้าว','rice','ก๋วยเตี๋ยว','noodle','บะหมี่','ผัด','สปาเก','pasta','ราเมน','ramen','ต้ม','soup','แกง','curry'))return ['bowl'];
  const iced=has('เย็น','iced','ice ','ปั่น','frappe','smoothie','โซดา','soda','น้ำผลไม้','juice','ชาไทย','thai tea','มัทฉะ','matcha','ชาเขียว','green tea','โกโก้','cocoa','ช็อก','choco','นม','milk','ชา','tea','มะนาว','lemon','สตรอ','straw','เลมอน');
  const tint=has('มัทฉะ','matcha','ชาเขียว','green tea')?'matcha':has('ชาไทย','thai tea','ชานม')?'thai':has('โกโก้','cocoa','ช็อก','choco')?'cocoa':has('โซดา','soda','มะนาว','lemon','เลมอน','น้ำ ')?'soda':has('สตรอ','straw','พิงค์','pink')?'pink':has('ชา','tea')?'tea':'latte';
  if(has('ร้อน','hot','เอสเพรสโซ่','espresso')||(!iced&&has('กาแฟ','coffee','ลาเต้','latte','อเมริกาโน','americano','คาปู','cappu','มอคค่า','mocha','แฟลตไวท์','flat white')))return ['hot',tint==='latte'?'coffee':tint];
  if(iced||drink)return ['iced',tint];
  return ['dish']}

function payInfo(cls,title,body,icon){return '<div class="payinfo '+(cls||'')+'">'+ic(icon||'cash')+'<div><b>'+title+'</b>'+body+'</div></div>'}
function myOrdersHtml(){var l=myOrders().filter(function(x){return Date.now()-x.at<12*3600*1000});if(!l.length)return '';
  return '<h2 class="cat">ออเดอร์ของฉัน</h2><div class="items">'+l.map(function(x,i){return '<button class="item" data-act="track" data-v="'+esc(x.t)+'"><span class="info"><b>ออเดอร์ที่ '+(l.length-i)+'</b><small>สั่งเมื่อ '+new Date(x.at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' · แตะเพื่อดูสถานะ</small></span></button>'}).join('')+'</div>'}

function stepsHtml(o,r){var paid=!!o.paid||r>=2;
  var list=[['ส่งออเดอร์แล้ว','ร้านได้รับออเดอร์ของคุณ',r>=1||paid?'done':'cur'],
    paid?['ชำระเงินแล้ว','ขอบคุณค่ะ','done']:['กรุณาไปชำระเงินที่เคาน์เตอร์','แจ้งหมายเลข '+(o.no||'')+(o.type==='dine'&&o.table?' (โต๊ะ '+o.table+')':'')+' กับพนักงาน ร้านจะเริ่มทำหลังชำระเงิน','pay'],
    ['ส่งเข้าครัวแล้ว','รอคิวทำ',!paid?'':r>=2?'done':'cur'],
    ['กำลังทำ','บาริสต้ากำลังเตรียม',!paid?'':r>2?'done':r===2?'cur':''],
    ['พร้อมเสิร์ฟ','รอรับที่เคาน์เตอร์ หรือพนักงานนำไปเสิร์ฟ',!paid?'':r>3?'done':r===3?'cur':''],
    ['เสร็จแล้ว','ขอให้อร่อย',r>=4&&paid?'done':'']];
  return '<div class="steps">'+list.map(function(s,i){return '<div class="step '+s[2]+'"'+(s[2]==='pay'?' role="alert"':'')+'><i>'+(s[2]==='done'?'✓':s[2]==='pay'?'!':i+1)+'</i><div><b>'+s[0]+'</b><small>'+s[1]+'</small></div></div>'}).join('')+'</div>'}
var STEPS=[['accepted','ร้านรับออเดอร์แล้ว','ส่งเข้าครัวเรียบร้อย'],['making','กำลังทำ','บาริสต้ากำลังเตรียม'],['ready','พร้อมเสิร์ฟ','รอรับที่เคาน์เตอร์ หรือพนักงานนำไปเสิร์ฟ'],['done','เสร็จแล้ว','ขอให้อร่อย']];
function renderStatus(){
  var o=S.order;var m=$('#main');
  if(!o){m.innerHTML='<div class="empty">กำลังโหลดสถานะ…</div>';return}
  var rank={'new':0,accepted:1,making:2,ready:3,done:4};var r=rank[o.status];
  var stop=o.status==='cancelled'||o.status==='rejected';
  m.innerHTML='<div class="status"><div class="row"><div><div class="hint">หมายเลขออเดอร์</div><div class="big-no">'+esc(o.no||'—')+'</div></div><div style="text-align:right"><div class="hint">'+(o.type==='dine'?'โต๊ะ':'สั่งกลับบ้าน')+'</div><b style="font-size:22px">'+esc(o.table||'')+'</b></div></div>'+
    (stop?'<div class="note bad">ร้านยกเลิกออเดอร์นี้ '+esc(o.reason||'')+' กรุณาติดต่อพนักงาน</div>':
    stepsHtml(o,r))+
    '<div>'+(o.items||[]).map(function(l){return '<div class="line"><div class="info"><b>'+l.qty+' × '+esc(l.name)+'</b>'+(l.opts?'<small>'+esc(l.opts)+'</small>':'')+'</div><span class="num">'+baht(l.unit*l.qty)+'</span></div>'}).join('')+'</div>'+
    '<div class="total"><span>ยอดรวม</span><span class="num">'+baht(o.total)+'</span></div>'+
    (stop?'':o.paid?payInfo('ok','ชำระเงินแล้ว','ขอบคุณที่อุดหนุน','check'):'')+
    '<div class="row"><button class="ghost" data-act="back" style="flex:1">'+(S.type?'สั่งเพิ่ม':'กลับไปที่เมนู')+'</button></div></div>';
}
function render(){renderHeader();if(S.view==='status')renderStatus();else renderMenu();renderCartBar();renderSheet()}

/* sheets */
function renderSheet(){
  var el=$('#sheet');var v=S.sheet;if(!v){el.innerHTML='';return}
  if(v.k==='item'){
    var m=S.menu.find(function(x){return x.id===v.id});if(!m){S.sheet=null;el.innerHTML='';return}
    var price=m.price,ok=true;
    var gh=optsOf(m).map(function(g){var sel=v.sel[g.id]||[];if(g.required&&!sel.length)ok=false;
      sel.forEach(function(cid){var c=(g.choices||[]).find(function(x){return x.id===cid});if(c)price+=+c.price||0});
      return '<div class="grp"><div class="grp-t">'+esc(g.name)+(g.required?' <span class="req">จำเป็น</span>':'')+((g.max||1)>1?' <span class="hint">เลือกได้ไม่เกิน '+g.max+'</span>':'')+'</div><div class="opts">'+
        (g.choices||[]).map(function(c){return '<button class="opt" data-act="choice" data-g="'+esc(g.id)+'" data-c="'+esc(c.id)+'" aria-pressed="'+(sel.indexOf(c.id)>=0)+'"'+(c.soldOut?' disabled':'')+'>'+esc(c.name)+(c.soldOut?' <small>หมด</small>':c.price?' <small>+'+c.price+'</small>':'')+'</button>'}).join('')+'</div></div>'}).join('');
    el.innerHTML='<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sT"><div class="sh-head"><div><h2 id="sT">'+esc(m.name)+'</h2><div class="hint">'+esc(m.en||'')+' · '+baht(m.price)+'</div></div><button class="x" data-act="close" aria-label="ปิด">'+ic('x')+'</button></div>'+gh+
      '<label class="field" for="note">หมายเหตุ<input id="note" maxlength="60" placeholder="เช่น น้ำแข็งน้อย" value="'+esc(v.note||'')+'"></label>'+
      '<div class="row"><div class="stepper"><button data-act="qty" data-d="-1" aria-label="ลดจำนวน">−</button><span>'+v.qty+'</span><button data-act="qty" data-d="1" aria-label="เพิ่มจำนวน">+</button></div><button class="big" data-act="add"'+(ok?'':' disabled')+'>'+(ok?'ใส่ตะกร้า':'เลือกตัวเลือกให้ครบ')+' · <span class="num">'+baht(price*v.qty)+'</span></button></div></div></div>';
  }else if(v.k==='cart'){
    var t=0;S.cart.forEach(function(l){t+=l.unit*l.qty});
    el.innerHTML='<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cT"><div class="sh-head"><h2 id="cT">ตะกร้า · '+(S.type==='dine'?'โต๊ะ '+esc(tableName()):'สั่งกลับบ้าน')+'</h2><button class="x" data-act="close" aria-label="ปิด">'+ic('x')+'</button></div>'+
      (S.cart.length?S.cart.map(function(l,i){return '<div class="line"><div class="info"><b>'+esc(l.name)+'</b>'+(l.opts?'<small>'+esc(l.opts)+'</small>':'')+'<div class="stepper" style="margin-top:6px"><button data-act="cqty" data-i="'+i+'" data-d="-1" aria-label="ลดจำนวน">−</button><span>'+l.qty+'</span><button data-act="cqty" data-i="'+i+'" data-d="1" aria-label="เพิ่มจำนวน">+</button></div></div><span class="num" style="font-weight:600">'+baht(l.unit*l.qty)+'</span></div>'}).join(''):'<div class="empty">ตะกร้าว่าง</div>')+
      '<label class="field" for="cname">ชื่อ'+(S.type==='take'?' (สำหรับเรียกรับ)':' (ไม่บังคับ)')+'<input id="cname" maxlength="60" autocomplete="name" value="'+esc(v.name||'')+'"'+(S.type==='take'?' required':'')+'></label>'+
      '<label class="field" for="cphone">เบอร์โทร (ไม่บังคับ · สะสมแต้มสมาชิก)<input id="cphone" inputmode="tel" maxlength="12" autocomplete="tel" value="'+esc(v.phone||'')+'"></label>'+
      '<div class="total"><span>ยอดรวม</span><span class="num">'+baht(t)+'</span></div>'+payInfo('warn','ต้องชำระเงินที่เคาน์เตอร์','หลังกดสั่ง กรุณามาชำระเงินที่เคาน์เตอร์ และแจ้งหมายเลขออเดอร์'+(S.type==='dine'?'หรือหมายเลขโต๊ะ':'')+' ร้านจะเริ่มทำเมื่อชำระเงินแล้ว ยังไม่รับชำระผ่านมือถือ')+
      '<button class="big" data-act="order"'+(S.cart.length&&!S.busy?'':' disabled')+'>'+(S.busy?'กำลังส่ง…':'ยืนยันสั่ง · ชำระที่เคาน์เตอร์')+'</button></div></div>';
  }
}
function keepSheetInputs(){var v=S.sheet;if(!v)return;var n=$('#note');if(n)v.note=n.value;var a=$('#cname');if(a)v.name=a.value;var p=$('#cphone');if(p)v.phone=p.value}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,d=b.dataset;
  if(a==='close'&&b.classList.contains('scrim')&&e.target!==b)return;
  keepSheetInputs();
  if(a==='cat'){S.cat=d.v;render();window.scrollTo({top:0})}
  else if(a==='take'||(a==='choose'&&d.v==='take')){S.type='take';S.tableId=null;setUrl({type:'take'});render();window.scrollTo({top:0})}
  else if(a==='choose'){S.type='dine';S.tableId=null;render();window.scrollTo({top:0})}
  else if(a==='pickt'){S.type='dine';S.tableId=d.id;setUrl({t:d.id});render();window.scrollTo({top:0})}
  else if(a==='changeway'){if(S.view==='status')return;S.type=null;S.tableId=null;S.cat='all';setUrl({});render();window.scrollTo({top:0})}
  else if(a==='item'){var m=S.menu.find(function(x){return x.id===d.id});if(!m||m.soldOut)return;var sel={};
    optsOf(m).forEach(function(g){if(g.required&&(g.max||1)===1){var c=(g.choices||[]).find(function(x){return !x.soldOut});if(c)sel[g.id]=[c.id]}});
    S.sheet={k:'item',id:m.id,sel:sel,qty:1,note:''};renderSheet()}
  else if(a==='choice'){var v=S.sheet;var g=S.opts.find(function(o){return o.id===d.g});var sel=(v.sel[g.id]||[]).slice();var i=sel.indexOf(d.c);var max=g.max||1;
    if(i>=0){if(!(g.required&&max===1))sel.splice(i,1)}else if(max===1)sel=[d.c];else if(sel.length<max)sel.push(d.c);else{toast('เลือกได้ไม่เกิน '+max);return}
    v.sel[g.id]=sel;renderSheet()}
  else if(a==='qty'){S.sheet.qty=Math.max(1,Math.min(20,S.sheet.qty+(+d.d)));renderSheet()}
  else if(a==='add'){var v2=S.sheet,m2=S.menu.find(function(x){return x.id===v2.id});var ch=[],names=[],unit=m2.price;
    optsOf(m2).forEach(function(g){(v2.sel[g.id]||[]).forEach(function(cid){var c=g.choices.find(function(x){return x.id===cid});if(c){ch.push(c.id);names.push(c.name);unit+=+c.price||0}})});
    var note=(v2.note||'').trim();var opts=names.concat(note?[note]:[]).join(' · ');
    var ex=S.cart.find(function(l){return l.id===m2.id&&l.opts===opts});if(ex)ex.qty=Math.min(20,ex.qty+v2.qty);else S.cart.push({id:m2.id,name:m2.name,choices:ch,note:note,opts:opts,unit:unit,qty:v2.qty});
    saveCart();S.sheet=null;render();toast('ใส่ตะกร้าแล้ว')}
  else if(a==='cqty'){var l=S.cart[+d.i];if(l){l.qty+=+d.d;if(l.qty<=0)S.cart.splice(+d.i,1);else if(l.qty>20)l.qty=20}saveCart();if(!S.cart.length)S.sheet=null;render()}
  else if(a==='close'){S.sheet=null;renderSheet()}
  else if(a==='order')placeOrder();
  else if(a==='track'){openStatus(d.v)}
  else if(a==='back'){stopPoll();S.view='menu';S.order=null;var p2=new URLSearchParams(location.search);p2.delete('o');history.replaceState(null,'',p2.toString()?'?'+p2.toString():location.pathname);render()}
});
$('#cartBtn').addEventListener('click',function(){S.sheet={k:'cart',name:localGet('cname'),phone:localGet('cphone')};renderSheet()});
function setUrl(o){var p=new URLSearchParams();Object.keys(o).forEach(function(k){p.set(k,o[k])});history.replaceState(null,'',p.toString()?'?'+p.toString():location.pathname)}
function localGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function localSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function placeOrder(){
  keepSheetInputs();var v=S.sheet;
  if(S.type==='take'&&!(v.name||'').trim()){toast('ใส่ชื่อสำหรับเรียกรับก่อน');var i=$('#cname');i&&i.focus();return}
  S.busy=true;renderSheet();
  localSet('cname',v.name||'');localSet('cphone',v.phone||'');
  rpc(SLUG?'cafe_order':'cafe_place_order',Object.assign(SLUG?{p_shop:SLUG}:{},{p_table:S.tableId||'',p_type:S.type,p_items:S.cart.map(function(l){return {id:l.id,qty:l.qty,choices:l.choices,note:l.note}}),p_name:v.name||null,p_phone:v.phone||null,p_note:null}))
    .then(function(r){S.busy=false;S.cart=[];saveCart();S.sheet=null;rememberOrder(r.token);openStatus(r.token)})
    .catch(function(e){S.busy=false;renderSheet();toast(ERR[e.code]||'ส่งออเดอร์ไม่สำเร็จ ลองใหม่อีกครั้ง');if(e.code==='item_unavailable'||e.code==='choice_unavailable')loadMenu()});
}
var pollT=null;
function stopPoll(){clearTimeout(pollT);pollT=null}
function openStatus(tok){stopPoll();S.token=tok;S.view='status';S.order=null;S.sheet=null;var p=new URLSearchParams(location.search);p.set('o',tok);history.replaceState(null,'','?'+p.toString());render();window.scrollTo({top:0});poll()}
function poll(){
  rpc('cafe_order_status',{p_token:S.token}).then(function(o){if(S.view!=='status')return;S.order=o||{status:'cancelled',reason:'ไม่พบออเดอร์'};renderStatus();
    var fin=o&&(['cancelled','rejected'].indexOf(o.status)>=0||(o.status==='done'&&o.paid));if(!fin)pollT=setTimeout(poll,document.hidden?15000:5000)})
  .catch(function(){if(S.view==='status')pollT=setTimeout(poll,10000)});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.view==='status'&&!pollT){poll()}});

function loadMenu(){
  return rpc(SLUG?'cafe_menu':'cafe_get_menu',SLUG?{p_shop:SLUG}:{}).then(function(r){if(r&&r.error==='no_shop'){$('#main').innerHTML='<div class="empty"><b>ไม่พบร้านนี้</b>ตรวจสอบลิงก์หรือสแกน QR ที่ร้านอีกครั้ง</div>';$('#shopName').textContent='ไม่พบร้าน';$('#shopSub').textContent='Coconut POS';return}
    var mm=(r&&r.menu)||{};S.shop=(r&&r.shop)||{};S.menu=mm.menu||[];S.cats=mm.cats||[];S.opts=mm.options||[];S.tables=mm.tables||[];
    S.cart=S.cart.filter(function(l){var m=S.menu.find(function(x){return x.id===l.id});return m&&!m.soldOut});saveCart();
    render();
  }).catch(function(){$('#main').innerHTML='<div class="note bad">โหลดเมนูไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่</div>'});
}
loadMenu().then(function(){var o=qs.get('o');if(o&&/^[0-9a-f-]{36}$/i.test(o))openStatus(o)});
setInterval(function(){if(S.view==='menu'&&!S.sheet&&!document.hidden)loadMenu()},30000);
})();
</script>

<script src="/easypos-i18n.js"></script>
